<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2C6B">
<meta name="description" content="Ôn thi trắc nghiệm Giải phẫu bệnh – Răng Hàm Mặt HIU: luyện tập, thi thử, flashcard, ôn câu sai.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GPB HIU">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ôn thi Giải phẫu bệnh – HIU</title>
<style>
:root{
  --pri:#5B2A86;--pri-600:#6D35A0;--pri-50:#F6F1FA;--pri-100:#ECE2F5;--pri-200:#D9C7EA;
  --acc:#C2185B;--acc-50:#FCE7EF;
  --ink:#1F1430;--muted:#6B6280;--line:#E7E1EE;--bg:#F7F3FB;--card:#fff;
  --ok:#047857;--ok-bg:#ECFDF5;--bad:#DC2626;--bad-bg:#FEF2F2;--warn:#B45309;--warn-bg:#FFFBEB;
  --l1:#047857;--l2:#6D35A0;--l3:#B45309;--l4:#C2185B;
  --r:14px;--shadow:0 1px 2px rgba(31,20,48,.05),0 4px 14px rgba(91,42,134,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri)}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.top h1{font-size:16px;margin:0;line-height:1.2}
.top small{color:var(--muted);font-size:12.5px}
main{max-width:880px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 2px calc(6px + var(--safe-b))}
nav.tabs .in{display:flex;max-width:880px;width:100%}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:6px 1px;border-radius:10px;color:var(--muted);
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs button svg{width:22px;height:22px;flex:none}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs button{position:relative}
.bd{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:17px;line-height:16px;text-align:center}
@media(min-width:900px){
  nav.tabs{position:sticky;top:57px;bottom:auto;border:0;border-bottom:1px solid var(--line);padding:4px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;min-height:44px}
  main{padding-bottom:40px}
  .bd{position:static;margin-left:2px}
}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--pri);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--pri);background:var(--pri);color:#fff;font-weight:600;font-size:15.5px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--pri);border-color:var(--pri-200)}
.btn.soft{background:var(--pri-50);color:var(--pri);border-color:var(--pri-100)}
.btn.danger{background:#fff;color:var(--bad);border-color:#fecaca}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;white-space:nowrap;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.bar{height:8px;background:var(--pri-100);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--pri-50);color:var(--pri);font-weight:600}
.tag.l1{background:#E7F6F0;color:var(--l1)}.tag.l2{background:var(--pri-50);color:var(--l2)}
.tag.l3{background:#FDF1E3;color:var(--l3)}.tag.l4{background:var(--acc-50);color:var(--l4)}
.tag.hi{background:#FFF7E6;color:#8A5300}
.tag.mr{background:#E8F1FD;color:#1D4ED8}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45;margin:12px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 14px;min-height:54px;font-size:16px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--pri-50);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:hover{border-color:var(--pri-200)}
.opt.sel{border-color:var(--pri);background:var(--pri-50)}
.opt.sel .k{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);border:1px solid #a7f3d0}
.fb.bad{background:var(--bad-bg);border:1px solid #fecaca}
.fb.neutral{background:var(--pri-50);border:1px solid var(--pri-100)}
.fb b.t{display:block;margin-bottom:4px}
.ex{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.trap{margin-top:10px;background:#FFF7E6;border:1px solid #FCD9A8;color:#6B3E00;border-radius:12px;padding:10px 12px;font-size:14.5px}
.flag{margin-top:10px;background:var(--warn-bg);border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 12px;font-size:14px}
.src{margin-top:8px;font-size:12.5px;color:var(--muted)}
.nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.nav3 .btn{padding:10px 6px;font-size:15px}
input[type=search]{font:inherit;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff;width:100%}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri);background:var(--pri-50);padding:6px 12px;border-radius:10px}
.timer.low{color:var(--bad);background:var(--bad-bg)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qgrid button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.qgrid button.ans{background:var(--pri-100);border-color:var(--pri-200)}
.qgrid button.cur{outline:2px solid var(--pri)}
/* flashcard */
.fc-wrap{perspective:1200px}
.fc{position:relative;width:100%;min-height:360px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:20px 18px;
  display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .back{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,var(--pri-50))}
.fc .face .lb{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fc .front .q{font-size:17.5px;font-weight:600;margin:14px 0 10px;line-height:1.45}
.fc .front ol{margin:0 0 auto;padding-left:22px;font-size:15px;color:#3b3050}
.fc .front ol li{margin:4px 0}
.fc .back .ans{font-size:19px;font-weight:700;color:var(--pri);margin:12px 0 10px}
.fc .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .q{font-size:14.5px}
.pill{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.topicrow{margin:10px 0}
.topicrow .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.score{font-size:44px;font-weight:800;color:var(--pri);line-height:1;font-variant-numeric:tabular-nums}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h th,table.h td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.h th{color:var(--muted);font-weight:600;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exam-card{display:flex;justify-content:space-between;align-items:center;gap:12px}
.exam-card .n{width:46px;height:46px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--pri-100);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input:checked{background:var(--pri)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked::after{left:23px}
.pair b{color:var(--acc)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
details.res{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
details.res+details.res{margin-top:8px}
details.res summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details.res summary::-webkit-details-marker{display:none}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:24px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">GPB</div>
  <div><h1>Ôn thi Giải phẫu bệnh – HIU</h1><small id="subtitle"></small></div>
</div></header>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
// Ngân hàng câu hỏi Giải phẫu bệnh – HIU (tự sinh từ bank.json; sửa câu hỏi trong Excel/nguồn rồi sinh lại)
// QUESTIONS: c=mã, t=bài, l=mức độ(1-4), p=ưu tiên(C/T/Th), q=câu hỏi, o=4 phương án, a=chỉ số đáp án đúng,
// e=giải thích, w=vì sao phương án khác sai, k=bẫy, f=cần xác minh, s=nguồn. {#i} = chữ cái của phương án i khi hiển thị.
const CH = {"1.1":"Giới thiệu môn GPB","1.2":"Kỹ thuật GPB","1.3":"Tổn thương tế bào và mô","2.4":"Rối loạn tuần hoàn","2.5":"Viêm và sửa chữa","3.6":"Bệnh lý u","3.7":"Bệnh học tuyến nước bọt","3.8":"Bệnh học khoang miệng","MR":"Mở rộng (ngoài slide, có nguồn)"};
const LV = {"1":"Dễ","2":"Trung bình","3":"Khó","4":"Rất khó"};
const LVN = {"1":"Nhận biết","2":"Thông hiểu","3":"Vận dụng","4":"Vận dụng cao"};
const QUESTIONS = [{"c":"GPB11-01","t":"1.1","l":1,"p":"C","y":"Chọn đáp án sai","q":"Thuật ngữ nào sau đây KHÔNG được bài giảng dùng như tên gọi đồng nghĩa của môn Giải phẫu bệnh?","o":["Physiopathology","Pathology","Histopathology","Anapathology"],"a":0,"e":"Slide định nghĩa ghi: Pathology = Histopathology = Anapathology; GPB còn gọi là bệnh học. Physiopathology (sinh lý bệnh) là môn khác.","w":"","k":"","f":"","s":"1.1 – slide 14"},{"c":"GPB11-02","t":"1.1","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Ai được xem là “father of cellular pathology” (cha đẻ bệnh học tế bào/bệnh học hiện đại)?","o":["Giovanni Morgagni","Carl Rokitansky","Julius Cohnheim","Rudolf Virchow"],"a":3,"e":"Virchow (1821–1902) xuất bản “Bệnh học tế bào” (1858), nêu 2 học thuyết: mọi tế bào đều xuất nguồn từ tế bào khác; bệnh học là sự thay đổi cấu trúc và chức năng tế bào.","w":"Morgagni: khai sinh GPB đối chiếu lâm sàng – GPB (đại thể). Rokitansky: bộ sách 3 tập, thuyết rối loạn thể dịch. Cohnheim: trợ lý của Virchow, dùng phương pháp cắt lạnh.","k":"Dễ nhầm Morgagni (khai sinh môn GPB) với Virchow (cha đẻ bệnh học tế bào).","f":"","s":"1.1 – slide 12"},{"c":"GPB11-03","t":"1.1","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Năm 1543, ai xuất bản bộ sách “De humani corporis fabrica” và được xem là cha đẻ môn Giải phẫu học?","o":["William Harvey","Claudius Galen","Andreas Vesalius","Hippocrates"],"a":2,"e":"Andreas Vesalius (1514–1564), GS GPH ở Padua, xuất bản “Về cấu tạo cơ thể người” năm 1543.","w":"Harvey: phát hiện vòng tuần hoàn lớn (1619/1628). Galen: sách GPH dựa trên phẫu tích động vật, dùng đến TK XVI. Hippocrates: “the father of medicine”.","k":"","f":"","s":"1.1 – slide 9"},{"c":"GPB11-04","t":"1.1","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Theo bài giảng, nhà khoa học nào đã ghi nhận đầy đủ 4 triệu chứng của viêm: sưng, nóng, đỏ, đau?","o":["Celsus","Hippocrates","Galen","Rudolf Virchow"],"a":0,"e":"Celsus (học giả La Mã, đầu TK I) phân bệnh thành 3 nhóm và ghi nhận đầy đủ 4 triệu chứng viêm.","w":"","k":"Hay bị đánh tráo với Galen (cùng slide) hoặc Hippocrates.","f":"","s":"1.1 – slide 7"},{"c":"GPB11-05","t":"1.1","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Trong nhuộm H&E, kết quả màu đúng là:","o":["Hematoxylin nhuộm bào tương màu hồng; eosin nhuộm nhân màu tím","Hematoxylin nhuộm sợi collagen màu xanh; eosin nhuộm nhân màu đỏ","Cả hai đều nhuộm nhân, chỉ khác cường độ","Hematoxylin nhuộm nhân màu xanh/tím; eosin nhuộm bào tương màu hồng"],"a":3,"e":"Hematoxylin nhuộm nhân màu xanh hoặc tím; eosin nhuộm bào tương và thành phần khác màu hồng.","w":"","k":"","f":"","s":"1.1 – slide 18"},{"c":"GPB11-06","t":"1.1","l":1,"p":"C","y":"So sánh – ghép cặp","q":"Phương pháp nhuộm đặc biệt nào làm nổi bật sợi reticulin (thấy sợi màu đen lót dưới mao mạch dạng xoang ở gan)?","o":["Ba màu Masson","Gomori","PAS","Orcein"],"a":1,"e":"Bảng nhuộm đặc biệt: Masson – collagen; Gomori – reticulin; PTAH – fibrin; Orcein – sợi đàn hồi; PAS – polysaccharid; Oil red O – lipid; Đỏ Congo – amyloid.","w":"Masson làm collagen bắt màu xanh; PAS cho hạt hồng (polysaccharid); Orcein nhuộm sợi đàn hồi.","k":"","f":"","s":"1.1 – slide 20"},{"c":"GPB11-07","t":"1.1","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Kỹ thuật Karyotype (nhiễm sắc thể đồ) được dùng để:","o":["Khuếch đại đoạn gen đích để phát hiện đột biến","Định vị kháng nguyên trên mô bằng kháng thể đơn dòng","Phân tích bộ NST, phát hiện bất thường số lượng và cấu trúc (Down, Turner, Klinefelter)","Nhuộm sợi đàn hồi trong thành mạch"],"a":2,"e":"Karyotype thuộc kỹ thuật di truyền tế bào: phân tích bộ NST, phát hiện bất thường số lượng và cấu trúc trong các hội chứng di truyền.","w":"","k":"","f":"","s":"1.1 – slide 23"},{"c":"GPB11-13","t":"1.1","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Theo slide “GPB trong kỷ nguyên 4.0”, giải phẫu bệnh kỹ thuật số là:","o":["Khuếch đại DNA bằng polymerase","Phân tích bộ nhiễm sắc thể","Nuôi cấy tế bào trong phòng thí nghiệm","Số hóa tiêu bản để dễ hội chẩn từ xa và chia sẻ dữ liệu"],"a":3,"e":"Kỷ nguyên 4.0: trí tuệ nhân tạo hỗ trợ phân tích hình ảnh mô học; GPB kỹ thuật số (số hóa tiêu bản, hội chẩn từ xa); dữ liệu lớn và hệ thống hỗ trợ quyết định lâm sàng.","w":"","k":"","f":"","s":"1.1 – slide 25"},{"c":"GPB11-14","t":"1.1","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Kỹ thuật được slide nêu để phát hiện đột biến gen trong ung thư đại trực tràng, ung thư phổi và HPV/ung thư cổ tử cung là:","o":["Karyotype","Nhuộm Gomori","Nhuộm H&E","PCR (phản ứng khuếch đại DNA bằng polymerase)"],"a":3,"e":"Kỹ thuật sinh học phân tử: PCR (và RT-PCR) phát hiện đột biến gen trong K ĐTT, phổi, HPV/K cổ tử cung; lai tại chỗ gắn huỳnh quang phát hiện bất thường gen; phân tích đa omics để cá thể hóa điều trị.","w":"","k":"","f":"","s":"1.1 – slide 13, 24"},{"c":"GPB11-08","t":"1.1","l":2,"p":"C","y":"So sánh – ghép cặp","q":"Cặp “nhà khoa học – đóng góp” nào sau đây là ĐÚNG?","o":["Morgagni – xuất bản “Bệnh học tế bào” năm 1858","William Harvey – tìm ra tế bào hồng cầu và tinh trùng","Julius Cohnheim – chuyên gia GPB và sinh lý, sử dụng phương pháp cắt lạnh","Marcelo Malpighi – sách “Về vị trí và nguyên nhân của bệnh tật”"],"a":2,"e":"Cohnheim là trợ lý của Virchow, chuyên gia GPB – sinh lý, sử dụng pp cắt lạnh.","w":"“Bệnh học tế bào” (1858) là của Virchow. Hồng cầu và tinh trùng do Leeuwenhoek tìm ra. “Về vị trí và nguyên nhân của bệnh tật” (1761) là của Morgagni; Malpighi nghiên cứu mô học phổi.","k":"","f":"","s":"1.1 – slide 10, 12"},{"c":"GPB11-09","t":"1.1","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Mốc phát triển nào của thời kỳ hiện đại được ghi ĐÚNG?","o":["Watson & Crick (1953) – phát minh PCR","Nowell & Hungerford (1960) – xác định bộ NST người","Tjio & Levan (1956) – phát hiện NST Philadelphia","Gall & Pardue (1969) – kỹ thuật lai tại chỗ (In Situ Hybridization)"],"a":3,"e":"Mốc đúng: 1953 cấu trúc DNA (Watson & Crick); 1956 bộ NST người (Tjio & Levan); 1960 NST Philadelphia (Nowell & Hungerford); 1969 ISH (Gall & Pardue); 1983 PCR (Kary Mullis); 2003 HGP.","w":"","k":"Các phương án sai đều tráo tên – mốc giữa các cặp có thật.","f":"","s":"1.1 – slide 4, 13"},{"c":"GPB11-10","t":"1.1","l":2,"p":"C","y":"So sánh – phân loại","q":"Viêm cấp được xếp vào nội dung của Giải phẫu bệnh đại cương vì:","o":["Đây là bệnh lý riêng của ruột thừa","Chỉ nghiên cứu được trên động vật thực nghiệm","Chỉ quan sát được bằng kính hiển vi điện tử","Đây là tổn thương cơ bản, làm cơ sở chung cho nhiều bệnh (VRT cấp, viêm phổi thùy…)"],"a":3,"e":"GPB đại cương nghiên cứu tổn thương cơ bản của tế bào và mô, là cơ sở chung cho tất cả bệnh lý (ví dụ viêm cấp). GPB chuyên biệt nghiên cứu tổn thương từng cơ quan/hệ thống.","w":"","k":"","f":"","s":"1.1 – slide 14, 26"},{"c":"GPB11-15","t":"1.1","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Trong kỹ thuật hóa mô miễn dịch men (peroxidase), chất tạo màu nâu trên tiêu bản là:","o":["Hematoxylin","Chất huỳnh quang phát sáng dưới tia cực tím","DAB (diaminobenzidine) bị oxy hóa nhờ peroxidase với H₂O₂","Eosin Y"],"a":2,"e":"Sơ đồ HMMD trực tiếp và gián tiếp: kháng thể gắn peroxidase; DAB + H₂O₂ bị oxy hóa → chất màu nâu tại vị trí kháng nguyên.","w":"Chất huỳnh quang dưới tia UV là miễn dịch huỳnh quang (dễ phai màu). Hematoxylin, eosin là thuốc nhuộm H&E.","k":"","f":"","s":"1.1 – slide 22"},{"c":"GPB11-16","t":"1.1","l":2,"p":"T","y":"So sánh – phân loại","q":"Theo slide, chuyên ngành nào thuộc nhóm Bệnh học lâm sàng (Clinical pathology)?","o":["Mô bệnh học và tế bào học","Giải phẫu bệnh pháp y và giải phẫu tử thi","Huyết học, vi sinh, miễn dịch, độc chất, hóa sinh bệnh học và di truyền","Bệnh học thực nghiệm"],"a":2,"e":"Các chuyên ngành: Bệnh học lâm sàng (hematology, microbiology, immunology, toxicology, chemical pathology, genetics); Giải phẫu bệnh (mô bệnh học, tế bào học); GPB pháp y và giải phẫu tử thi; Bệnh học thực nghiệm.","w":"","k":"","f":"","s":"1.1 – slide 27"},{"c":"GPB11-11","t":"1.1","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân có hạch cổ to, bác sĩ dùng kim nhỏ chọc hút lấy tế bào làm phết để chẩn đoán. Vật liệu này thuộc nhóm nào?","o":["Tử thiết","Sinh thiết – dạng tế bào học (FNA)","Vật liệu thực nghiệm","Phẫu thiết"],"a":1,"e":"Sinh thiết gồm: (1) phẫu thiết; (2) sinh thiết qua nội soi hoặc kim; (3) tế bào học: FNA, cell block, PAP. Chọc hút kim nhỏ lấy tế bào là FNA.","w":"Tử thiết: mô từ người chết. Vật liệu thực nghiệm: mô hình bệnh trên động vật. Phẫu thiết: mẫu mô lấy qua phẫu thuật, không phải phết tế bào.","k":"","f":"","s":"1.1 – slide 15"},{"c":"GPB11-12","t":"1.1","l":3,"p":"C","y":"Tình huống","q":"Phòng xét nghiệm cần xác định nguồn gốc của một u kém biệt hóa và muốn tiêu bản lưu trữ lâu không phai màu, quan sát bằng KHV quang học thường. Kỹ thuật phù hợp nhất là:","o":["Hóa mô miễn dịch","Nhuộm H&E thường quy","Miễn dịch huỳnh quang","Nuôi cấy tế bào"],"a":0,"e":"HMMD dùng kháng thể gắn enzym; tiêu bản bảo quản không phai màu, ứng dụng phân biệt nguồn gốc u, lành/ác, tiên lượng – đáp ứng điều trị.","w":"MDHQ cần KHV có nguồn tia cực tím và mẫu nhạt màu theo thời gian. H&E không phải lúc nào cũng phân biệt được cấu trúc. Nuôi cấy tế bào không dùng để xác định nguồn gốc trên tiêu bản.","k":"HMMD và MDHQ đều dùng kháng thể – khác ở chất đánh dấu (enzym vs huỳnh quang) và độ bền màu.","f":"","s":"1.1 – slide 19, 22"},{"c":"GPB11-17","t":"1.1","l":3,"p":"C","y":"So sánh – ghép cặp","q":"Theo slide, cặp “kết quả hóa mô miễn dịch – ứng dụng” nào ĐÚNG?","o":["CK (+), LCA (–) – phân biệt lành và ác","MDM2 (+) – đánh giá đáp ứng điều trị nội tiết","ER (+), PR (+) – phân biệt nguồn gốc xuất phát","ER (+), PR (+) – đánh giá tiên lượng và đáp ứng điều trị"],"a":3,"e":"Slide nêu 3 ứng dụng HMMD: (1) phân biệt nguồn gốc xuất phát (ví dụ CK+, LCA–); (2) đánh giá tiên lượng và đáp ứng điều trị (ER+, PR+); (3) phân biệt lành – ác (MDM2+).","w":"CK/LCA minh họa phân biệt nguồn gốc; MDM2 minh họa phân biệt lành – ác.","k":"Ba ví dụ trên cùng một slide hay bị tráo cặp với nhau.","f":"","s":"1.1 – slide 22"},{"c":"GPB12-01","t":"1.2","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Dung dịch cố định được dùng thường nhất trong GPB thường quy là:","o":["Formol trung tính 10%","Glutaraldehyde","Dung dịch Bouin","Dung dịch Zenker"],"a":0,"e":"Formol trung tính 10% (có đệm) là dung dịch cố định thường dùng nhất; các dung dịch khác (glutaraldehyde, Bouin, Zenker, Helly…) dùng cho mục đích riêng.","w":"","k":"","f":"","s":"1.2 – slide 8"},{"c":"GPB12-02","t":"1.2","l":1,"p":"T","y":"Điền khuyết","q":"Formol trung tính 10% thấm vào mô với tốc độ khoảng ___; thời gian cố định mẫu nhỏ ___, mẫu lớn ___.","o":["1 cm/giờ; 1 giờ; 6 giờ","0,1 mm/giờ; 24 giờ; 72 giờ","1 mm/giờ; 24 giờ; 6 giờ","1 mm/giờ; 6 giờ; 24 giờ"],"a":3,"e":"Yếu tố thời gian: phụ thuộc độ dày mẫu, tốc độ 1 mm/h; mẫu nhỏ 6h, mẫu lớn 24h. pH trung tính 6–8.","w":"","k":"","f":"","s":"1.2 – slide 9"},{"c":"GPB12-03","t":"1.2","l":1,"p":"C","y":"Điền khuyết","q":"Kích thước mẫu pha mảnh thường quy cho vào cassette là:","o":["2 cm × 2 cm × 0,5 cm","1 cm × 1 cm × 0,1 cm","0,5 cm × 0,5 cm × 0,5 cm","3 cm × 2 cm × 1 cm"],"a":1,"e":"Mẫu pha mảnh thường quy: 1 × 1 × 0,1 cm (tùy trường hợp có thể lớn/dày hơn).","w":"","k":"","f":"","s":"1.2 – slide 20, 23"},{"c":"GPB12-04","t":"1.2","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Sau khi cắt lọc, phần bệnh phẩm còn lại được xử lý như thế nào?","o":["Hủy ngay theo quy chế chất thải y tế","Bảo quản trong xylen 1 tuần","Để khô ở nhiệt độ phòng","Ngâm formol 10%, lưu đến khi có kết quả, tối thiểu 1 tháng"],"a":3,"e":"Bệnh phẩm còn lại ngâm formol 10%, lưu đến khi có kết quả, thời gian lưu tối thiểu 1 tháng để cắt lọc thêm nếu cần. Bệnh phẩm dư thừa xử lý theo quy chế chất thải y tế.","w":"","k":"","f":"","s":"1.2 – slide 23"},{"c":"GPB12-16","t":"1.2","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Khi cắt mảnh, lame dùng để vớt lát cắt được tráng bằng:","o":["Formol 10%","Xylen","Albumin và glycerine (thực tế thị trường có gelatin)","Sáp ong"],"a":2,"e":"Dụng cụ cắt mảnh: máy cắt vi thể, chậu nước 40–50°C, dung dịch cồn – nước cất 1:1, lame tráng albumin & glycerine (hoặc gelatin), lò sấy, bút chì. Sau đó sấy lame tối thiểu 1 giờ.","w":"","k":"","f":"","s":"1.2 – slide 33, 34"},{"c":"GPB12-05","t":"1.2","l":2,"p":"C","y":"Trình tự quy trình","q":"Trình tự đúng của quy trình kỹ thuật GPB thường quy là:","o":["Nhận mẫu–cố định → xử lý mô → cắt lọc → cắt mảnh → vùi–đúc khối → nhuộm → đọc kết quả","Nhận mẫu–cố định → cắt lọc → vùi–đúc khối → xử lý mô → nhuộm → cắt mảnh → đọc kết quả","Nhận mẫu–cố định → cắt lọc → cho vào cassette → xử lý mô → vùi–đúc khối → cắt mảnh → nhuộm → đọc kết quả","Cắt lọc → nhận mẫu–cố định → xử lý mô → nhuộm → vùi–đúc khối → cắt mảnh → đọc kết quả"],"a":2,"e":"8 bước: (1) nhận mẫu – cố định; (2) cắt lọc; (3) bệnh phẩm vào cassette; (4) xử lý mô; (5) vùi mô – đúc khối; (6) cắt mảnh; (7) nhuộm tiêu bản; (8) đọc kết quả.","w":"","k":"","f":"Slide 4 ghi “BƯỚC 4 – ĐỌC KẾT QUẢ”; theo trình tự đúng phải là bước 8. Nên đối chiếu với giảng viên.","s":"1.2 – slide 3, 4"},{"c":"GPB12-06","t":"1.2","l":2,"p":"C","y":"Chọn đáp án sai","q":"Về mục đích của việc cố định bệnh phẩm, phát biểu nào SAI?","o":["Ngăn sự thay đổi mô sau khi lấy ra khỏi cơ thể","Làm cứng mô để dễ cắt mỏng","Bảo quản thành phần tế bào giống như tế bào sống","Không làm mất các kháng nguyên bề mặt"],"a":1,"e":"Slide ghi rõ một mục đích là “ngăn không để cứng mô”. Độ cứng phù hợp để cắt được tạo ra ở bước thấm/vùi paraffin, không phải mục đích của cố định.","w":"","k":"Bẫy phổ biến: nghĩ cố định nhằm làm cứng mô.","f":"Đáp án theo slide 7 (“ngăn không để cứng mô”). Một số sách kỹ thuật mô học lại ghi formol làm mô chắc hơn – nếu đề dùng nguồn khác, hỏi lại giảng viên.","s":"1.2 – slide 7"},{"c":"GPB12-07","t":"1.2","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Khi cần cố định mẫu để làm hóa mô miễn dịch men, nhiệt độ cố định thích hợp theo bài giảng là:","o":["37°C","40–50°C","60–70°C","0–4°C"],"a":3,"e":"Nhiệt độ phòng thích hợp cho cố định thường quy; nhiệt độ cao thuận lợi (nhanh) nhưng 0–4°C dùng cho hóa mô miễn dịch men.","w":"40–50°C là nhiệt độ chậu nước khi cắt mảnh; 60–70°C là nhiệt độ tủ ấm giữ sáp lỏng khi đúc khối.","k":"Các con số nhiệt độ của 3 bước (cố định, đúc khối, cắt mảnh) hay bị đánh tráo.","f":"","s":"1.2 – slide 9"},{"c":"GPB12-08","t":"1.2","l":2,"p":"C","y":"Chọn đáp án sai","q":"Nguyên tắc cắt lọc bệnh phẩm – phát biểu nào SAI?","o":["Chỉ lấy vùng trung tâm khối u, không cần lấy diện cắt và hạch","Lấy đúng vùng mô bệnh","Lấy được vùng tiếp giáp giữa mô lành và mô bệnh","Lấy được vùng vỏ bao"],"a":0,"e":"Nguyên tắc: lấy đúng vùng mô bệnh; vùng tiếp giáp mô lành – mô bệnh; vùng vỏ bao; diện cắt theo quy định và hạch.","w":"","k":"","f":"","s":"1.2 – slide 20"},{"c":"GPB12-09","t":"1.2","l":2,"p":"T","y":"Tình huống","q":"Một kỹ thuật viên rửa kỹ túi mật và nang buồng trứng dưới vòi nước trước khi cắt lọc. Nhận xét đúng nhất:","o":["Đúng, để loại bỏ hoàn toàn formol","Đúng, vì giúp mô cứng hơn","Không nên, vì dễ làm tróc lớp biểu mô","Không nên, vì nước làm mất kháng nguyên bề mặt"],"a":2,"e":"Vòi nước dùng rửa bớt dung dịch cố định/cặn bã, nhưng túi mật và nang buồng trứng không nên rửa vì dễ làm tróc lớp biểu mô.","w":"","k":"","f":"","s":"1.2 – slide 18"},{"c":"GPB12-10","t":"1.2","l":2,"p":"C","y":"Trình tự quy trình","q":"Thứ tự đúng các giai đoạn của xử lý mô là:","o":["Cố định formol → xylen → cồn 70–100% → paraffin","Cồn 100% → formol → paraffin → xylen","Formol → paraffin → cồn → xylen","Cố định formol → khử nước bằng cồn 70–100% → loại cồn/làm trong bằng xylen → thấm paraffin"],"a":3,"e":"4 giai đoạn: cố định formol 10% → loại nước dần bằng cồn 70%–100% → loại cồn bằng xylen (làm trong) → paraffin thấm vào mô.","w":"","k":"","f":"","s":"1.2 – slide 25, 27"},{"c":"GPB12-11","t":"1.2","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Khi dùng sáp không phải sáp y tế để đúc khối, bài giảng khuyến cáo:","o":["Pha thêm glycerin theo tỉ lệ 1 : 1","Pha thêm albumin theo tỉ lệ 6 : 4","Pha thêm sáp ong theo tỉ lệ 6 paraffin : 4 sáp ong","Đun sáp đến 100°C"],"a":2,"e":"Sáp ở thị trường không phải sáp y tế; để tăng độ dẻo của block, pha thêm sáp ong tỉ lệ 6 paraffin : 4 sáp. Tủ ấm giữ sáp lỏng ở 60–70°C.","w":"","k":"","f":"","s":"1.2 – slide 29, 31"},{"c":"GPB12-12","t":"1.2","l":2,"p":"Th","y":"Tình huống","q":"Bệnh phẩm đã bị xẻ thành nhiều mảnh trước khi gửi đến. Cách đo kích thước đúng là:","o":["Sắp lại như ban đầu rồi mới đo, lấy số đo lớn nhất theo 3 chiều","Đo riêng từng mảnh rồi cộng lại","Chỉ đo mảnh lớn nhất","Không cần đo vì mẫu đã biến dạng"],"a":0,"e":"Lấy số đo lớn nhất trên từng bệnh phẩm; nếu đã xẻ phải sắp lại như ban đầu rồi mới đo; mô tả từ ngoài vào trong hay ngược lại.","w":"","k":"","f":"","s":"1.2 – slide 13, 17"},{"c":"GPB12-17","t":"1.2","l":2,"p":"C","y":"Điền khuyết","q":"Trong nhuộm H&E, bước “biệt hóa” dùng ___ và bước “làm xanh” dùng ___.","o":["nước máy chảy; cồn acid 1%","xylen; eosin Y","cồn acid 1%; nước máy chảy","cồn tuyệt đối; hematoxylin"],"a":2,"e":"Bước 4 – biệt hóa: cồn acid 1% (nhúng 2 lần rồi rửa); bước 5 – làm xanh (bluing): nước máy chảy; sau đó mới nhuộm nền eosin Y 2–3 phút.","w":"","k":"Hai dung dịch của bước 4 và 5 hay bị đảo chỗ.","f":"","s":"1.2 – slide 36"},{"c":"GPB12-13","t":"1.2","l":3,"p":"C","y":"Trình tự quy trình","q":"Trình tự đúng của nhuộm H&E trên lát cắt paraffin là:","o":["Khử paraffin (xylen) → hydrat hóa bằng cồn giảm dần → hematoxylin → biệt hóa (cồn acid 1%) → làm xanh (nước máy) → eosin → khử nước → làm trong và dán lamen","Khử paraffin → eosin → hematoxylin → làm xanh → biệt hóa → khử nước → dán lamen","Hydrat hóa → khử paraffin → hematoxylin → eosin → biệt hóa → làm xanh → dán lamen","Khử paraffin → hydrat hóa → làm xanh → hematoxylin → eosin → biệt hóa → dán lamen"],"a":0,"e":"8 bước: deparaffinization (xylen 10 phút) → rehydration (cồn) → hematoxylin 5–15 phút → differentiation (cồn acid 1%) → bluing (nước máy) → eosin Y 2–3 phút → dehydration → clearing & mounting (xylen 5 phút).","w":"","k":"Hematoxylin (nhuộm nhân) luôn trước eosin (nhuộm nền); biệt hóa trước làm xanh.","f":"","s":"1.2 – slide 36"},{"c":"GPB12-14","t":"1.2","l":3,"p":"T","y":"Tình huống","q":"Bệnh phẩm là mô xương. Trước khi xử lý mô thường quy cần:","o":["Khử canxi bằng acid nitric 5–10%, rửa nước, trung hòa bằng formol 10% ≥ 5 giờ","Ngâm xylen 24 giờ để làm mềm","Cắt lạnh ngay không cần cố định","Ngâm cồn 100% qua đêm"],"a":0,"e":"Quy trình khử canxi: đặt mô vào acid nitric 5% đến khi mềm → rửa nước chảy 30 phút → trung hòa ≥ 5h bằng formol 10% → rửa nước qua đêm → xử lý thường quy.","w":"","k":"","f":"","s":"1.2 – slide 10"},{"c":"GPB12-18","t":"1.2","l":3,"p":"T","y":"Tình huống","q":"Khi cắt lọc một bệnh phẩm tạng đặc (ví dụ khối u gan), cách làm đúng theo bài giảng là:","o":["Cắt lát để xem tổn thương bên trong và để formol ngấm tốt, nhưng không cắt rời hẳn","Cắt rời thành nhiều mảnh nhỏ để formol ngấm nhanh","Giữ nguyên khối, không cắt, để bảo tồn cấu trúc","Rửa dưới vòi nước mạnh rồi đông lạnh"],"a":0,"e":"Lưu ý cắt lọc: tạng đặc cần cắt lát để xem tổn thương bên trong và để ngấm formol tốt; không nên cắt rời để sau này cần kiểm tra bệnh phẩm dễ dàng hơn.","w":"Cắt rời làm mất định hướng khi cần kiểm tra lại; giữ nguyên khối thì formol không ngấm vào sâu (chỉ ~1 mm/giờ).","k":"","f":"","s":"1.2 – slide 23"},{"c":"GPB12-15","t":"1.2","l":4,"p":"C","y":"Tình huống – phân tích","q":"Mẫu mô sau xử lý bị teo, cứng, giòn và vỡ vụn khi cắt; paraffin không thấm đều. Sai sót nhiều khả năng nhất nằm ở giai đoạn nào?","o":["Cố định bằng formol quá ngắn","Chậu nước cắt mảnh quá nóng","Loại cồn bằng xylen không đầy đủ trước khi thấm paraffin","Nhuộm hematoxylin quá lâu"],"a":2,"e":"Mô còn ngấm cồn sẽ teo lại, cứng, dễ vỡ; xylen vừa loại cồn vừa “dọn đường” cho paraffin thâm nhập, làm mô có độ cứng vừa phải để cắt mỏng.","w":"Cố định ngắn gây mô kém bảo tồn, không gây cứng giòn kiểu này. Chậu nước và nhuộm là các bước sau, không ảnh hưởng độ thấm paraffin.","k":"","f":"","s":"1.2 – slide 27"},{"c":"GPB13-01","t":"1.3","l":1,"p":"C","y":"So sánh – phân biệt","q":"Phân biệt đúng giữa phì đại và tăng sản:","o":["Phì đại tăng kích thước tế bào; tăng sản tăng số lượng tế bào bằng phân bào","Phì đại tăng số lượng tế bào; tăng sản tăng kích thước tế bào","Cả hai đều chỉ xảy ra ở tế bào mất khả năng phân bào","Cả hai đều là tổn thương không hồi phục"],"a":0,"e":"Phì đại: tăng kích thước tế bào do tăng tổng hợp mọi thành phần cấu tạo. Tăng sản: tăng số lượng tế bào bằng phân bào – chỉ tế bào còn khả năng phân bào mới tăng sản.","w":"","k":"","f":"","s":"1.3 – slide 5, 8"},{"c":"GPB13-02","t":"1.3","l":1,"p":"C","y":"Điền khuyết","q":"Ở biểu mô lát tầng, nghịch sản ___ khi tổn thương lên đến 1/3 trên; nghịch sản chiếm toàn bộ chiều dày biểu mô kể cả lớp bề mặt được xem là ___.","o":["vừa; nghịch sản nặng","nặng; chuyển sản","nặng; carcinôm (tại chỗ)","vừa; carcinôm xâm nhập"],"a":2,"e":"Nhẹ: < 1/3 dưới; vừa: đến 1/3 giữa; nặng: đến 1/3 trên; chiếm toàn bộ chiều dày kể cả bề mặt = carcinôm (tại chỗ, chưa xâm nhập).","w":"","k":"","f":"","s":"1.3 – slide 17, 20"},{"c":"GPB13-03","t":"1.3","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Nhân tế bào hoại tử vón cục nhỏ lại, bắt màu kiềm đậm do chất nhiễm sắc bị cô đặc gọi là:","o":["Nhân vỡ (karyorrhexis)","Nhân tan (karyolysis)","Nhân quái","Nhân đông (pyknosis)"],"a":3,"e":"Nhân đông: vón cục nhỏ, bắt màu kiềm đậm. Nhân vỡ: chất nhiễm sắc cô đặc thành nhiều khối. Nhân tan: chất nhiễm sắc hòa tan dần, chỉ còn bóng mờ.","w":"","k":"","f":"","s":"1.3 – slide 60–62"},{"c":"GPB13-04","t":"1.3","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Hình thái hoại tử thường gặp nhất và đặc trưng cho hoại tử do thiếu oxy (VD nhồi máu cơ tim) là:","o":["Hoại tử hóa lỏng","Hoại tử bã đậu","Hoại tử mỡ","Hoại tử đông"],"a":3,"e":"Hoại tử đông: dạng thường gặp nhất, đặc trưng cho thiếu oxy; mô chắc, trắng đục, cấu trúc mô vẫn được bảo tồn.","w":"","k":"","f":"","s":"1.3 – slide 75"},{"c":"GPB13-05","t":"1.3","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Trong 5 “đáp ứng thích nghi” được liệt kê, hiện tượng nào bài giảng lưu ý “thực chất không phải là đáp ứng thích nghi”?","o":["Nghịch sản","Chuyển sản","Teo đét","Phì đại"],"a":0,"e":"Nghịch sản là rối loạn của sự tăng sinh (thay đổi hình dạng, kích thước, sắp xếp tế bào); thực chất không phải đáp ứng thích nghi nhưng liên quan mật thiết với tăng sản.","w":"","k":"","f":"","s":"1.3 – slide 4, 19"},{"c":"GPB13-06","t":"1.3","l":2,"p":"C","y":"So sánh – phân biệt","q":"Sự teo nhỏ của tuyến ức ở tuổi thiếu niên là ví dụ của:","o":["Teo đét sinh lý","Thoái triển – giảm số lượng tế bào bằng chết tế bào theo chương trình","Teo đét bệnh lý do mất phân bố thần kinh","Hoại tử đông"],"a":1,"e":"Thoái triển khác teo đét: thoái triển giảm SỐ LƯỢNG tế bào bằng apoptosis (VD tuyến ức tuổi thiếu niên); teo đét giảm KÍCH THƯỚC tế bào. Teo cơ quan sinh dục người già phối hợp cả hai.","w":"","k":"Teo đét (giảm kích thước) ≠ thoái triển (giảm số lượng).","f":"","s":"1.3 – slide 15"},{"c":"GPB13-07","t":"1.3","l":2,"p":"C","y":"Chọn đáp án sai","q":"Ví dụ nào sau đây KHÔNG phải là chuyển sản?","o":["Biểu mô trụ giả tầng phế quản chuyển thành biểu mô gai ở người hút thuốc lá","Biểu mô trụ đơn cổ trong CTC chuyển sản gai","Tế bào cơ trơn tử cung tăng kích thước gấp 10 lần khi mang thai","Mô sợi sau chấn thương kéo dài tạo ra bè xương"],"a":2,"e":"Chuyển sản: tế bào chuyển hướng biệt hóa để thích nghi. Cơ trơn tử cung to ra khi mang thai là phì đại sinh lý (do estrogen).","w":"","k":"","f":"","s":"1.3 – slide 6, 16, 18"},{"c":"GPB13-08","t":"1.3","l":2,"p":"C","y":"Chọn đáp án sai","q":"Đặc điểm hình thái của nghịch sản – phát biểu nào SAI?","o":["Kích thước tế bào không đều","Có nhiều phân bào bất thường","Nhân tăng sắc, to nhỏ không đều","Tỉ lệ nhân/bào tương tăng"],"a":1,"e":"Nghịch sản: tỉ lệ phân bào tăng nhưng KHÔNG có phân bào bất thường; sắp xếp rối loạn. Phân bào bất thường (3 cực, 4 cực) là đặc điểm của u ác.","w":"","k":"Nghịch sản: phân bào tăng nhưng không bất thường.","f":"","s":"1.3 – slide 19"},{"c":"GPB13-09","t":"1.3","l":2,"p":"T","y":"So sánh – phân biệt","q":"Đặc điểm vi thể của THOÁI HÓA NƯỚC (khác với trương đục) là:","o":["Bào tương dạng hạt, bắt màu kém, nhân còn ở giữa, tổn thương còn khả hồi","Bào tương bị choán bởi không bào lớn không màu (túi lưới nội bào trương to), nhân bị đẩy lệch, tế bào có thể vỡ chết","Bào tương chứa thể vùi hyaline do cytokeratin kết tụ","Bào tương chứa hạt nâu nhuộm Perls dương tính"],"a":1,"e":"Trương đục: ứ nước mức trung bình, bào tương dạng hạt, nhân ở giữa, còn khả hồi. Thoái hóa nước: ứ nước trầm trọng, không bào lớn, nhân lệch, có thể vỡ.","w":"","k":"","f":"","s":"1.3 – slide 26"},{"c":"GPB13-10","t":"1.3","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Đại thực bào chứa nhiều không bào cholesterol rất nhỏ được gọi là ___; khi tập trung ở mô liên kết da tạo đám sùi mềm màu vàng gọi là ___.","o":["tế bào Gaucher; u hạt","bọt bào (foam cell); u vàng (xanthoma)","đại bào Langhans; nốt tophi","tế bào tim; u mỡ"],"a":1,"e":"Ứ đọng cholesterol trong ĐTB tạo bọt bào; tập trung ở mô liên kết da → u vàng (xanthoma). Gặp trong xơ vữa động mạch, tăng cholesterol máu gia đình.","w":"","k":"","f":"","s":"1.3 – slide 32"},{"c":"GPB13-11","t":"1.3","l":2,"p":"Th","y":"So sánh – phân biệt","q":"Bệnh tích tiêu thể do thiếu enzyme glucocerebrosidase có đặc điểm:","o":["Bệnh Niemann-Pick – ĐTB dạng bọt do nhiều không bào nhỏ","Bệnh Gaucher – ĐTB rất lớn (~100 µm), bào tương dạng sợi","Bệnh Von Gierke – ứ glycogen trong gan","Bệnh Pompe – ứ mucopolysaccharide"],"a":1,"e":"Gaucher: thiếu glucocerebrosidase → ĐTB lớn, bào tương dạng sợi. Niemann-Pick: thiếu sphingomyelinase → ĐTB dạng bọt.","w":"","k":"“Sợi” (Gaucher) vs “bọt” (Niemann-Pick).","f":"","s":"1.3 – slide 33"},{"c":"GPB13-12","t":"1.3","l":2,"p":"T","y":"So sánh – phân biệt","q":"Loại lắng đọng protein ngoại bào nào LUÔN có phản ứng viêm đi kèm?","o":["Lắng đọng hyaline","Lắng đọng chất dạng tinh bột (amyloid)","Lắng đọng chất dạng fibrin","Lắng đọng cholesterol"],"a":2,"e":"Chất dạng fibrin (thành tiểu ĐM trong THA ác tính, bệnh tạo keo) luôn có viêm đi kèm. Hyaline đáng chú ý là KHÔNG có viêm đi kèm.","w":"","k":"Hyaline (không viêm) vs dạng fibrin (luôn viêm).","f":"","s":"1.3 – slide 48, 49"},{"c":"GPB13-13","t":"1.3","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Về biến đổi vi thể của tế bào hoại tử, phát biểu nào ĐÚNG?","o":["Nhân đông, nhân vỡ, nhân tan luôn xảy ra tuần tự","Bào tương tăng tính bắt màu kiềm","Biến đổi bào tương xuất hiện trước biến đổi nhân","Màng tế bào vẫn giữ tính thấm chọn lọc"],"a":2,"e":"Biến đổi bào tương xuất hiện trước: mất tính bắt màu kiềm, tăng tính bắt màu acid. Ba biến đổi nhân xuất hiện độc lập. Màng mất tính thấm chọn lọc.","w":"","k":"","f":"","s":"1.3 – slide 59, 63"},{"c":"GPB13-14","t":"1.3","l":2,"p":"C","y":"So sánh – phân biệt","q":"Đặc điểm nào thuộc về tự hủy tế bào (apoptosis) mà KHÔNG thuộc hoại tử tế bào?","o":["Tế bào co nhỏ, bào quan nguyên vẹn, tạo thể tự hủy được ĐTB ăn, không gây viêm","Thể tích tế bào tăng, bào quan trương phồng","Màng mất tính thấm chọn lọc, tế bào “nổ tung”","Ảnh hưởng số lượng lớn tế bào và chức năng mô"],"a":0,"e":"Bảng so sánh: hoại tử – thể tích tăng, bào quan trương phồng, màng mất thấm chọn lọc, kích thích viêm. Tự hủy – thể tích giảm, bào tương đậm đặc, bào quan nguyên vẹn, thể tự hủy bị ĐTB ăn, không viêm.","w":"","k":"","f":"","s":"1.3 – slide 72"},{"c":"GPB13-15","t":"1.3","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Hoại tử hóa lỏng thường gặp trong trường hợp nào?","o":["Mô não thiếu oxy và ổ viêm do vi khuẩn sinh mủ","Nhồi máu cơ tim","Viêm lao","Viêm tụy cấp"],"a":0,"e":"Hoại tử hóa lỏng do hoạt động mạnh của enzyme tiêu thể (tự tiêu và dị tiêu); gặp ở mô não thiếu oxy, ổ viêm do VK sinh mủ (áp xe).","w":"","k":"","f":"","s":"1.3 – slide 76"},{"c":"GPB13-16","t":"1.3","l":2,"p":"T","y":"So sánh – phân biệt","q":"Tế bào cơ hoại tử được loại bỏ nhờ hoạt động của bạch cầu đa nhân trung tính và đại thực bào. Hiện tượng này gọi là:","o":["Dị tiêu (heterolysis)","Tự tiêu (autolysis)","Tự hủy tế bào (apoptosis)","Thoái triển"],"a":0,"e":"Dị tiêu: tế bào hoại tử bị loại bằng enzyme tiêu thể của TẾ BÀO KHÁC (BCĐNTT, ĐTB). Tự tiêu: bằng enzyme của chính nó (VD tụy hoại tử; tự tiêu sau tử vong).","w":"","k":"","f":"","s":"1.3 – slide 64"},{"c":"GPB13-17","t":"1.3","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân tăng huyết áp lâu năm, siêu âm thấy thành thất trái dày, tim tăng trọng lượng. Đáp ứng thích nghi của tế bào cơ tim là:","o":["Tăng sản sinh lý","Phì đại bệnh lý","Phì đại sinh lý","Chuyển sản"],"a":1,"e":"Trong THA hoặc hẹp van ĐMC, tâm thất trái co bóp mạnh hơn để thắng sức cản → tế bào cơ tim phì đại (phì đại bệnh lý).","w":"Tế bào cơ tim không còn khả năng phân bào nên không tăng sản. Phì đại sinh lý là ở VĐV hoặc cơ tử cung khi mang thai.","k":"","f":"","s":"1.3 – slide 6, 7"},{"c":"GPB13-18","t":"1.3","l":3,"p":"C","y":"Tình huống","q":"Sau phẫu thuật cắt bỏ một phần gan, phần gan còn lại tăng sinh tế bào để bù lại số tế bào đã mất. Đây là:","o":["Phì đại sinh lý","Tăng sản bệnh lý do hormon","Tăng sản dạng cục","Tăng sản bù trừ (tăng sản sinh lý)"],"a":3,"e":"Tăng sản sinh lý gồm tăng sản tuyến vú/cơ tử cung khi mang thai và tăng sản bù trừ ở gan sau cắt bỏ một phần.","w":"","k":"","f":"","s":"1.3 – slide 9"},{"c":"GPB13-19","t":"1.3","l":3,"p":"C","y":"Tình huống – phân loại","q":"Theo cách phân loại trong bài, trường hợp nào là teo đét BỆNH LÝ?","o":["Cơ chi teo sau gãy xương phải bó bột bất động","Tử cung nhỏ lại sau sinh","Cơ vân ở người già teo do giảm vận động","Tuyến sinh dục người già teo do mất kích thích hormon"],"a":0,"e":"Teo đét bệnh lý: teo cơ do bại liệt, teo cơ do chi gãy xương bó bất động, teo não do xơ vữa động mạch. Ba phương án còn lại là teo đét sinh lý.","w":"","k":"“Giảm vận động ở người già” (sinh lý) vs “bất động do bó bột” (bệnh lý) dễ nhầm.","f":"","s":"1.3 – slide 13"},{"c":"GPB13-20","t":"1.3","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân trào ngược dạ dày – thực quản nhiều năm; sinh thiết đoạn dưới thực quản thấy biểu mô trụ đơn tiết nhầy thay cho biểu mô lát tầng, tế bào không dị dạng. Chẩn đoán đúng nhất:","o":["Nghịch sản nặng","Tăng sản dạng cục","Carcinôm tại chỗ","Chuyển sản"],"a":3,"e":"Biểu mô lát tầng đoạn dưới thực quản chuyển thành biểu mô trụ đơn tiết nhầy để thích ứng với acid trào ngược – đây là chuyển sản.","w":"","k":"Chuyển sản ở thực quản là lát tầng → trụ (ngược hướng với phế quản, CTC: trụ → gai).","f":"","s":"1.3 – slide 16"},{"c":"GPB13-21","t":"1.3","l":3,"p":"T","y":"Chọn đáp án đúng","q":"Thể Mallory trong tế bào gan ở người ngộ độc rượu được hình thành theo cơ chế:","o":["Nhập bào quá mức protein huyết tương","Xuất bào quá chậm globulin miễn dịch","Tổn thương bộ xương tế bào – siêu sợi trung gian cytokeratin kết tụ với ubiquitin","Ứ đọng glycogen do thiếu enzyme"],"a":2,"e":"Ứ đọng protein theo 3 cơ chế: nhập bào quá mức (thể vùi hyaline ở ống thận trong bệnh cầu thận); xuất bào quá chậm (thể Russell ở tương bào trong đa u tủy); tổn thương bộ xương tế bào (thể Mallory).","w":"","k":"","f":"Slide ghi “thể Rujjel” – thuật ngữ chuẩn là thể Russell (Russell body).","s":"1.3 – slide 40"},{"c":"GPB13-22","t":"1.3","l":3,"p":"T","y":"Tình huống","q":"Bệnh nhân cường tuyến cận giáp, calci máu tăng; giải phẫu thấy lắng đọng calci ở thành mạch, nhu mô thận và niêm mạc dạ dày vốn còn sống. Đây là:","o":["Calci hóa nghịch dưỡng","Lắng đọng urat","Calci hóa di căn","Hoại tử mỡ có lắng đọng calci"],"a":2,"e":"Calci hóa di căn: calci lắng đọng ở mô SỐNG do tăng calci máu (cường cận giáp, u xương hủy xương). Calci hóa nghịch dưỡng: lắng đọng ở mô CHẾT (bã đậu, máu tụ, mảng xơ vữa, thể cát).","w":"","k":"Nghịch dưỡng = mô chết, calci máu bình thường; di căn = mô sống, tăng calci máu.","f":"","s":"1.3 – slide 52, 54"},{"c":"GPB13-23","t":"1.3","l":3,"p":"C","y":"Chọn đáp án đúng – giải thích cơ chế","q":"Vì sao trong hoại tử đông, cấu trúc mô vẫn được bảo tồn để còn nhận diện được?","o":["Do enzyme tiêu thể hoạt động rất mạnh","Do toan hóa nội bào làm biến chất protein, kể cả enzyme tiêu thể, nên ức chế sự tự tiêu","Do lipase phân hủy mô mỡ tạo xà phòng calci","Do vi khuẩn lao ức chế hòa nhập túi thực bào – tiêu thể"],"a":1,"e":"Cơ chế hoại tử đông: toan hóa nội bào → biến chất protein kể cả enzyme tiêu thể → ức chế tự tiêu. Sau một thời gian ngắn chuyển thành hoại tử lỏng do dị tiêu.","w":"Enzyme tiêu thể hoạt động mạnh là cơ chế hoại tử HÓA LỎNG. Ức chế hòa nhập phagosome–lysosome là cơ chế tồn tại của vi khuẩn lao.","k":"","f":"","s":"1.3 – slide 75"},{"c":"GPB13-24","t":"1.3","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân viêm tụy cấp; phẫu thuật thấy mô mỡ quanh tụy có nhiều vết màu trắng ngà, chắc; vi thể: ranh giới tế bào mỡ không rõ, lắng đọng calci, ĐTB ăn mỡ. Hình thái hoại tử là:","o":["Hoại tử đông","Hoại tử bã đậu","Hoại thư ướt","Hoại tử mỡ"],"a":3,"e":"Hoại tử mỡ gặp trong viêm tụy cấp, viêm tuyến vú: vết trắng ngà chắc; vi thể mất ranh giới tế bào mỡ, lắng đọng calci, thấm nhập viêm, ĐTB ăn mỡ.","w":"","k":"","f":"","s":"1.3 – slide 77"},{"c":"GPB13-25","t":"1.3","l":3,"p":"C","y":"So sánh – phân biệt","q":"Phát biểu ĐÚNG về hoại thư:","o":["Hoại thư khô có vi thể là hoại tử hóa lỏng","Hoại thư là một hình thái mô học riêng biệt của hoại tử","Hoại thư ướt có màu tím và khô","Hoại thư ướt là vùng hoại thư khô bị bội nhiễm vi khuẩn và bạch cầu, vi thể là hoại tử hóa lỏng"],"a":3,"e":"Hoại thư không phải hình thái mô học riêng, chỉ mô tả đại thể tổn thương chi do tắc động mạch. Khô: tím, khô, vi thể hoại tử đông. Ướt: tiếp sau hoại thư khô + VK & BC → lầy nhầy, hôi, vi thể hoại tử hóa lỏng.","w":"","k":"","f":"","s":"1.3 – slide 80"},{"c":"GPB13-31","t":"1.3","l":3,"p":"C","y":"So sánh – phân biệt","q":"Điểm phân biệt tăng sản bệnh lý (do kích thích quá mức của hormon) với u là:","o":["Tăng sản bệnh lý không bao giờ liên quan đến ung thư","U phụ thuộc hoàn toàn vào kích thích hormon","Tăng sản bệnh lý chỉ xảy ra ở tế bào đã mất khả năng phân bào","Tăng sản bệnh lý sẽ mất đi khi không còn kích thích của hormon"],"a":3,"e":"Tăng sản bệnh lý do kích thích quá mức của hormon đặc hiệu; khác tăng sinh tế bào u ở chỗ sẽ mất khi không còn kích thích. Tuy vậy, tăng sản bệnh lý có thể là nền phát triển của ung thư.","w":"{#0} sai vì tăng sản bệnh lý có thể là nền phát triển ung thư. {#1} sai: u có tính tự động, ít phụ thuộc cơ chế điều hòa. {#2} sai: chỉ tế bào còn khả năng phân bào mới tăng sản.","k":"","f":"","s":"1.3 – slide 9; 3.6 – slide 4"},{"c":"GPB13-26","t":"1.3","l":4,"p":"C","y":"Trình tự – vận dụng cao","q":"Thứ tự các thay đổi có thể gặp ở biểu mô phế quản người hút thuốc lá là:","o":["Chuyển sản gai → tăng sản TB đáy → tăng sản TB tiết nhầy → nghịch sản → carcinôm xâm nhập → carcinôm tại chỗ","Tăng sản TB tiết nhầy → tăng sản TB đáy → chuyển sản gai → nghịch sản → carcinôm tại chỗ → carcinôm TB gai xâm nhập","Tăng sản TB đáy → nghịch sản → chuyển sản gai → tăng sản TB tiết nhầy → carcinôm tại chỗ → carcinôm xâm nhập","Nghịch sản → chuyển sản gai → tăng sản TB tiết nhầy → tăng sản TB đáy → carcinôm tại chỗ → carcinôm xâm nhập"],"a":1,"e":"Trình tự trên slide: (A) tăng sản tế bào tiết nhầy → (B) tăng sản tế bào đáy → (C) chuyển sản gai → (D) nghịch sản nhẹ, vừa, nặng → (E) carcinôm tại chỗ → (F) carcinôm tế bào gai xâm nhập.","w":"{#0} và {#3} đặt nghịch sản/chuyển sản sai vị trí; {#0} còn đặt xâm nhập trước tại chỗ. {#2} đặt nghịch sản trước chuyển sản.","k":"","f":"","s":"1.3 – slide 17"},{"c":"GPB13-27","t":"1.3","l":4,"p":"C","y":"Chọn đáp án đúng – phân tích","q":"Nhận định nào ĐÚNG về ý nghĩa của nghịch sản?","o":["Mọi mức độ nghịch sản đều không hồi phục","Nghịch sản chủ yếu xảy ra ở mô liên kết chưa có chuyển sản","Nghịch sản nhẹ và vừa có thể trở lại bình thường khi hết tác nhân kích thích; nghịch sản nặng có thể chuyển thành ung thư","Nghịch sản đồng nghĩa với ung thư xâm nhập"],"a":2,"e":"Nghịch sản là tổn thương tiền ung thư (nghịch sản nặng có thể thành ung thư) nhưng vẫn khả hồi ở mức nhẹ – vừa. Nghịch sản chủ yếu ở biểu mô bị kích thích lâu dài, thường đã có chuyển sản.","w":"","k":"","f":"","s":"1.3 – slide 19, 21"},{"c":"GPB13-28","t":"1.3","l":4,"p":"T","y":"Kết hợp nhiều nội dung","q":"Bệnh nhân suy tim trái mạn; mô phổi có nhiều đại thực bào phế nang chứa hạt sắc tố nâu trên nhuộm HE. Nhuộm đặc biệt xác nhận và tên gọi của tế bào này là:","o":["Fontana (đen) – tế bào chứa melanin","Perls (xanh dương) – “tế bào tim” ăn hemosiderin","Fouchet (xanh lá) – tế bào ứ bilirubin","PAS (đỏ) – tế bào chứa lipofuscin"],"a":1,"e":"Sung huyết phổi mạn do suy tim trái: hồng cầu thoát mạch bị phân hủy → ĐTB ăn hemosiderin (“tế bào tim”). Hemosiderin nhuộm Perls xanh dương.","w":"Fontana: melanin & lipofuscin màu đen; Fouchet: bilirubin xanh lá; PAS: fuscin đỏ – không phù hợp bối cảnh suy tim.","k":"","f":"","s":"1.3 – slide 43; 2.4 – slide 18"},{"c":"GPB13-29","t":"1.3","l":4,"p":"T","y":"Kết hợp nhiều nội dung","q":"Mô ung thư tuyến giáp dạng tủy có chất lắng đọng ngoại bào trông giống hyaline trên HE. Để xác định đó là chất dạng tinh bột (amyloid), cần làm gì và kết quả ra sao?","o":["Nhuộm đỏ Congo: bắt màu cam, chuyển vàng xanh dưới KHV phân cực","Nhuộm Oil red O: bắt màu đỏ trên mẫu cắt lạnh","Nhuộm PAS: hạt hồng trong bào tương","Nhuộm Perls: bắt màu xanh dương"],"a":0,"e":"Chất dạng tinh bột trông giống hyaline trên HE; nhuộm đỏ Congo bắt màu cam, đổi sang vàng xanh dưới KHV phân cực. Ở ung thư giáp dạng tủy, bản chất là calcitonin do tế bào u tiết.","w":"","k":"","f":"","s":"1.3 – slide 50; 1.1 – slide 20"},{"c":"GPB13-30","t":"1.3","l":4,"p":"T","y":"Trình tự – vận dụng cao","q":"Trong con đường NỘI SINH – ty thể của apoptosis, chuỗi sự kiện đúng là:","o":["Bcl-2 và Bcl-XL hoạt hóa Bax, Bak → cytochrome c bị giữ trong ty thể → hoạt hóa caspase","TNF-α và FASL gắn thụ thể chết → hoạt hóa caspase → thể tự hủy","Caspase hoạt hóa trước → phá ty thể → giải phóng Bcl-2","Bim, Bid, Bad nhận biết tổn thương → hoạt hóa Bax, Bak → kênh xuyên màng ngoài ty thể → cytochrome c vào bào tương → hoạt hóa chuỗi caspase"],"a":3,"e":"Đường nội sinh: protein thúc đẩy (Bim, Bid, Bad) hoạt hóa Bax, Bak ở màng ngoài ty thể → cytochrome c vào bào tương → hoạt hóa caspase → phân cắt ADN → thể tự hủy. Bcl-2, Bcl-XL là protein ức chế.","w":"{#0}: Bcl-2/Bcl-XL ức chế (không hoạt hóa) Bax, Bak. {#1} là đường ngoại sinh (thụ thể chết). {#2} đảo ngược trình tự.","k":"","f":"","s":"1.3 – slide 68, 69"},{"c":"GPB24-01","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Ứ đọng dịch trong khoang màng bụng được gọi là:","o":["Cổ trướng (tràn dịch màng bụng)","Phù","Sung huyết","Hemoperitoneum"],"a":0,"e":"Ứ đọng dịch trong mô kẽ gọi là phù; trong các khoang cơ thể gọi là tràn dịch; tràn dịch màng bụng thường gọi là cổ trướng. Hemoperitoneum là tích tụ MÁU trong khoang bụng.","w":"","k":"","f":"","s":"2.4 – slide 5, 23"},{"c":"GPB24-02","t":"2.4","l":1,"p":"C","y":"So sánh – phân biệt","q":"Dịch phù KHÔNG do viêm (dịch thấm) có đặc điểm:","o":["Giàu protein, tỷ trọng > 1,020","Chứa nhiều bạch cầu đa nhân","Ít protein, tỷ trọng < 1,012","Chứa nhiều fibrin"],"a":2,"e":"Phù không do viêm: dịch thấm ít protein, tỷ trọng < 1,012. Phù do viêm: dịch tiết giàu protein, tỷ trọng > 1,020.","w":"","k":"Hai ngưỡng 1,012 và 1,020 hay bị đánh tráo.","f":"","s":"2.4 – slide 5"},{"c":"GPB24-03","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Sung huyết mạn tính ở GAN thường có nguyên nhân là:","o":["Suy tim phải","Suy tim trái","Huyết khối động mạch gan","Viêm gan virus"],"a":0,"e":"Sung huyết = ứ máu thụ động trong tĩnh mạch. Suy tim trái → ứ máu ở phổi; suy tim phải → ứ máu ở gan và tứ chi.","w":"","k":"Tim trái → phổi; tim phải → gan.","f":"","s":"2.4 – slide 16, 19"},{"c":"GPB24-04","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Vi thể của sung huyết mạn tính ở gan là:","o":["Tế bào gan quanh khoảng cửa hoại tử, xoang hẹp","Tiểu thùy giả ngăn cách bởi vách xơ","Tế bào gan ở trung tâm tiểu thùy teo, xoang giãn, sợi hóa quanh tĩnh mạch trung tâm","Thấm nhập bạch cầu đa nhân lan tỏa"],"a":2,"e":"Sung huyết gan mạn: gan teo, sung huyết trung tâm tiểu thùy; vi thể tế bào gan trung tâm tiểu thùy teo, xoang giãn, sợi hóa quanh TM trung tâm.","w":"","k":"","f":"","s":"2.4 – slide 19"},{"c":"GPB24-05","t":"2.4","l":1,"p":"C","y":"Điền khuyết","q":"Theo kích thước, chấm xuất huyết (petechiae) khoảng ___, còn tụ máu (hematoma) có kích thước ___.","o":["3 mm; 1–2 cm","1–2 mm; > 2 cm","1–2 cm; > 5 cm","< 1 mm; 3 mm"],"a":1,"e":"Petechiae 1–2 mm; purpura (ban xuất huyết) ~3 mm; ecchymoses (vết bầm) 1–2 cm; hematoma (tụ máu) > 2 cm.","w":"","k":"","f":"","s":"2.4 – slide 23"},{"c":"GPB24-06","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Đường “Zahn” trên vi thể huyết khối là:","o":["Lớp tế bào nội mô phủ lên bề mặt cục huyết khối","Các khoảng sáng chứa mỡ trong lòng mạch","Sự sắp xếp xen kẽ các lớp hồng cầu, tiểu cầu và fibrin","Tế bào gai không nhân trong lòng mạch"],"a":2,"e":"Vi thể huyết khối: đường Zahn – các lớp hồng cầu, tiểu cầu và fibrin xen kẽ; gặp ở huyết khối động mạch/tim gắn tại vị trí tổn thương.","w":"Khoảng sáng chứa mỡ: thuyên tắc mỡ. Tế bào gai không nhân: thuyên tắc ối.","k":"","f":"","s":"2.4 – slide 28, 31"},{"c":"GPB24-07","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Cơ quan nào thường bị nhồi máu ĐỎ khi tắc động mạch?","o":["Tim","Phổi","Thận","Lách"],"a":1,"e":"Nhồi máu đỏ ở cơ quan có nguồn cấp máu kép hoặc nhu mô lỏng lẻo (phổi, ruột non). Nhồi máu trắng ở cơ quan có nguồn máu duy nhất, nhu mô đặc (tim, lách, thận).","w":"","k":"","f":"Slide 52 liệt kê cả gan trong ví dụ nhồi máu trắng, nhưng slide 56 lại nêu gan có tuần hoàn kép (bảo vệ chống nhồi máu); tài liệu chuẩn (Robbins) chỉ nêu tim, thận, lách. Nên hỏi lại giảng viên.","s":"2.4 – slide 50, 52, 56"},{"c":"GPB24-08","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Sốc nhiễm khuẩn thường do vi khuẩn nào gây ra?","o":["Vi khuẩn Gram âm như E. coli, Pseudomonas, Klebsiella","Vi khuẩn Gram dương như Staphylococcus","Mycobacterium tuberculosis","Virus paramyxo"],"a":0,"e":"Sốc nhiễm khuẩn: giãn mạch toàn thân do vi khuẩn, thường là Gram âm (E. coli, Pseudomonas, Klebsiella); tử vong 25–50%.","w":"","k":"","f":"","s":"2.4 – slide 60"},{"c":"GPB24-25","t":"2.4","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Xuất huyết được định nghĩa là:","o":["Hồng cầu thoát ra khỏi lòng mạch máu","Ứ máu thụ động trong tĩnh mạch","Ứ đọng dịch trong mô kẽ","Cục máu đông hình thành trong lòng mạch"],"a":0,"e":"Xuất huyết: hồng cầu thoát khỏi lòng mạch; thường do vỡ động mạch/tĩnh mạch (chấn thương, xơ vữa, viêm, loét mạch); chảy máu mao mạch có thể gặp trong sung huyết mạn.","w":"{#1}: sung huyết. {#2}: phù. {#3}: huyết khối.","k":"","f":"","s":"2.4 – slide 21"},{"c":"GPB24-26","t":"2.4","l":1,"p":"T","y":"Điền khuyết","q":"Trong tuần hoàn phổi, thuyên tắc khí cần lượng khí khoảng ___ mới có biểu hiện lâm sàng.","o":["nhiều hơn 100 ml (cc)","1–2 ml","10 ml","nhiều hơn 1 lít"],"a":0,"e":"Lượng nhỏ khí có thể gây tắc mạch vành hoặc não; trong tuần hoàn phổi cần > 100 cc mới có biểu hiện. Nguyên nhân: do thầy thuốc, chấn thương ngực, thay đổi đột ngột áp suất (thợ lặn, máy bay).","w":"","k":"","f":"","s":"2.4 – slide 45"},{"c":"GPB24-09","t":"2.4","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Đặc điểm đại thể của phù phổi là:","o":["Phổi xẹp, nhẹ hơn bình thường","Phổi nặng gấp 2–3 lần bình thường, mặt cắt có hỗn hợp sủi bọt hồng chứa khí, dịch phù và hồng cầu","Phổi màu đen, chắc, có “tế bào tim”","Phổi có ổ hoại tử bã đậu"],"a":1,"e":"Phù phổi có thể làm phổi nặng gấp 2–3 lần; mặt cắt sủi bọt hồng. Vi thể: dịch phù trong lòng phế nang, dày vách phế nang.","w":"Phổi màu đen, nặng, chắc với “tế bào tim” là sung huyết phổi MẠN TÍNH.","k":"","f":"","s":"2.4 – slide 13, 14"},{"c":"GPB24-10","t":"2.4","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Trong các yếu tố hình thành huyết khối, yếu tố có vai trò quan trọng nhất đối với huyết khối ĐỘNG MẠCH là:","o":["Sự ứ máu","Tổn thương nội mạc","Đột biến yếu tố V Leiden","Thuốc tránh thai đường uống"],"a":1,"e":"Ứ máu gây huyết khối tĩnh mạch; tổn thương nội mạc có vai trò quan trọng trong huyết khối động mạch (mảng xơ vữa loét, viêm nội tâm mạc).","w":"","k":"","f":"","s":"2.4 – slide 26, 29"},{"c":"GPB24-11","t":"2.4","l":2,"p":"C","y":"So sánh – phân biệt","q":"Đặc điểm của huyết khối TĨNH MẠCH là:","o":["Bắt đầu tại vị trí tổn thương nội mô như mảng xơ vữa","Chủ yếu ở van tim trong viêm nội tâm mạc nhiễm trùng","Xảy ra ở vị trí ứ đọng; khối khá đồng đều, nhiều hồng cầu xen fibrin thưa (huyết khối đỏ), > 90% ở tĩnh mạch chi dưới","Luôn có đường Zahn rõ và gắn chặt thành mạch"],"a":2,"e":"Huyết khối TM đặc trưng ở vị trí ứ đọng, tĩnh mạch lớn; khối đồng đều nhiều HC, fibrin thưa (huyết khối đỏ/ứ máu); > 90% ở TM chi dưới.","w":"","k":"","f":"","s":"2.4 – slide 31"},{"c":"GPB24-12","t":"2.4","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Về thuyên tắc ối, phát biểu ĐÚNG là:","o":["Tần suất rất thấp (1/80.000) nhưng tỷ lệ tử vong lên đến 80%, do sốc và DIC","Tần suất cao nhưng tỷ lệ tử vong thấp","Hình thái đặc trưng là khoảng sáng chứa mỡ","Chỉ cần dưới 100 ml dịch ối"],"a":0,"e":"Thuyên tắc ối: hiếm, tử vong ~80% do sốc và đông máu nội mạch lan tỏa; hình thái: tế bào gai không nhân trong lòng mạch phổi người mẹ.","w":"","k":"","f":"Số liệu theo slide. Tài liệu mới hơn ước tính tần suất khoảng 1/40.000 ca sinh và tử vong 20–60% (VD: Obstet Gynecol 2014; PMC3401570). Khi thi, ưu tiên số liệu trong slide.","s":"2.4 – slide 47"},{"c":"GPB24-27","t":"2.4","l":2,"p":"C","y":"Chọn đáp án sai","q":"Số phận (diễn tiến) của huyết khối – phương án nào KHÔNG đúng?","o":["Bong ra gây thuyên tắc","Chuyển dạng thành khối u","Tổ chức hóa, dính vào thành mạch","Nhiễm khuẩn, gieo rắc vi khuẩn"],"a":1,"e":"Nếu bệnh nhân sống sót, huyết khối có thể: thuyên tắc; tổ chức hóa (tế bào nội mô, cơ trơn, nguyên bào sợi kết hợp huyết khối dính vào thành mạch); huyết khối nhiễm khuẩn (hiếm); slide 26 nêu thêm tan rã.","w":"","k":"","f":"","s":"2.4 – slide 26, 32"},{"c":"GPB24-28","t":"2.4","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Thuyên tắc huyết khối hệ thống (trong tuần hoàn động mạch) chủ yếu bắt nguồn từ đâu và hay gặp nhất ở vị trí nào?","o":["Huyết khối trong tim (nội tâm mạc); chi dưới","Huyết khối tĩnh mạch sâu chi dưới; phổi","Mảng xơ vữa động mạch chủ; ruột","Huyết khối tĩnh mạch chậu; não"],"a":0,"e":"Khoảng 80% thuyên tắc hệ thống phát sinh từ huyết khối trong tim (2/3 sau nhồi máu cơ tim, 25% do nhĩ trái giãn – rung nhĩ). Vị trí: chi dưới (75%), não (10%); ruột, thận, lách, chi trên ít hơn.","w":"Huyết khối tĩnh mạch sâu gây thuyên tắc PHỔI (tuần hoàn tĩnh mạch), không phải thuyên tắc hệ thống.","k":"","f":"","s":"2.4 – slide 41"},{"c":"GPB24-13","t":"2.4","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân hội chứng thận hư, protein niệu nhiều, phù toàn thân rõ nhất ở mí mắt. Cơ chế chính gây phù là:","o":["Giảm áp suất thẩm thấu huyết tương do mất albumin","Tăng áp lực thủy tĩnh do ứ máu tĩnh mạch","Tắc nghẽn mạch bạch huyết","Tăng tính thấm thành mạch do chất trung gian hóa học"],"a":0,"e":"Giảm áp suất thẩm thấu xảy ra khi mất albumin (protein niệu/hội chứng thận hư) hoặc giảm tổng hợp protein. Phù do giảm protein máu thường nặng, lan tỏa, rõ ở mô liên kết lỏng lẻo như mí mắt.","w":"","k":"","f":"","s":"2.4 – slide 8, 14"},{"c":"GPB24-14","t":"2.4","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân nữ phù tay phải sau phẫu thuật nạo hạch nách điều trị ung thư vú. Cơ chế phù là:","o":["Tăng áp lực thủy tĩnh do suy tim","Tắc nghẽn mạch bạch huyết – phù cục bộ","Giảm áp suất thẩm thấu","Phù viêm do tăng tính thấm"],"a":1,"e":"Tắc mạch bạch huyết đẩy dịch vào mô kẽ, thường gây phù cục bộ: phù chân voi do giun chỉ, phù tay sau nạo hạch trong ung thư vú.","w":"","k":"","f":"","s":"2.4 – slide 10"},{"c":"GPB24-15","t":"2.4","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân suy tim trái lâu năm. Hình thái phổi phù hợp nhất là:","o":["Phổi nhồi máu trắng hình chêm","Phổi có huyết khối đúc khuôn tĩnh mạch phổi và đường Zahn","Phổi màu đen, nặng, chắc; phế nang có ĐTB ăn hemosiderin (“tế bào tim”), vách phế nang sợi hóa","Phổi có nhiều u hạt với đại bào Langhans"],"a":2,"e":"Sung huyết mạn ở phổi do suy tim trái: phổi đen, nặng, chắc; vi thể ĐTB ăn hemosiderin trong phế nang (tế bào tim), vách phế nang sợi hóa.","w":"","k":"","f":"","s":"2.4 – slide 18"},{"c":"GPB24-16","t":"2.4","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân giảm tiểu cầu nặng, da và niêm mạc xuất hiện rất nhiều chấm đỏ nhỏ 1–2 mm. Dạng xuất huyết này là:","o":["Ecchymoses","Petechiae","Hematoma","Hemarthrosis"],"a":1,"e":"Petechiae: chấm xuất huyết 1–2 mm ở da, màng nhầy, thanh mạc; do tăng áp lực nội mạch, giảm tiểu cầu hoặc khiếm khuyết chức năng tiểu cầu.","w":"","k":"","f":"","s":"2.4 – slide 23"},{"c":"GPB24-17","t":"2.4","l":3,"p":"T","y":"Chọn đáp án đúng","q":"Đột biến Leiden gây tăng đông máu di truyền vì:","o":["Làm thiếu hụt antithrombin III","Tạo kháng thể kháng phospholipid","Làm yếu tố V kháng lại sự bất hoạt bởi protein C","Tạo kháng thể hoạt hóa tiểu cầu sau dùng heparin"],"a":2,"e":"Đột biến gen yếu tố V (Leiden) phổ biến nhất trong tăng đông di truyền; làm yếu tố V kháng bất hoạt protein C.","w":"","k":"","f":"","s":"2.4 – slide 30"},{"c":"GPB24-18","t":"2.4","l":3,"p":"C","y":"Chọn đáp án đúng – giải thích","q":"Nhồi máu phổi thường là nhồi máu đỏ vì:","o":["Phổi chỉ có một động mạch duy nhất nuôi dưỡng","Nhu mô phổi đặc, chắc","Phổi có nguồn cung cấp máu kép và nhu mô lỏng lẻo","Nhồi máu phổi luôn do huyết khối tĩnh mạch phổi"],"a":2,"e":"Nhồi máu đỏ xảy ra ở cơ quan có nguồn cấp máu kép hoặc nhu mô lỏng lẻo (phổi, ruột non); vi thể hoại tử đông + nhiều hồng cầu thoát mạch.","w":"","k":"","f":"","s":"2.4 – slide 50"},{"c":"GPB24-19","t":"2.4","l":3,"p":"C","y":"Tính toán – phân loại","q":"Bệnh nhân chấn thương mất máu, tỉnh táo, da lạnh, rịn mồ hôi, mạch nhanh, chưa thở nhanh hay lú lẫn, huyết áp còn duy trì. Theo bài, lượng máu mất ước tính là:","o":["< 20% tổng khối lượng máu","20–40% tổng khối lượng máu","> 40% tổng khối lượng máu","> 60% tổng khối lượng máu"],"a":0,"e":"Sốc giảm thể tích: < 20% – da lạnh, rịn mồ hôi, nhịp tim nhanh; 20–40% – tăng hô hấp, có thể lú lẫn; > 40% – hạ huyết áp, vô niệu, mất tri giác.","w":"","k":"","f":"","s":"2.4 – slide 59"},{"c":"GPB24-20","t":"2.4","l":4,"p":"C","y":"Chọn đáp án đúng – phân tích","q":"Theo bài giảng, xơ gan có thể gây phù/cổ trướng qua cơ chế nào?","o":["Cả tăng áp lực thủy tĩnh (tĩnh mạch cửa) và giảm áp suất thẩm thấu (giảm tổng hợp protein)","Chỉ do tăng áp lực tĩnh mạch cửa","Chỉ do giảm tổng hợp protein","Tăng tính thấm thành mạch do viêm"],"a":0,"e":"Xơ gan xuất hiện ở cả 2 nhóm: (1) sẹo xơ cản trở máu TM cửa → tăng áp lực → rò dịch vào phúc mạc; (2) giảm tổng hợp protein → giảm áp suất thẩm thấu.","w":"{#1} và {#2} chỉ đúng một phần. {#3} sai vì phù do xơ gan là phù không do viêm (dịch thấm).","k":"","f":"","s":"2.4 – slide 7, 8"},{"c":"GPB24-21","t":"2.4","l":4,"p":"C","y":"Tình huống – vận dụng cao","q":"Nam 70 tuổi, sau mổ thay khớp háng nằm bất động 1 tuần, đột ngột đau ngực, khó thở, thở nhanh, ho ra máu. Chẩn đoán phù hợp nhất và nguồn gốc vật tắc là:","o":["Thuyên tắc mỡ từ tủy xương","Thuyên tắc phổi do huyết khối từ tĩnh mạch sâu chi dưới","Nhồi máu cơ tim do huyết khối động mạch vành","Thuyên tắc khí do thủ thuật"],"a":1,"e":"Tuổi cao, phẫu thuật, bất động → DVT; huyết khối theo TM về tim lên phổi gây thuyên tắc phổi (đau ngực đột ngột, khó thở, thở nhanh, ho ± máu). Nguyên nhân thường gặp nhất của thuyên tắc là huyết khối (99%).","w":"Thuyên tắc mỡ: sau gãy xương dài, 1–3 ngày, tam chứng chấm xuất huyết – rối loạn tâm thần – khó thở. Nhồi máu cơ tim: không phải bệnh cảnh ho máu sau bất động. Thuyên tắc khí: cần bối cảnh thủ thuật/thợ lặn/chấn thương ngực.","k":"","f":"","s":"2.4 – slide 34, 36–38"},{"c":"GPB24-22","t":"2.4","l":4,"p":"T","y":"Kết hợp nhiều nội dung","q":"Nam 25 tuổi gãy xương đùi do tai nạn; 2 ngày sau suy hô hấp đột ngột, lú lẫn, ban xuất huyết lan tỏa. Chẩn đoán và kỹ thuật xác định trên mô là:","o":["Thuyên tắc ối – thấy tế bào gai không nhân trong mạch phổi","Thuyên tắc phổi do huyết khối – nhuộm Masson","Thuyên tắc khí – nhuộm Congo","Thuyên tắc mỡ – nhuộm Oil red O trên mẫu cắt lạnh thấy các khoảng sáng trong mạch dương tính"],"a":3,"e":"Thuyên tắc mỡ: 90% do gãy xương dài; 1–3 ngày sau chấn thương; tam chứng chấm xuất huyết, thay đổi tâm thần, khó thở. Hình thái: khoảng sáng trong mạch, nhuộm dầu đỏ (Oil red O – lipid) dương tính trên mẫu cắt lạnh.","w":"","k":"","f":"","s":"2.4 – slide 42; 1.1 – slide 20"},{"c":"GPB24-23","t":"2.4","l":4,"p":"C","y":"Chọn đáp án đúng – phân tích","q":"Phát biểu nào ĐÚNG về nhồi máu?","o":["Nhồi máu do huyết khối tĩnh mạch xảy ra ở cơ quan có một tĩnh mạch duy nhất như tinh hoàn, buồng trứng","Nhồi máu não có vi thể là hoại tử đông","Tắc nghẽn phát triển chậm thường gây nhồi máu nặng hơn tắc nghẽn đột ngột","Tế bào cơ tim tổn thương không hồi phục chỉ sau 3–4 phút thiếu máu"],"a":0,"e":"97% nhồi máu do tắc động mạch; nhồi máu do huyết khối TM ở cơ quan có 1 TM duy nhất (tinh hoàn, buồng trứng).","w":"Nhồi máu não → hoại tử hóa lỏng (“hoại tử nước”). Tắc chậm cho phép phát triển tuần hoàn phụ nên ít gây nhồi máu. Neuron: 3–4 phút; cơ tim: 20–30 phút.","k":"","f":"","s":"2.4 – slide 49, 55, 56"},{"c":"GPB24-24","t":"2.4","l":4,"p":"C","y":"Tình huống – vận dụng cao","q":"Bệnh nhân nhiễm trùng tiểu nặng: sốt, ớn lạnh, da ẤM và đỏ ửng, mạch nhanh, huyết áp thấp, sau đó thiểu niệu. Loại sốc và tổn thương thận thường gặp là:","o":["Sốc giảm thể tích – nhồi máu đỏ thận","Sốc tim – sung huyết thận mạn","Sốc nhiễm khuẩn – hoại tử ống thận cấp","Sốc phản vệ – viêm cầu thận"],"a":2,"e":"Sốc nhiễm khuẩn ban đầu da ấm, đỏ do giãn mạch ngoại biên (khác sốc giảm thể tích/sốc tim: da lạnh, ẩm). Thận tổn thương thiếu máu rộng – hoại tử ống cấp → thiểu niệu, vô niệu.","w":"","k":"","f":"","s":"2.4 – slide 60–62"},{"c":"GPB24-29","t":"2.4","l":4,"p":"C","y":"Kết hợp nhiều nội dung","q":"Mảng xơ vữa động mạch loét → huyết khối → bong ra gây tắc một nhánh động mạch thận. Tổn thương thận phù hợp nhất là:","o":["Nhồi máu đỏ; vi thể hoại tử hóa lỏng","Nhồi máu trắng; vi thể hoại tử đông","Nhồi máu trắng; vi thể hoại tử hóa lỏng","Sung huyết mạn; ĐTB ăn hemosiderin"],"a":1,"e":"Thận có nguồn máu động mạch duy nhất, nhu mô đặc → nhồi máu trắng; vi thể của nhồi máu (trừ não) là hoại tử đông, sau đó phản ứng viêm và hồi phục từ vùng rìa, cuối cùng thay bằng sẹo.","w":"Nhồi máu đỏ gặp ở phổi, ruột non. Hoại tử hóa lỏng là vi thể của nhồi máu NÃO. Sung huyết mạn do ứ máu tĩnh mạch, không phải tắc động mạch.","k":"","f":"","s":"2.4 – slide 29, 36, 52, 55; 1.3 – slide 75"},{"c":"GPB25-01","t":"2.5","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Định nghĩa viêm theo bài giảng:","o":["Sự tăng sinh tế bào tự động không phụ thuộc cơ chế điều hòa","Phản ứng của hệ vi tuần hoàn dẫn đến sự di chuyển dịch và bạch cầu từ máu ra mô ngoài mạch nhằm bao vây, loại trừ tác nhân gây tổn thương","Sự ứ máu thụ động trong tĩnh mạch","Sự thay thế mô hoại tử bằng mô liên kết"],"a":1,"e":"Viêm là phản ứng của hệ vi tuần hoàn → dịch và bạch cầu ra mô ngoài mạch, bao vây và loại trừ VSV, kháng nguyên, tế bào chết, vật lạ. Viêm luôn đi đôi với sửa chữa.","w":"","k":"","f":"","s":"2.5 – slide 4"},{"c":"GPB25-02","t":"2.5","l":1,"p":"C","y":"Chọn đáp án sai","q":"Đặc điểm nào KHÔNG thuộc 3 đặc điểm mô học chính của viêm cấp?","o":["Sung huyết động","Phù viêm","Tăng sinh mô liên kết – mạch máu","Thấm nhập tế bào (chủ yếu BCĐNTT)"],"a":2,"e":"Viêm cấp: sung huyết động, phù viêm, thấm nhập tế bào (BCĐNTT). Tăng sinh mô liên kết – mạch máu là đặc điểm của viêm MẠN.","w":"","k":"","f":"","s":"2.5 – slide 5, 35"},{"c":"GPB25-03","t":"2.5","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Cơ chế CHÍNH gây phù viêm là:","o":["Tăng áp lực thủy tĩnh trong mao mạch","Giảm áp suất thẩm thấu huyết tương","Tắc nghẽn mạch bạch huyết","Tăng tính thấm thành mạch, xảy ra chủ yếu tại tiểu tĩnh mạch"],"a":3,"e":"Phù viêm do 2 cơ chế: tăng áp lực thủy tĩnh (do sung huyết động) và tăng tính thấm thành mạch – cơ chế chính, chủ yếu tại tiểu tĩnh mạch (tế bào nội mô co lại, lộ khoảng hở).","w":"","k":"","f":"","s":"2.5 – slide 9, 10"},{"c":"GPB25-04","t":"2.5","l":1,"p":"C","y":"Trình tự quy trình","q":"Ba giai đoạn của sự thấm nhập tế bào trong viêm cấp theo đúng thứ tự là:","o":["Xuyên mạch → tụ vách → hóa ứng động","Tụ vách → xuyên mạch → hóa ứng động","Hóa ứng động → tụ vách → xuyên mạch","Tụ vách → hóa ứng động → xuyên mạch"],"a":1,"e":"Thấm nhập tế bào là biến đổi quan trọng nhất của viêm cấp, gồm: tụ vách → xuyên mạch → hóa ứng động; xảy ra chủ yếu tại tiểu tĩnh mạch.","w":"","k":"","f":"","s":"2.5 – slide 16"},{"c":"GPB25-05","t":"2.5","l":1,"p":"T","y":"Điền khuyết","q":"Trong viêm cấp, ___ đầu bạch cầu xuyên mạch chủ yếu là BCĐNTT; ___ kế tiếp là mônô bào.","o":["6 giờ; 6 giờ","24 giờ; 24 giờ","48 giờ; 1 tuần","1 tuần; 2–3 tuần"],"a":1,"e":"Trong vòng 24 giờ đầu, bạch cầu xuyên mạch chủ yếu là BCĐNTT; 24 giờ kế tiếp là mônô bào; hồng cầu có thể di chuyển theo.","w":"","k":"","f":"","s":"2.5 – slide 21"},{"c":"GPB25-06","t":"2.5","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Chất trung gian hóa học nào có sẵn trong tế bào (không cần tổng hợp mới khi viêm)?","o":["Leukotrien","Histamin trong mastô bào","Prostaglandin","Thromboxane"],"a":1,"e":"Chất TGHH từ tế bào: có sẵn (histamin trong mastô bào) hoặc mới tổng hợp khi viêm (leukotrien, prostaglandin, thromboxane từ phospholipid màng).","w":"","k":"","f":"","s":"2.5 – slide 32"},{"c":"GPB25-07","t":"2.5","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Chất trung gian hóa học có nguồn gốc HUYẾT TƯƠNG, tác dụng chính gây đau là:","o":["Histamin","Bradykinin (hệ thống kinin)","Oxid nitric","Interleukin"],"a":1,"e":"Chất TGHH từ huyết tương hình thành từ 4 hệ thống: đông máu, kinin, tiêu fibrin, bổ thể. Bradykinin (hệ kinin): tăng tính thấm, gây đau.","w":"","k":"","f":"","s":"2.5 – slide 33, 34"},{"c":"GPB25-08","t":"2.5","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Hai đặc điểm mô học chính của viêm mạn tính là:","o":["Sung huyết động và phù viêm","Thấm nhập BCĐNTT và hoại tử hóa lỏng","Huyết khối và nhồi máu","Thấm nhập tế bào đơn nhân và tăng sinh mô liên kết – mạch máu"],"a":3,"e":"Viêm mạn kéo dài nhiều tuần – năm; 2 đặc điểm: thấm nhập tế bào đơn nhân (ĐTB, tương bào, lympho bào) và tăng sinh mô liên kết – mạch máu.","w":"","k":"","f":"","s":"2.5 – slide 35"},{"c":"GPB25-09","t":"2.5","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Thành phần tế bào chính trong phản ứng viêm mạn tính là:","o":["Đại thực bào","Bạch cầu đa nhân trung tính","Tiểu cầu","Mastô bào"],"a":0,"e":"ĐTB là thành phần chính của viêm mạn, nguồn gốc của nhiều chất TGHH (IL, TNF, NO, PDGF, FGF, TGF-β). Viêm mạn do ký sinh trùng có thêm BC ái toan.","w":"","k":"","f":"","s":"2.5 – slide 37, 38"},{"c":"GPB25-10","t":"2.5","l":1,"p":"C","y":"Chọn đáp án sai","q":"Tác nhân nào KHÔNG được bài giảng liệt kê là nguyên nhân gây viêm hạt?","o":["Mycobacterium tuberculosis","Staphylococcus gây áp xe","Bột talc, chỉ phẫu thuật","Tinh thể urate"],"a":1,"e":"Viêm hạt xảy ra khi tác nhân khó tiêu hủy: VK lao, phong, giang mai; Schistosoma; Cryptococcus; silic, talc, urate; chỉ phẫu thuật; sarcoidosis (chưa rõ tác nhân). Staphylococcus gây viêm mủ, áp xe.","w":"","k":"","f":"","s":"2.5 – slide 44"},{"c":"GPB25-11","t":"2.5","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Hai hình thức của quá trình sửa chữa tổn thương là:","o":["Phì đại và tăng sản","Tự tiêu và dị tiêu","Tái tạo và hóa sẹo","Chuyển sản và nghịch sản"],"a":2,"e":"Tái tạo: thay tế bào bị phá hủy bằng tế bào cùng loại. Hóa sẹo: thay mô hoại tử bằng mô liên kết.","w":"","k":"","f":"","s":"2.5 – slide 54"},{"c":"GPB25-12","t":"2.5","l":2,"p":"C","y":"Ghép cặp – giải thích triệu chứng","q":"Ghép đúng triệu chứng lâm sàng của ổ viêm cấp với cơ sở mô học:","o":["Nóng, đỏ ← phù viêm; sưng ← sung huyết động","Đau ← sung huyết động; sưng ← thấm nhập tế bào","Nóng ← hoại tử; đỏ ← xuất huyết","Nóng, đỏ ← sung huyết động; sưng ← phù viêm; đau ← căng giãn tận cùng thần kinh hoặc chất TGHH kích thích"],"a":3,"e":"Giãn cơ trơn tiểu ĐM và cơ thắt tiền mao mạch → máu ùa vào → sung huyết động → nóng đỏ. Phù viêm → sưng. Đau do tận cùng TK căng giãn vì dịch phù hoặc bị chất TGHH kích thích trực tiếp.","w":"","k":"","f":"","s":"2.5 – slide 7, 10"},{"c":"GPB25-13","t":"2.5","l":2,"p":"T","y":"Chọn đáp án sai","q":"Tác động tích cực của phù viêm – phát biểu nào SAI?","o":["Pha loãng các tác nhân gây viêm","Đưa kháng thể và bổ thể vào mô kẽ để trung hòa kháng nguyên, độc tố","Tạo hàng rào fibrin ngăn tác nhân lan rộng","Kích thích nguyên bào sợi tổng hợp collagen tạo sẹo"],"a":3,"e":"3 tác động tích cực: pha loãng tác nhân; đưa kháng thể, bổ thể vào mô kẽ; đưa yếu tố đông máu → hàng rào fibrin ngăn lan rộng.","w":"","k":"","f":"","s":"2.5 – slide 12"},{"c":"GPB25-14","t":"2.5","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Hai loại opsonin chính giúp bạch cầu nhận biết và kết dính vật thể cần thực bào là:","o":["C3b và mảnh Fc của IgG","C5a và IL-8","Histamin và serotonin","TNF-α và IFN-γ"],"a":0,"e":"Thực bào gồm 3 bước: nhận biết – kết dính, ôm bắt, tiêu hóa. Opsonin chính: mảnh bổ thể C3b và mảnh Fc của IgG.","w":"","k":"","f":"","s":"2.5 – slide 25, 26"},{"c":"GPB25-15","t":"2.5","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Yếu tố ức chế di chuyển (MIF) giúp tập trung ĐTB tại ổ viêm mạn được sản xuất bởi:","o":["Tiểu cầu – thu hút mônô bào","Lympho bào – giữ ĐTB lại ổ viêm","Đại thực bào – kích thích ĐTB phân bào","Tế bào nội mô – tăng tính thấm"],"a":1,"e":"3 cơ chế tập trung ĐTB: thu hút mônô bào từ lòng mạch (TNF-α, IL-8); ĐTB tăng sinh tại chỗ; ức chế ĐTB di chuyển ra khỏi ổ viêm nhờ MIF do lympho bào sản xuất.","w":"","k":"","f":"","s":"2.5 – slide 40"},{"c":"GPB25-16","t":"2.5","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Đặc điểm của mạch máu tân sinh trong viêm mạn là:","o":["Tế bào nội mô nhỏ hơn bình thường, không phân bào","Tế bào nội mô lớn hơn bình thường, đôi khi có hình ảnh phân bào","Thành mạch dày nhiều lớp cơ trơn","Không có tế bào nội mô"],"a":1,"e":"Các yếu tố tạo mạch như FGF do ĐTB sản xuất làm mạch có sẵn phân nhánh; mạch tân sinh có tế bào nội mô lớn, đôi khi phân bào.","w":"","k":"","f":"","s":"2.5 – slide 42, 43"},{"c":"GPB25-17","t":"2.5","l":2,"p":"C","y":"So sánh – phân biệt","q":"Phân biệt đại bào Langhans và đại bào ăn dị vật dựa vào:","o":["Kích thước: Langhans luôn nhỏ hơn 10 µm","Langhans có 1 nhân, đại bào ăn dị vật có nhiều nhân","Langhans có nguồn gốc từ lympho bào","Vị trí nhân: Langhans có nhân phân bố ở ngoại vi tế bào; đại bào ăn dị vật có nhân rải rác trong bào tương"],"a":3,"e":"Tế bào dạng biểu mô hòa nhập thành tế bào khổng lồ 40–50 µm, có thể đến 50 nhân; nhân ở vùng ngoại vi (Langhans) hoặc rải rác (đại bào ăn dị vật).","w":"","k":"","f":"","s":"2.5 – slide 45, 46"},{"c":"GPB25-18","t":"2.5","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Mô tả đúng về u hạt (granuloma):","o":["Tập hợp BCĐNTT quanh ổ hoại tử hóa lỏng, đường kính > 1 cm","Khối tăng sinh mô liên kết – mạch máu màu đỏ, dễ chảy máu","Khối u lành từ tế bào sợi","Tập hợp tế bào dạng biểu mô (ĐTB biến đổi) có viền lympho bào, ít tương bào; đường kính < 2 mm"],"a":3,"e":"U hạt < 2 mm: tế bào dạng biểu mô (nhân bầu dục, bào tương sáng), viền lympho bào và ít tương bào; ngoại vi có đại bào; trung tâm có thể hoại tử; u hạt lâu có thêm mô xơ bao quanh.","w":"","k":"{#1} mô tả MÔ HẠT (granulation tissue) – khác hoàn toàn U HẠT (granuloma).","f":"","s":"2.5 – slide 45"},{"c":"GPB25-19","t":"2.5","l":2,"p":"C","y":"Trình tự quy trình","q":"Ba giai đoạn diễn tiến của hóa sẹo theo đúng thứ tự:","o":["Hóa xơ → hóa sợi → thành lập mô hạt","Hóa sợi → mô hạt → hóa xơ","Mô hạt → hóa xơ → hóa sợi","Thành lập mô hạt → hóa sợi → hóa xơ"],"a":3,"e":"Mô hạt (tăng sinh mô liên kết mạch máu, đỏ, mềm, dễ chảy máu) → hóa sợi (nguyên bào sợi tổng hợp collagen) → hóa xơ (mạch máu và nguyên bào sợi teo dần).","w":"","k":"","f":"","s":"2.5 – slide 57–61"},{"c":"GPB25-20","t":"2.5","l":3,"p":"C","y":"Tình huống – kết hợp","q":"Chọc dịch màng phổi: tỷ trọng 1,025, protein khoảng 3,5 g%. Nhận định đúng nhất:","o":["Dịch tiết (dịch phù viêm) – gợi ý nguyên nhân viêm","Dịch thấm do suy tim","Dịch thấm do hội chứng thận hư","Dịch bạch huyết do tắc mạch bạch huyết"],"a":0,"e":"Dịch phù viêm (dịch xuất) có protein ~3 g%, tỷ trọng > 1,020. Dịch thấm (không viêm) ít protein, tỷ trọng < 1,012.","w":"","k":"","f":"","s":"2.5 – slide 9; 2.4 – slide 5"},{"c":"GPB25-21","t":"2.5","l":3,"p":"T","y":"Tình huống","q":"Mổ tử thi thấy bề mặt màng ngoài tim phủ một lớp chất xuất giàu fibrin, xù xì. Loại dịch xuất là:","o":["Dịch xuất tơ huyết","Dịch xuất thanh huyết","Dịch xuất xuất huyết","Dịch xuất mủ"],"a":0,"e":"Dịch xuất tơ huyết: dịch thanh huyết chứa nhiều fibrin, gặp trong viêm nặng hơn; ứ đọng trên bề mặt màng tim, màng phổi → viêm màng tim/màng phổi tơ huyết.","w":"","k":"","f":"","s":"2.5 – slide 13"},{"c":"GPB25-22","t":"2.5","l":3,"p":"T","y":"Chọn đáp án sai","q":"Chất nào sau đây KHÔNG có tác dụng hóa ứng động theo bảng chất trung gian hóa học trong bài?","o":["Histamin","C5a","Interleukin-8","Leukotrien"],"a":0,"e":"Hóa ứng động nội sinh: C5a, leukotrien, IL-8, PAF. Histamin, serotonin (từ mastô bào, tiểu cầu) gây tăng tính thấm thành mạch nhưng không hóa ứng động.","w":"","k":"","f":"","s":"2.5 – slide 23, 34"},{"c":"GPB25-23","t":"2.5","l":3,"p":"C","y":"Tình huống","q":"Viêm cơ tim cấp làm hoại tử nhiều tế bào cơ tim. Hướng diễn tiến nhiều khả năng nhất của tổn thương là:","o":["Tan hoàn toàn, phục hồi cấu trúc như cũ","Hóa sẹo","Áp-xe hóa","Tái tạo bằng tế bào cơ tim mới"],"a":1,"e":"Hóa sẹo xảy ra khi tổn thương quá nhiều, mô không tái tạo được (VD mô cơ tim) hoặc nhiều dịch xuất tơ huyết khó tái hấp thu. Tế bào cơ tim không còn khả năng phân bào.","w":"","k":"","f":"","s":"2.5 – slide 29, 56"},{"c":"GPB25-24","t":"2.5","l":3,"p":"T","y":"So sánh – phân biệt","q":"Sẹo lồi (keloid) và sẹo co kéo lần lượt là hậu quả của:","o":["Hoạt động quá mức nguyên bào sợi-cơ; tổng hợp quá mức collagen","Thành lập mô hạt thái quá; hóa xơ thiếu","Nhiễm trùng vết thươn
