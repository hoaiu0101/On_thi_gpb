g; thiếu collagen","Tổng hợp quá mức sợi collagen; hoạt động quá mức nguyên bào sợi-cơ (myofibroblast)"],"a":3,"e":"Trong hóa sợi: tổng hợp quá mức collagen → sẹo lồi; hoạt động quá mức nguyên bào sợi-cơ → sẹo co kéo. Mô hạt thái quá ở da → u hạt chùm.","w":"","k":"Đáp án {#0} đảo ngược hai cơ chế.","f":"","s":"2.5 – slide 59, 60"},{"c":"GPB25-29","t":"2.5","l":3,"p":"C","y":"Tình huống","q":"Ổ viêm cấp do vi khuẩn sinh mủ, mô bị tổn thương nhiều; mô hoại tử hóa lỏng tạo thành một khoang chứa mủ. Đây là hướng diễn tiến:","o":["Áp-xe hóa","Tan hoàn toàn","Hóa sẹo","Chuyển thành viêm hạt"],"a":0,"e":"4 hướng diễn tiến của viêm cấp: tan hoàn toàn; hóa sẹo; áp-xe hóa (vi khuẩn sinh mủ + tổn thương nhiều → hoại tử hóa lỏng tạo ổ áp-xe); chuyển thành viêm mạn.","w":"","k":"","f":"","s":"2.5 – slide 14, 29"},{"c":"GPB25-25","t":"2.5","l":4,"p":"T","y":"Tình huống – vận dụng cao","q":"Một bệnh nhân có bạch cầu vẫn LĂN được trên bề mặt nội mô nhưng không thể bám chặt, ngừng lăn để chuyển sang xuyên mạch. Khiếm khuyết nhiều khả năng ở cặp phân tử nào?","o":["Integrin – ICAM-1","P-selectin – chuỗi Sialyl-Lewis X","L-selectin – GlyCAM-1","E-selectin – chuỗi Sialyl-Lewis X"],"a":0,"e":"Liên kết selectin – Sialyl-Lewis X chỉ đủ cho bạch cầu lăn. Integrin được hoạt hóa tăng ái tính gắn ICAM-1 giúp bạch cầu bám chặt, ngừng lăn và chuyển sang xuyên mạch.","w":"Theo slide 19, liên kết selectin – Sialyl-Lewis X (kể cả E-selectin, bảng ghi “lăn và kết dính”) chưa đủ mạnh để bạch cầu bám chặt; chỉ integrin – ICAM-1 giúp ngừng lăn và xuyên mạch. Bệnh nhân vẫn lăn được nên các cặp selectin còn hoạt động.","k":"","f":"","s":"2.5 – slide 19, 20"},{"c":"GPB25-26","t":"2.5","l":4,"p":"C","y":"Chọn đáp án đúng – cơ chế","q":"Trong u hạt lao, chất trung gian làm tăng khả năng thực bào của ĐTB và chuyển dạng ĐTB thành tế bào dạng biểu mô (rồi hòa nhập thành đại bào Langhans) là:","o":["TNF-α do tế bào T CD4+","TGF-β do tế bào T CD8+","Interferon gamma do tế bào T CD4+ hoạt hóa","IL-8 do tiểu cầu"],"a":2,"e":"T CD4+ hoạt hóa sản xuất TNF-α (tác động nội mô → thấm nhập mônô bào, lympho bào) và IFN-γ (tăng thực bào, chuyển ĐTB thành TB dạng biểu mô → Langhans). ĐTB hoạt hóa tiết TGF-β, PDGF → xơ hóa.","w":"TNF-α chủ yếu thu hút tế bào viêm; TGF-β gây tăng sinh mô liên kết.","k":"","f":"","s":"2.5 – slide 50, 51"},{"c":"GPB25-27","t":"2.5","l":4,"p":"C","y":"Chọn đáp án đúng – cơ chế","q":"Về cơ chế hình thành u hạt lao, phát biểu nào ĐÚNG?","o":["Vi khuẩn lao khó tiêu hủy vì chứa rất nhiều độc tố","Cord factor và LAM ức chế hòa nhập túi thực bào với tiêu thể, nên vi khuẩn sống trong ĐTB; kèm quá mẫn týp IV","Hoại tử bã đậu trung tâm do BCĐNTT tiết enzyme","U hạt hình thành do quá mẫn týp I qua IgE"],"a":1,"e":"Hai yếu tố luôn có: tác nhân khó tiêu hủy + quá mẫn qua trung gian tế bào (týp IV). VK lao khó tiêu hủy KHÔNG do độc tố mà do vỏ (cord factor – glycolipid, LAM). Hoại tử bã đậu do T CD8+ tiêu hủy ĐTB mang VK + VK trực tiếp làm chết ĐTB.","w":"","k":"","f":"","s":"2.5 – slide 47, 48, 52"},{"c":"GPB25-28","t":"2.5","l":4,"p":"C","y":"Tình huống – phân tích","q":"Bệnh nhân viêm gan mạn do virus, hoại tử nhiều và khung liên kết bị phá hủy. Tế bào gan tái tạo sẽ tạo ra:","o":["Cấu trúc tiểu thùy gan bình thường","Các tiểu thùy giả – đám tế bào gan ngăn cách bởi mô xơ","Mô hạt chiếm toàn bộ gan","Không có tái tạo vì tế bào gan không phân bào"],"a":1,"e":"3 điều kiện tái tạo phục hồi như cũ: hoại tử không quá lớn; khung liên kết mạch máu còn nguyên; tế bào có khả năng phân bào. Khung bị phá hủy → tiểu thùy giả.","w":"{#3} sai: tế bào gan CÓ khả năng phân bào.","k":"","f":"","s":"2.5 – slide 55, 56"},{"c":"GPB25-30","t":"2.5","l":4,"p":"C","y":"Kết hợp nhiều nội dung","q":"Sinh thiết hạch: vùng trung tâm là chất vô định hình dạng hạt (mô bị phá hủy hoàn toàn), quanh đó là tế bào dạng biểu mô và đại bào có nhân xếp ở vùng ngoại vi tế bào, ngoài cùng là viền lympho bào. Hình thái hoại tử và loại đại bào là:","o":["Hoại tử hóa lỏng – đại bào ăn dị vật","Hoại tử bã đậu – đại bào Langhans","Hoại tử đông – đại bào Langhans","Hoại tử bã đậu – đại bào ăn dị vật"],"a":1,"e":"Hoại tử bã đậu (đặc trưng viêm lao): mô bị phá hủy hoàn toàn thành chất vô định hình dạng hạt. Đại bào có nhân xếp ở ngoại vi là đại bào Langhans; nhân rải rác là đại bào ăn dị vật.","w":"","k":"","f":"","s":"1.3 – slide 78, 79; 2.5 – slide 45, 53"},{"c":"GPB36-01","t":"3.6","l":1,"p":"C","y":"Chọn đáp án đúng","q":"U ác tính xuất phát từ mô sụn được gọi là:","o":["Chondroma","Chondrocarcinoma","Chondroblastoma","Chondrosarcoma"],"a":3,"e":"U lành trung mô = tên tế bào + OMA (chondroma); u ác trung mô = SARCOMA (chondrosarcoma); u ác biểu mô = CARCINOMA.","w":"","k":"","f":"","s":"3.6 – slide 8, 10"},{"c":"GPB36-02","t":"3.6","l":1,"p":"C","y":"Chọn đáp án đúng","q":"U nào sau đây là u ÁC dù tên có đuôi -OMA?","o":["Lipoma","Melanoma","Adenoma","Fibroma"],"a":1,"e":"Một số u ác nhưng có đuôi -OMA: lymphoma, melanoma, seminoma, mesothelioma.","w":"","k":"Đuôi -oma không phải lúc nào cũng là u lành.","f":"","s":"3.6 – slide 11"},{"c":"GPB36-03","t":"3.6","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Đặc điểm vi thể nổi bật nhất, không bao giờ thiếu, giúp phân biệt u thật với u giả, u với viêm là:","o":["Chuyển sản","Hoại tử","Thấm nhập tế bào viêm","Tăng sản tế bào"],"a":3,"e":"Tăng sản tế bào là đặc điểm nổi bật nhất, không bao giờ thiếu. Chuyển sản ít thấy ở u lành, thường gặp ở u ác.","w":"","k":"","f":"","s":"3.6 – slide 29, 31"},{"c":"GPB36-04","t":"3.6","l":1,"p":"C","y":"Trình tự quy trình","q":"Bốn giai đoạn trong quá trình phát triển tự nhiên của một u ác theo đúng thứ tự là:","o":["Tăng trưởng khối u → chuyển dạng ác tính → di căn → xâm nhập tại chỗ","Xâm nhập tại chỗ → chuyển dạng ác tính → tăng trưởng → di căn","Chuyển dạng ác tính → xâm nhập tại chỗ → tăng trưởng → di căn","Chuyển dạng ác tính → tăng trưởng khối u → xâm nhập tại chỗ → di căn"],"a":3,"e":"Natural history gồm 4 bước nối tiếp: chuyển dạng ác tính → tăng trưởng của khối u → xâm nhập tại chỗ → di căn.","w":"","k":"","f":"","s":"3.6 – slide 49"},{"c":"GPB36-05","t":"3.6","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Ba nhóm nguyên nhân chính gây ung thư (tác nhân sinh ung) là:","o":["Hóa chất, bức xạ, virus","Vi khuẩn, nấm, ký sinh trùng","Tuổi, giới, chủng tộc","Hormon, dinh dưỡng, stress"],"a":0,"e":"Các tác nhân sinh ung xếp thành 3 nhóm: hóa chất, bức xạ, virus; tác động riêng rẽ hoặc phối hợp.","w":"","k":"","f":"","s":"3.6 – slide 87"},{"c":"GPB36-06","t":"3.6","l":1,"p":"C","y":"Chọn đáp án sai","q":"Quá trình sinh ung là các đột biến gen không gây chết trên 4 loại gen. Gen nào KHÔNG thuộc 4 loại này?","o":["Tiền-oncogen (proto-oncogene)","Gen ức chế u","Gen mã hóa collagen týp IV","Gen điều hòa sự tự hủy tế bào (apoptosis)"],"a":2,"e":"4 loại gen: tiền-oncogen, gen ức chế u, gen điều hòa apoptosis, gen sửa chữa ADN.","w":"","k":"","f":"","s":"3.6 – slide 92"},{"c":"GPB36-26","t":"3.6","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Tổn thương tiền ung được định nghĩa là:","o":["Tổn thương chắc chắn sẽ chuyển thành ung thư","Ung thư giai đoạn sớm đã xâm nhập màng đáy","U lành có vỏ bao rõ","Tổn thương có nguy cơ cao chuyển thành ung thư nhưng không tất yếu xảy ra"],"a":3,"e":"Tổn thương tiền ung: nguy cơ cao chuyển thành ung thư nhưng không tất yếu. Gồm tổn thương sửa chữa tái tạo kéo dài, tăng sản không điển hình và nghịch sản, bạch sản.","w":"","k":"","f":"","s":"3.6 – slide 86"},{"c":"GPB36-07","t":"3.6","l":2,"p":"C","y":"So sánh – phân biệt","q":"Mô lách bình thường nằm ở bìu được xếp vào loại:","o":["Choristoma – mô bình thường ở vị trí bất thường (u nghịch tạo lạc chỗ)","Hamartoma – u nghịch tạo đúng chỗ","Teratoma – u quái","Sarcoma lách"],"a":0,"e":"Hamartôm: bẩm sinh, tăng sinh quá mức tại vị trí bình thường (hamartôm gan, nêvi sắc tố da). Côristôm: cấu trúc mô bình thường nhưng ở vị trí bất thường (u lách ở bìu, u vỏ thượng thận ở tinh hoàn).","w":"","k":"Hamartoma = đúng chỗ; Choristoma = lạc chỗ.","f":"","s":"3.6 – slide 5, 18"},{"c":"GPB36-08","t":"3.6","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Tổn thương nào sau đây thuộc nhóm tổn thương dạng u / u giả?","o":["U tuyến (adenoma) đại tràng","U mỡ (lipoma)","Pôlíp mũi","U nhú (papilloma)"],"a":2,"e":"Tổn thương dạng u/u giả: u hạt viêm, pôlíp mũi, nang bẩm sinh, nang ứ đọng, biến đổi do rối loạn nội tiết (phình giáp), hamartôm, choristôm.","w":"","k":"","f":"","s":"3.6 – slide 5"},{"c":"GPB36-09","t":"3.6","l":2,"p":"T","y":"So sánh – phân biệt","q":"Phân biệt đúng giữa u hỗn hợp (mixed tumor) và u quái (teratoma):","o":["U hỗn hợp: tế bào chuyển dạng biệt hóa theo nhiều hướng (VD u hỗn hợp tuyến nước bọt); u quái: tế bào mầm chuyển dạng biệt hóa thành bất kỳ loại tế bào nào","U hỗn hợp: tế bào mầm biệt hóa thành mọi loại tế bào; u quái: tế bào chuyển dạng biệt hóa nhiều hướng","Cả hai đều là u ác","Cả hai đều xuất phát từ mô sắc tố"],"a":0,"e":"U hỗn hợp: tế bào chuyển dạng sinh sản và biệt hóa theo nhiều hướng (u hỗn hợp tuyến nước bọt). U quái: tế bào mầm có khả năng biệt hóa thành bất kỳ loại tế bào nào.","w":"","k":"","f":"","s":"3.6 – slide 11"},{"c":"GPB36-10","t":"3.6","l":2,"p":"C","y":"Chọn đáp án sai","q":"Về đặc điểm đại thể của u, phát biểu nào SAI?","o":["U lành thường giới hạn rõ, có vỏ bao sợi, di động","Có u lành giới hạn rõ nhưng không có vỏ bao, như u cơ trơn thân tử cung","Mọi u ác đều có mặt cắt không đồng nhất, nhiều màu sắc","U ác thường có mặt cắt không đồng nhất do hoại tử, xuất huyết"],"a":2,"e":"Có những u ác có mặt cắt rất đồng nhất như limphôm, seminôm. U lành mạch máu giới hạn không rõ và không có vỏ bao.","w":"","k":"","f":"","s":"3.6 – slide 22, 23, 25"},{"c":"GPB36-11","t":"3.6","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Về kích thước u, phát biểu ĐÚNG theo bài giảng là:","o":["U > 5 cm chắc chắn là u ác","U ác luôn nhỏ hơn u lành khi phát hiện","Tương quan giữa kích thước với tính chất lành – ác không quan trọng; u lớn nhanh thường là u ác","Kích thước là tiêu chuẩn chính để xếp grad mô học"],"a":2,"e":"Kích thước tùy thời điểm phát hiện (1–2 cm đến 15–20 cm); tương quan kích thước – lành ác không quan trọng; u phát triển lớn nhanh thường là u ác.","w":"","k":"","f":"","s":"3.6 – slide 21"},{"c":"GPB36-12","t":"3.6","l":2,"p":"C","y":"So sánh – phân biệt","q":"Về đường di căn, nhận định ĐÚNG là:","o":["Carcinôm thường di căn theo đường máu trước tiên; sarcôm thường theo bạch huyết","Cả hai chủ yếu di căn theo đường ống tự nhiên","Mọi tế bào K vào dòng máu đều tạo ổ thứ phát","Carcinôm thường di căn theo đường bạch huyết; sarcôm thường di căn theo đường máu"],"a":3,"e":"Đường bạch huyết thường thấy ở carcinôm (sarcôm rất hiếm); đường máu là đường di căn trước tiên thường gặp ở sarcôm. Chỉ ≤ 1/1000 TB K vào máu tạo được ổ thứ phát.","w":"","k":"Carcinôm – bạch huyết; Sarcôm – máu.","f":"","s":"3.6 – slide 65, 67"},{"c":"GPB36-13","t":"3.6","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Đa số hóa chất sinh ung thuộc nhóm nào?","o":["Trực tiếp – tự gây tổn thương ADN ngay","Không gây đột biến ADN","Gián tiếp – cần được chuyển hóa trong cơ thể mới thành tác nhân sinh ung thực sự","Chỉ có nguồn gốc nhân tạo"],"a":2,"e":"Hóa chất sinh ung có ái lực điện tử cao, hầu hết là tác nhân gây đột biến. Đa số là loại gián tiếp. Không phải mọi tổn thương ADN đều dẫn đến ung thư vì TB có thể sửa chữa.","w":"","k":"","f":"","s":"3.6 – slide 88, 89"},{"c":"GPB36-14","t":"3.6","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Percival Pott (1775) ghi nhận tăng xuất độ ung thư da bìu ở thợ cạo ống khói. Tác nhân sinh ung ngày nay được xác định là:","o":["Tia cực tím","Virus HPV","Aflatoxin","Hydrocarbon thơm đa vòng trong bồ hóng"],"a":3,"e":"Đây là ví dụ kinh điển về yếu tố nghề nghiệp. Tương tự, ung thư CTC cao ở công nhân tình dục, hiếm ở nữ tu → HPV.","w":"","k":"","f":"","s":"3.6 – slide 80"},{"c":"GPB36-27","t":"3.6","l":2,"p":"C","y":"Chọn đáp án sai","q":"Tổn thương nào sau đây KHÔNG được bài giảng xếp vào nhóm tổn thương tiền ung?","o":["U mỡ dưới da","Bạch sản niêm mạc miệng","Nghịch sản biểu mô cổ tử cung","Lỗ dò da mạn tính"],"a":0,"e":"Tiền ung: vết loét da không lành, lỗ dò da mạn (→ carcinôm TB gai), viêm gan mạn; tăng sản không điển hình, nghịch sản (CTC, phế quản, đại tràng…); bạch sản niêm mạc miệng, dương vật, âm hộ.","w":"","k":"","f":"","s":"3.6 – slide 86"},{"c":"GPB36-15","t":"3.6","l":3,"p":"C","y":"So sánh – phân biệt","q":"Đặc điểm vi thể nào KHÔNG BAO GIỜ gặp ở u lành?","o":["Có một ít hình ảnh phân bào","Tế bào biệt hóa rõ như tế bào bình thường","Phân bào bất thường (3 cực, 4 cực, đa cực)","Có mô đệm nâng đỡ"],"a":2,"e":"U lành: một ít hình ảnh phân bào nhưng KHÔNG BAO GIỜ có phân bào bất thường; không xâm nhập, không di căn. Phân bào bất thường là đặc trưng u ác.","w":"","k":"","f":"","s":"3.6 – slide 36, 39"},{"c":"GPB36-16","t":"3.6","l":3,"p":"C","y":"So sánh – bảng u lành / u ác","q":"Theo bảng so sánh u lành – u ác, cặp đặc điểm nào ĐÚNG?","o":["U lành: tỉ lệ N/BT cao; u ác: tỉ lệ N/BT bình thường","U lành: mật độ cứng/mềm bở; u ác: chắc","U lành: cấu trúc mô chủ đảo lộn; u ác: giống mô lành","U lành: không tái phát sau cắt bỏ; u ác: dễ tái phát, gây tử vong"],"a":3,"e":"Bảng: tốc độ (chậm/nhanh), biệt hóa (giống/ít giống), giới hạn (rõ/không), vỏ (có/không), di động (tốt/kém), mật độ (chắc/cứng hoặc mềm bở), N/BT (bình thường/cao), phân bào (thấp, bình thường/cao, bất thường), xâm nhập & di căn (không/có), đáp ứng điều trị (không tái phát/dễ tái phát, tử vong).","w":"","k":"","f":"","s":"3.6 – slide 48"},{"c":"GPB36-17","t":"3.6","l":3,"p":"T","y":"Tình huống","q":"Carcinôm tế bào gai của da: tế bào u không tạo được cầu sừng nhưng còn liên kết với nhau bằng cầu liên bào, giống lớp trung gian biểu bì. Độ biệt hóa là:","o":["Biệt hóa tốt","Biệt hóa kém","Biệt hóa vừa","Không biệt hóa"],"a":2,"e":"Tốt: tiết keratin tạo cầu sừng. Vừa: không tạo cầu sừng, còn cầu liên bào. Kém: chỉ còn bào tương hồng (cytokeratin), rời rạc do mất cầu liên bào.","w":"","k":"","f":"","s":"3.6 – slide 42"},{"c":"GPB36-18","t":"3.6","l":3,"p":"C","y":"So sánh – phân biệt","q":"Về giá trị tiên lượng, nhận định đúng theo bài giảng là:","o":["Grad mô học quan trọng hơn giai đoạn vì khách quan hơn","Giai đoạn ung thư (TNM) có giá trị tiên lượng quan trọng hơn grad mô học vì grad ít nhiều mang tính chủ quan","Grad mô học càng cao thì độ ác tính càng thấp","Hệ thống grad giống nhau cho mọi loại u"],"a":1,"e":"Grad mô học càng cao càng ác; tiêu chuẩn khác nhau tùy loại u; grad mang tính chủ quan nên tiên lượng không quan trọng bằng xếp giai đoạn (TNM: T – u, N – hạch vùng, M – di căn).","w":"","k":"","f":"","s":"3.6 – slide 45, 47, 94"},{"c":"GPB36-19","t":"3.6","l":3,"p":"T","y":"Chọn đáp án đúng – cơ chế","q":"Tế bào u có thể phân chia “mãi mãi” (bất tử), vượt giới hạn Hayflick, chủ yếu nhờ:","o":["Sản xuất enzyme telomerase, ngăn rút ngắn đầu mút NST sau mỗi lần phân bào","Mất enzyme telomerase","Tăng ức chế tiếp xúc","Phụ thuộc chặt chẽ vào yếu tố tăng trưởng"],"a":0,"e":"Tế bào bình thường mất đầu mút NST sau vài chục lần phân bào (giới hạn Hayflick). TB u sản xuất telomerase; ~90% u người tăng hoạt tính telomerase → hướng điều trị nhắm đích.","w":"","k":"","f":"","s":"3.6 – slide 52, 53"},{"c":"GPB36-20","t":"3.6","l":3,"p":"T","y":"Ghép cặp","q":"Ghép đúng loại ung thư với sản phẩm “nghịch thường” mà tế bào u có thể tiết ra:","o":["Ung thư gan – CEA","Ung thư ruột – AFP","Carcinôm tế bào gai ở da – calcitonin","Ung thư phổi tế bào nhỏ – ACTH, ADH, serotonin"],"a":3,"e":"Ung thư phổi TB nhỏ → ACTH, ADH, serotonin; ung thư gan → AFP; ung thư ruột → CEA. Cơ chế: giải ức chế gen (gene derepression). Carcinôm TB gai da tiết keratin (chất giống TB nguyên ủy).","w":"","k":"AFP (gan) và CEA (ruột) hay bị đánh tráo.","f":"","s":"3.6 – slide 55"},{"c":"GPB36-21","t":"3.6","l":3,"p":"T","y":"So sánh – phân biệt","q":"Tế bào ung thư không tạo ổ thứ phát ở hạch đầu tiên mà chúng đến, nhưng tiếp tục theo dòng bạch huyết tạo ổ ở các hạch tiếp sau. Hiện tượng này là:","o":["Di căn cách quãng (skip metastases)","Di căn ngược","Di căn theo đường ống tự nhiên","Gieo rắc do dao mổ"],"a":0,"e":"Di căn cách quãng: bỏ qua hạch đầu tiên. Di căn ngược: từ hạch đã di căn đi ngược dòng bạch huyết tạo ổ ở hạch phía trước.","w":"","k":"","f":"","s":"3.6 – slide 66"},{"c":"GPB36-22","t":"3.6","l":4,"p":"C","y":"Tính toán – phân loại","q":"Sinh thiết carcinôm tuyến đại tràng: ước tính khoảng 40% tế bào u còn tạo được cấu trúc tuyến. Độ biệt hóa của u là:","o":["Biệt hóa tốt","Biệt hóa vừa","Biệt hóa kém","Không biệt hóa"],"a":2,"e":"Carcinôm tuyến xếp độ biệt hóa theo tỷ lệ TB u tạo cấu trúc tuyến: tốt > 95%; vừa 50–95%; kém 5% – < 50%; không biệt hóa < 5%. 40% thuộc nhóm kém.","w":"","k":"Dễ chọn “vừa” vì 40% gần 50%; mốc 50% thuộc nhóm vừa.","f":"","s":"3.6 – slide 43"},{"c":"GPB36-23","t":"3.6","l":4,"p":"T","y":"Trình tự – vận dụng cao","q":"Từ ung thư tại chỗ chuyển sang xâm nhập, 4 bước theo đúng thứ tự là:","o":["Phá hủy chất nền ngoại bào → tách rời tế bào u → di chuyển → gắn kết mới","Gắn kết mới → tách rời → phá hủy màng đáy → di chuyển","Tách rời → gắn kết mới → di chuyển → phá hủy màng đáy","Tách rời các tế bào u (mất E-cadherin) → phá hủy chất nền ngoại bào (metalloproteinase cắt collagen IV, laminin) → gắn kết mới → di chuyển trong chất nền ngoại bào"],"a":3,"e":"4 bước: (1) tách rời – màng TB u thay đổi, mất phân tử kết dính (E-cadherin); (2) phá hủy chất nền – metalloproteinase cắt collagen týp IV và laminin tạo “lỗ thủng”; (3) gắn kết mới với vị trí vừa lộ ra; (4) di chuyển qua lỗ thủng vào mô liên kết.","w":"","k":"","f":"","s":"3.6 – slide 62"},{"c":"GPB36-24","t":"3.6","l":4,"p":"T","y":"Phân tích dịch tễ","q":"Người Nhật có xuất độ ung thư dạ dày cao gấp ~10 lần người Mỹ, nhưng con cháu người Nhật nhập cư vào Mỹ lại có xuất độ thấp như dân bản xứ. Kết luận hợp lý nhất:","o":["Yếu tố chủng tộc quyết định","Yếu tố môi trường (VD chế độ ăn) đóng vai trò lớn hơn yếu tố chủng tộc","Ung thư dạ dày là ung thư di truyền trội","Tuổi là yếu tố duy nhất"],"a":1,"e":"Nếu do chủng tộc, thế hệ di cư vẫn giữ xuất độ cao; việc giảm xuống như dân bản xứ cho thấy yếu tố môi trường quan trọng hơn.","w":"","k":"","f":"","s":"3.6 – slide 76, 77"},{"c":"GPB36-25","t":"3.6","l":4,"p":"C","y":"Kết hợp nhiều nội dung","q":"Ung thư không biệt hóa ở vòm hầu không xác định được là carcinôm, sarcôm, lymphôm hay melanôm trên HE. Hướng xử trí phù hợp là:","o":["Xếp grad dựa vào kích thước u","Dùng kỹ thuật bổ sung như hóa mô miễn dịch hoặc kính hiển vi điện tử","Kết luận là u lành vì không có cấu trúc tuyến","Chỉ cần nhuộm PAS"],"a":1,"e":"Với ung thư không biệt hóa, có khi không xác định được nguyên ủy → dùng HMMD hoặc KHVĐT để chẩn đoán.","w":"","k":"","f":"","s":"3.6 – slide 44; 1.1 – slide 22"},{"c":"GPB37-01","t":"3.7","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Nguyên nhân thường gặp nhất của viêm tuyến nước bọt là:","o":["Staphylococcus do sỏi tắc ống","Virus quai bị (paramyxovirus)","Hội chứng Sjögren","Herpes simplex virus"],"a":1,"e":"Nhiễm virus quai bị (paramyxovirus) là nguyên nhân thường gặp nhất của viêm tuyến nước bọt.","w":"","k":"","f":"","s":"3.7 – slide 104"},{"c":"GPB37-02","t":"3.7","l":1,"p":"C","y":"Chọn đáp án đúng","q":"U lành tính thường gặp nhất của tuyến nước bọt và vị trí thường gặp nhất là:","o":["U Warthin – tuyến dưới hàm","Oncocytoma – tuyến dưới lưỡi","Carcinôm nhầy bì – tuyến mang tai","U tuyến đa dạng – tuyến mang tai"],"a":3,"e":"U tuyến đa dạng (u hỗn hợp, ~50% u TNB) thường ở tuyến mang tai. Bảng tần suất: u tuyến đa dạng 50%, Warthin 5%; carcinôm nhầy bì 15% (ác thường gặp nhất).","w":"","k":"","f":"","s":"3.7 – slide 107, 108"},{"c":"GPB37-03","t":"3.7","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Đặc điểm của u Warthin là:","o":["U lành, chỉ ở tuyến mang tai; vi thể 2 lớp tế bào ái toan lót khoang phân nhánh và mô lympho dưới biểu mô, có thể tạo nang lympho","U ác, gặp ở mọi tuyến nước bọt","U lành, mô đệm dạng sụn","U ác, gồm tế bào gai và tế bào tiết nhầy"],"a":0,"e":"U Warthin: u lành, chỉ ở tuyến mang tai (y văn: hầu như chỉ ở tuyến mang tai); đại thể nhỏ, tròn/bầu dục, có vỏ bao, mặt cắt trắng xám có khe/bọc chứa dịch nhầy hoặc thanh dịch.","w":"","k":"","f":"","s":"3.7 – slide 113"},{"c":"GPB37-04","t":"3.7","l":1,"p":"C","y":"Chọn đáp án đúng","q":"U ác nguyên phát thường gặp nhất ở tuyến nước bọt là:","o":["Carcinôm dạng tuyến nang","Carcinôm nhầy bì","Carcinôm tế bào túi tuyến","U hỗn hợp ác"],"a":1,"e":"Carcinôm nhầy bì là u ác nguyên phát thường gặp nhất (~15% u TNB), thường ở tuyến mang tai.","w":"","k":"","f":"","s":"3.7 – slide 107, 115"},{"c":"GPB37-15","t":"3.7","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Đặc điểm đại thể của u tuyến đa dạng là:","o":["Khối không vỏ bao, xâm nhập mô tuyến xung quanh, có bọc nhầy","U lành phát triển chậm, < 6 cm, bờ tương đối rõ, có vỏ bao sợi, bề mặt trơn láng","Nhỏ, tròn, mặt cắt trắng xám có khe hoặc bọc chứa dịch nhầy","Sưng to toàn bộ các tuyến nước bọt chính"],"a":1,"e":"U tuyến đa dạng: u hỗn hợp, lành tính, thường ở tuyến mang tai; đại thể < 6 cm, bờ tương đối rõ, vỏ bao sợi, bề mặt trơn láng.","w":"{#0}: carcinôm nhầy bì. {#2}: u Warthin. {#3}: viêm tuyến nước bọt do quai bị.","k":"","f":"","s":"3.7 – slide 108"},{"c":"GPB37-05","t":"3.7","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Về viêm tuyến nước bọt do quai bị, phát biểu ĐÚNG là:","o":["Vi thể là viêm hóa mủ tạo áp xe","Ở người trưởng thành có thể biến chứng viêm tụy và viêm tinh hoàn (dẫn đến vô sinh)","Chỉ gây sưng một tuyến dưới hàm","Vi thể có trung tâm mầm lympho quanh ống tuyến"],"a":1,"e":"Trẻ nhỏ: tổn thương giới hạn ở tuyến nước bọt; người lớn: biến chứng viêm tụy, viêm tinh hoàn. Đại thể: sưng to toàn bộ tuyến chính, đặc biệt tuyến mang tai. Vi thể: viêm mô kẽ lan tỏa, phù, thấm nhập đơn nhân, đôi khi ổ hoại tử.","w":"Viêm hóa mủ, áp xe: viêm do vi khuẩn. Trung tâm mầm quanh ống: Sjögren.","k":"","f":"","s":"3.7 – slide 104"},{"c":"GPB37-06","t":"3.7","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Vi thể của u tuyến đa dạng đặc trưng bởi:","o":["Hai lớp tế bào ái toan lót khoang kèm mô lympho phát triển","Tế bào gai và tế bào tiết nhầy xếp bè quanh bọc nhỏ","Thành phần biểu mô xếp ống, túi, dây, đám đặc trên nền mô đệm dạng niêm, đôi khi có đảo sụn hoặc xương","Đảo biểu mô có tế bào ngoại vi xếp hàng rào và trung tâm lưới hình sao"],"a":2,"e":"U tuyến đa dạng: đa dạng thành phần – biểu mô (TB nhỏ tròn/thoi xếp ống, túi, dây, đám) và mô đệm dạng niêm lỏng lẻo, đôi khi có đảo sụn/xương.","w":"{#0}: u Warthin. {#1}: carcinôm nhầy bì. {#3}: ameloblastoma.","k":"","f":"","s":"3.7 – slide 108, 110"},{"c":"GPB37-07","t":"3.7","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Thành phần tế bào chính trên vi thể carcinôm nhầy bì theo bài giảng là:","o":["Hai lớp tế bào ái toan và mô lympho","Tế bào gai và tế bào tiết nhầy, xếp thành dải, bè hoặc bao quanh các bọc nhỏ","Tế bào cơ biểu mô trong mô đệm dạng sụn","Tế bào dạng biểu mô và đại bào Langhans"],"a":1,"e":"Carcinôm nhầy bì: không vỏ bao, xâm nhập mô tuyến xung quanh; mặt cắt trắng xám có bọc nhầy; gồm tế bào gai và tế bào tiết nhầy.","w":"","k":"","f":"","s":"3.7 – slide 115"},{"c":"GPB37-16","t":"3.7","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Theo bảng tần suất u tuyến nước bọt trong bài, u LÀNH thường gặp thứ hai (sau u tuyến đa dạng) là:","o":["Oncocytoma","U Warthin","Cystadenoma","U tuyến tế bào đáy"],"a":1,"e":"Bảng: u lành – u tuyến đa dạng 50%, u Warthin 5%, oncocytoma 2%, cystadenoma 2%, u tuyến tế bào đáy 2%; u ác – carcinôm nhầy bì 15%, carcinôm tế bào túi tuyến 6%, carcinôm tuyến NOS 6%, carcinôm dạng tuyến nang 4%, u hỗn hợp ác 3%.","w":"","k":"","f":"","s":"3.7 – slide 107"},{"c":"GPB37-08","t":"3.7","l":3,"p":"C","y":"Tình huống","q":"Phụ nữ 50 tuổi than khô miệng, khô mắt kéo dài. Sinh thiết tuyến nước bọt thấy đám lympho bào quanh ống tuyến tạo trung tâm mầm. Chẩn đoán phù hợp nhất:","o":["Viêm tuyến nước bọt do quai bị","Viêm tuyến nước bọt tự miễn – hội chứng Sjögren","U Warthin","Viêm tuyến nước bọt do vi khuẩn"],"a":1,"e":"Hội chứng Sjögren: hệ miễn dịch tấn công tuyến nước bọt và tuyến lệ → khô miệng, khô mắt; vi thể đám lympho quanh ống tuyến tạo trung tâm mầm.","w":"","k":"","f":"","s":"3.7 – slide 105"},{"c":"GPB37-09","t":"3.7","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân sưng đau tuyến dưới hàm sau nhiều đợt sỏi tắc ống tuyến; vi thể có hoại tử hóa mủ, ổ áp xe. Tác nhân thường gặp và cơ chế là:","o":["Staphylococcus – viêm thứ phát sau tắc do sỏi","Paramyxovirus – lây qua nước bọt","Tự kháng thể – tự miễn","HPV – kích ứng mạn"],"a":0,"e":"Viêm TNB do vi khuẩn: thứ phát sau tắc do sỏi, Staphylococcus; viêm mô kẽ, hoại tử hóa mủ, áp xe; mạn tính: teo tiểu thùy, xơ hóa.","w":"","k":"","f":"","s":"3.7 – slide 106"},{"c":"GPB37-10","t":"3.7","l":3,"p":"C","y":"Chọn đáp án đúng – giải thích","q":"Theo hóa mô miễn dịch, các thành phần trong u tuyến đa dạng (kể cả mô đệm dạng niêm, sụn) đều xuất phát từ:","o":["Tế bào sụn trưởng thành","Tế bào lympho","Tế bào cơ biểu mô","Tế bào gai"],"a":2,"e":"HMMD cho thấy các thành phần trong u (biểu mô, mô đệm dạng niêm, đảo sụn/xương) đều xuất phát từ tế bào cơ biểu mô – giải thích tên “u hỗn hợp”.","w":"","k":"","f":"","s":"3.7 – slide 108"},{"c":"GPB37-11","t":"3.7","l":3,"p":"C","y":"Chọn đáp án đúng – giải thích","q":"Vì sao u tuyến đa dạng dễ tái phát sau phẫu thuật?","o":["Vì u ác tính ngay từ đầu","Vì u không có vỏ bao và xâm nhập thần kinh","Vì u có vỏ bao không hoàn toàn","Vì u luôn đa ổ ở cả hai bên"],"a":2,"e":"U có vỏ bao không hoàn toàn nên dễ tái phát; 2–3% tái phát hóa ác. Lâm sàng: phát triển chậm, không đau, khối phồng ở góc hàm (thùy nông tuyến mang tai), kích thước < 6 cm.","w":"","k":"","f":"","s":"3.7 – slide 108"},{"c":"GPB37-12","t":"3.7","l":4,"p":"C","y":"So sánh – vận dụng cao","q":"Hai mẫu sinh thiết tuyến mang tai đều có nhiều mô lympho. Đặc điểm nào giúp xác định mẫu là U WARTHIN chứ không phải hội chứng Sjögren?","o":["Có trung tâm mầm lympho","Lympho bào bao quanh ống tuyến","Khối có vỏ bao, khoang được lót biểu mô 2 lớp tế bào ái toan, mô lympho nằm dưới biểu mô","Bệnh nhân khô miệng, khô mắt"],"a":2,"e":"Warthin là u có vỏ bao với biểu mô 2 lớp ái toan lót khoang + mô lympho. Sjögren là viêm tự miễn: đám lympho quanh ống tuyến tạo trung tâm mầm, lâm sàng khô miệng – mắt.","w":"Trung tâm mầm/nang lympho có thể gặp ở cả hai nên không phân biệt. {#1} và {#3} là đặc điểm của Sjögren.","k":"","f":"","s":"3.7 – slide 105, 113"},{"c":"GPB37-13","t":"3.7","l":4,"p":"C","y":"Chọn đáp án sai","q":"Phân loại grad mô học của carcinôm nhầy bì KHÔNG dựa vào yếu tố nào sau đây?","o":["Tỉ lệ thành phần tế bào gai trong u","Mức độ dị dạng tế bào và phân bào","Hoại tử u","Kích thước khối u trên lâm sàng"],"a":3,"e":"Grad mô học phụ thuộc: tỉ lệ thành phần TB gai, sự dị dạng TB, phân bào, hoại tử u. Kích thước là yếu tố của xếp giai đoạn (T), không phải grad.","w":"","k":"Grad (mô học) ≠ giai đoạn (TNM).","f":"","s":"3.7 – slide 115; 3.6 – slide 94"},{"c":"GPB37-14","t":"3.7","l":4,"p":"C","y":"So sánh – phân biệt","q":"Đặc điểm nào gợi ý carcinôm nhầy bì hơn là u tuyến đa dạng?","o":["Khối không vỏ bao, xâm nhập mô tuyến xung quanh, di động kém, có thể đau do xâm nhiễm thần kinh","Khối phát triển chậm, không đau, có vỏ bao sợi, bề mặt trơn láng","Mô đệm dạng niêm có đảo sụn","Kích thước < 6 cm ở thùy nông"],"a":0,"e":"Carcinôm nhầy bì: 1–8 cm, chắc, di động kém, có thể đau (viêm/xâm nhiễm TK), không vỏ bao, xâm nhập. U tuyến đa dạng: chậm, không đau, vỏ bao sợi, trơn láng, < 6 cm.","w":"","k":"","f":"Slide 115 ghi đại thể carcinôm nhầy bì “giới hạn rõ” nhưng vi thể “không vỏ bao, xâm nhập”; phần mặt cắt lại đặt dưới mục vi thể – nên đối chiếu khi học.","s":"3.7 – slide 108, 115"},{"c":"GPB37-17","t":"3.7","l":4,"p":"C","y":"Tình huống – vận dụng cao","q":"Nữ 35 tuổi có khối ở góc hàm phát triển chậm 5 năm, không đau, di động; đã mổ bóc u, 3 năm sau tái phát nhiều nốt tại chỗ. Chẩn đoán ban đầu và giải thích phù hợp nhất:","o":["U Warthin – vì u luôn có ở cả hai bên","U tuyến đa dạng ở thùy nông tuyến mang tai – vì vỏ bao không hoàn toàn nên dễ tái phát","Carcinôm nhầy bì – vì u ác luôn tái phát","Viêm tuyến nước bọt do vi khuẩn – vì sỏi tái phát"],"a":1,"e":"U tuyến đa dạng: phát triển chậm, không đau, khám muộn; u ở thùy nông tuyến mang tai tạo khối phồng góc hàm; vỏ bao không hoàn toàn nên dễ tái phát (2–3% tái phát hóa ác).","w":"Carcinôm nhầy bì thường di động kém, có thể đau, không vỏ bao. Warthin là u lành có vỏ bao, slide không nêu tái phát đa nốt. Viêm do vi khuẩn là viêm, không phải khối u.","k":"","f":"","s":"3.7 – slide 108"},{"c":"GPB38-01","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Biểu mô phủ niêm mạc khoang miệng là:","o":["Biểu mô trụ giả tầng có lông chuyển","Biểu mô trụ đơn tiết nhầy","Biểu mô lát tầng, có hoặc không sừng hóa","Biểu mô chuyển tiếp"],"a":2,"e":"Niêm mạc miệng: biểu mô lát tầng có/không sừng hóa → màng đáy → mô liên kết (collagen, mạch máu, TK) → tuyến nước bọt nhỏ phân bố rộng.","w":"","k":"","f":"","s":"3.8 – slide 4"},{"c":"GPB38-02","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Đặc điểm của loét áp-tơ theo bài giảng:","o":["Thường gặp ở người > 60 tuổi, loét cứng bờ gồ","Bóng nước thành cụm ở môi, tế bào có thể vùi","Thường trước 20 tuổi; vết loét nhỏ < 5 mm, viền đỏ, màng fibrin vàng; ở nếp lợi–má, đầu và bờ lưỡi; tự giới hạn, có thể tái phát","Mảng trắng cạo được, lộ nền đỏ"],"a":2,"e":"Loét áp-tơ: nguyên nhân chưa rõ (stress, sốt, thức ăn, viêm ruột); vi thể TB viêm đơn nhân → đa nhân khi bội nhiễm; mô học loét phủ fibrin, viêm cấp/mạn, mô hạt.","w":"","k":"","f":"","s":"3.8 – slide 8, 11"},{"c":"GPB38-03","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Hình ảnh vi thể đặc trưng của nhiễm Herpes simplex (HSV-1) ở miệng là:","o":["Loét phủ fibrin với mô hạt đơn thuần","Biểu mô vảy loạn sản nặng xâm lấn mô đệm","Sợi nấm, bào tử","Bóng nước trong biểu mô; tế bào nhiễm virus phồng to, nhân chứa thể vùi (Cowdry type A), đại bào nhiều nhân"],"a":3,"e":"HSV-1: bóng nước < 5 mm ở môi, lợi, sàn miệng, lưỡi → loét nông, tự khỏi, tái phát; vi thể TB phồng to, thể vùi trong nhân, đại bào nhiều nhân ở vách hoặc trôi trong bóng nước.","w":"","k":"","f":"","s":"3.8 – slide 10, 11"},{"c":"GPB38-04","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Bạch sản (leukoplakia) được định nghĩa là:","o":["Mảng trắng cạo tróc được, do nấm","Mảng đỏ mềm do viêm cấp","Mảng trắng không cạo tróc được, là tổn thương tiền ung","Bóng nước tái phát do virus"],"a":2,"e":"Bạch sản: mảng trắng không cạo tróc được, tổn thương tiền ung; người lớn tuổi; liên quan thuốc lá, rượu, kích thích lâu dài, viêm mạn, HPV.","w":"","k":"","f":"","s":"3.8 – slide 13"},{"c":"GPB38-05","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Vi thể của bạch sản niêm mạc miệng là:","o":["Sợi nấm và bào tử trong lớp sừng","Thể vùi Cowdry A trong nhân","Đảo biểu mô lưới hình sao","Tăng sừng, tăng gai của biểu mô lát tầng; biểu mô có thể tiến triển nghịch sản → ung thư"],"a":3,"e":"Bạch sản – đại thể: một hoặc nhiều mảng trắng, gồ cao, láng hoặc sùi, cứng (niêm mạc má, lưỡi, sàn miệng); vi thể: tăng sừng, tăng gai; ± nghịch sản → ung thư.","w":"","k":"","f":"","s":"3.8 – slide 13; 3.6 – slide 86"},{"c":"GPB38-06","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Trong nhóm tổn thương nguồn gốc răng, tổn thương nào là U (không phải nang)?","o":["U nguyên bào men răng (ameloblastoma)","Nang chân răng (radicular cyst)","Nang thân răng (dentigerous cyst)","Nang ứ đọng"],"a":0,"e":"Nang nguồn gốc răng: radicular cyst, dentigerous cyst. U nguồn gốc răng: ameloblastoma, odontoma.","w":"","k":"","f":"","s":"3.8 – slide 27"},{"c":"GPB38-07","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Ung thư biểu mô chủ yếu của khoang miệng và một vị trí thường gặp cần lưu ý là:","o":["Adenocarcinoma – khẩu cái cứng","Melanoma – lợi","Lymphoma – amidan","Carcinôm tế bào gai (OSCC) – bờ bên lưỡi"],"a":3,"e":"OSCC là ung thư biểu mô chủ yếu; vị trí thường gặp: bờ bên lưỡi, sàn miệng, lợi, niêm mạc má.","w":"","k":"","f":"","s":"3.8 – slide 37"},{"c":"GPB38-08","t":"3.8","l":1,"p":"C","y":"Ghép cặp","q":"Theo bài giảng, yếu tố nguy cơ nào liên quan đặc biệt đến ung thư ở MÔI?","o":["Tia cực tím","HPV","Rượu","Nhiễm Candida"],"a":0,"e":"Yếu tố nguy cơ OSCC: thuốc lá, rượu, HPV (đặc biệt quan trọng ở vùng hầu họng), kích thích mạn tính, tia cực tím → môi, một số bệnh lý tiền ung.","w":"","k":"","f":"","s":"3.8 – slide 37"},{"c":"GPB38-27","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Theo cách tiếp cận tổn thương khoang miệng (4 nhóm), hồng sản (erythroplakia) thuộc nhóm nào?","o":["Tổn thương trắng","Loét","Khối/u","Tổn thương đỏ"],"a":3,"e":"4 nhóm: (1) tổn thương trắng – bạch sản, nấm Candida; (2) tổn thương đỏ – hồng sản; (3) loét – áp-tơ, HSV, carcinoma; (4) khối/u – u nhú, u sợi, carcinoma.","w":"","k":"","f":"","s":"3.8 – slide 6"},{"c":"GPB38-28","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Đặc điểm đại thể của u nguyên bào men răng (ameloblastoma) theo bài giảng là:","o":["Nốt đỏ tím ở nướu, kích thước < 2 cm","Khối cản quang gồm nhiều cấu trúc nhỏ giống răng","Mảng trắng không cạo tróc được","U xương hàm, phát triển chậm, có thể gây phồng xương"],"a":3,"e":"Ameloblastoma – đại thể: u xương hàm, phát triển chậm, có thể gây phồng xương; vi thể: đảo/nang biểu mô, ngoại vi xếp hàng rào, trung tâm lưới hình sao.","w":"{#0}: u hạt TB khổng lồ ngoại vi. {#1}: u răng hỗn hợp. {#2}: bạch sản.","k":"","f":"","s":"3.8 – slide 33"},{"c":"GPB38-29","t":"3.8","l":1,"p":"C","y":"Chọn đáp án đúng","q":"Nguyên nhân thường gặp của u nhú gai khoang miệng theo bài giảng là:","o":["Nấm Candida albicans","HPV, kích ứng mạn tính hoặc tự lây nhiễm","Virus paramyxo","Tắc ống tuyến do sỏi"],"a":1,"e":"U nhú gai: thường do HPV, kích ứng mạn hoặc tự lây nhiễm; đại thể dạng sùi, có cuống hoặc nền rộng; vi thể nhú mô liên kết phủ biểu mô lát tầng tăng gai.","w":"","k":"","f":"","s":"3.8 – slide 25"},{"c":"GPB38-30","t":"3.8","l":1,"p":"T","y":"Chọn đáp án đúng","q":"Cơ chế gây sâu răng theo bài giảng là:","o":["Viêm mạn phá hủy dây chằng nha chu","Tăng sinh biểu mô Malassez","Phá hủy cấu trúc răng bởi sản phẩm acid cuối cùng của quá trình vi khuẩn lên men đường","Nhiễm virus Herpes"],"a":2,"e":"Sâu răng gây mất răng ở người dưới 35 tuổi, do phá hủy cấu trúc răng bởi các sản phẩm acid cuối cùng của quá trình lên men đường bởi vi khuẩn.","w":"{#0} là viêm nha chu.","k":"","f":"","s":"3.8 – slide 3"},{"c":"GPB38-09","t":"3.8","l":2,"p":"C","y":"So sánh – phân loại","q":"Ghép đúng kiểu niêm mạc miệng với vị trí và đặc điểm sừng hóa:","o":["Niêm mạc nhai: lợi, khẩu cái cứng – sừng hóa; niêm mạc lót: môi, má, sàn miệng – không sừng hóa","Niêm mạc nhai: môi, má, sàn miệng – không sừng hóa","Niêm mạc lót: lợi, khẩu cái cứng – sừng hóa","Niêm mạc chuyên biệt: khẩu cái mềm – không có nhú"],"a":0,"e":"3 kiểu: nhai (lợi, khẩu cái cứng – sừng hóa); lót (môi, má, sàn miệng – không sừng hóa); chuyên biệt (mặt lưng lưỡi – nhú, gai vị giác).","w":"","k":"{#1} và {#2} tráo vị trí giữa niêm mạc nhai và lót.","f":"","s":"3.8 – slide 5"},{"c":"GPB38-10","t":"3.8","l":2,"p":"T","y":"So sánh – phân biệt","q":"Phân biệt đúng viêm lợi và viêm nha chu:","o":["Viêm lợi phá hủy cấu trúc hỗ trợ gây mất răng; viêm nha chu luôn hồi phục","Cả hai đều do sản phẩm acid lên men đường phá hủy men răng","Viêm lợi phổ biến và có thể hồi phục; viêm nha chu là viêm mạn phá hủy cấu trúc hỗ trợ, cuối cùng mất răng","Viêm nha chu không liên quan vệ sinh răng miệng"],"a":2,"e":"Viêm lợi: phổ biến, có thể hồi phục, liên quan mảng bám và vôi răng. Viêm nha chu: viêm mạn, phá hủy cấu trúc hỗ trợ → mất răng; liên quan vệ sinh và hệ vi sinh miệng. Sâu răng: acid lên men đường, gây mất răng ở người < 35 tuổi.","w":"","k":"","f":"","s":"3.8 – slide 3"},{"c":"GPB38-11","t":"3.8","l":2,"p":"T","y":"Chọn đáp án đúng","q":"U hạt tế bào khổng lồ ngoại vi có đặc điểm lâm sàng:","o":["Chỉ ở trong xương hàm, không liên quan nướu","Thường ở nướu hoặc bờ xương ổ răng mất răng, nốt màu đỏ tím < 2 cm; được cho là phản ứng với kích thích/chấn thương tại chỗ","Chủ yếu ở thanh thiếu niên 10–19 tuổi, nữ ưu thế","Mảng trắng không cạo được"],"a":1,"e":"U hạt TB khổng lồ ngoại vi: tổn thương phản ứng thường gặp; nốt đỏ tím < 2 cm ở nướu/bờ xương ổ răng mất răng; có/không cuống, có thể loét; mọi lứa tuổi (TB 31–46); có thể gây tiêu xương ổ lân cận.","w":"Tuổi 10–19, nữ ưu thế là đặc điểm của u sợi tạo xương ngoại vi.","k":"","f":"Slide 15 ghi “xương hàm trên > xương hàm dưới”, nhưng nhiều nghiên cứu ghi u hạt TB khổng lồ ngoại vi gặp ở HÀM DƯỚI nhiều hơn (~59%). Câu hỏi tránh kiểm tra chi tiết này.","s":"3.8 – slide 15"},{"c":"GPB38-12","t":"3.8","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Vi thể của u nhú gai khoang miệng là:","o":["Đảo biểu mô có lưới hình sao","Nhú mô liên kết được phủ bởi biểu mô lát tầng tăng gai, có thể tăng sừng","Tế bào gai ác tính xâm nhập mô đệm","Tế bào khổng lồ đa nhân"],"a":1,"e":"U nhú gai: thường do HPV, kích ứng mạn hoặc tự lây nhiễm; đại thể dạng sùi, có cuống hoặc nền rộng; vi thể nhú mô liên kết phủ biểu mô lát tầng, tăng gai, ± tăng sừng.","w":"","k":"","f":"","s":"3.8 – slide 25, 26"},{"c":"GPB38-13","t":"3.8","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Nang chân răng (radicular cyst) có nguồn gốc và đặc điểm mô bệnh học:","o":["Từ biểu mô sót Malassez trong dây chằng nha chu, do viêm tủy mạn/hoại tử tủy; lót biểu mô lát tầng không sừng hóa, vỏ xơ thâm nhiễm nhiều TB viêm mạn","Từ biểu mô men giảm sản quanh thân răng ngầm; biểu mô mỏng 2–3 lớp, ít viêm","Từ tế bào cơ biểu mô; mô đệm dạng niêm","Từ mô răng biệt hóa; khối cản quang"],"a":0,"e":"Nang chân răng: nang viêm phổ biến nhất vùng hàm mặt; viêm tủy mạn → hoại tử tủy kích thích biểu mô Malassez quanh chóp tăng sinh; vỏ xơ thâm nhiễm lympho bào, tương bào, ĐTB.","w":"{#1} là nang thân răng.","k":"","f":"","s":"3.8 – slide 28"},{"c":"GPB38-14","t":"3.8","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Về u răng (odontoma), phát biểu ĐÚNG là:","o":["Là u ác tính sinh răng thường gặp nhất","Trên X-quang là vùng thấu quang đơn thuần không có cản quang","Luôn gây đau và phát triển nhanh","Là u lành sinh răng phổ biến nhất, thực chất là một dạng hamartoma gồm men, ngà, xê-măng và tủy răng"],"a":3,"e":"Odontoma: phổ biến nhất trong u sinh răng, thực chất hamartoma; thường không triệu chứng, phát triển chậm, phát hiện tình cờ: khối cản quang rõ được bao bởi viền thấu quang.","w":"","k":"","f":"","s":"3.8 – slide 31"},{"c":"GPB38-15","t":"3.8","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Vi thể của u nguyên bào men (ameloblastoma) dạng nang đặc trưng bởi:","o":["Mô răng biệt hóa (men, ngà) xếp lộn xộn","Biểu mô 2 lớp ái toan và mô lympho","Tế bào gai ác tính với cầu sừng","Đảo biểu mô với tế bào ngoại vi hình trụ/khối vuông xếp hàng rào, nhân phân cực; trung tâm là tế bào dạng lưới hình sao"],"a":3,"e":"Ameloblastoma: u xương hàm phát triển chậm, có thể gây phồng xương; vi thể đảo/nang biểu mô, ngoại vi xếp hàng rào (peripheral palisading) giống nguyên bào tạo men, trung tâm giống lưới hình sao; hay tạo nang.","w":"","k":"","f":"","s":"3.8 – slide 33–35"},{"c":"GPB38-31","t":"3.8","l":2,"p":"C","y":"Chọn đáp án đúng","q":"Về đại thể của carcinôm tế bào gai khoang miệng (OSCC), phát biểu ĐÚNG là:","o":["Luôn là khối có cuống, mềm, bề mặt nhẵn","Luôn là bóng nước thành cụm","Có thể biểu hiện mảng trắng, mảng đỏ, loét, sùi, thâm nhiễm hoặc khối cứng","Chỉ là mảng trắng cạo tróc được"],"a":2,"e":"OSCC đại thể rất đa dạng: mảng trắng, mảng đỏ, loét, sùi, thâm nhiễm, khối cứng. Dấu hiệu cảnh báo: loét không lành + cứng + thâm nhiễm → nghĩ carcinoma.","w":"","k":"","f":"","s":"3.8 – slide 38"},{"c":"GPB38-32","t":"3.8","l":2,"p":"T","y":"So sánh – phân biệt","q":"Đặc điểm đại thể nào phù hợp với u răng PHỨC HỢP (complex odontoma)?","o":["Nhiều cấu trúc nhỏ giống răng bình thường","Nang lót biểu mô mỏng bao quanh thân răng ngầm","Bề mặt không đều, mật độ như sỏi; mặt cắt màu trắng lẫn nâu, hình dạng không đều","Nốt đỏ tím có cuống ở nướu"],"a":2,"e":"U răng phức hợp: khối mô răng lộn xộn, bề mặt không đều, mật độ như sỏi, mặt cắt trắng lẫn nâu. U răng hỗn hợp: nhiều cấu trúc nhỏ giống răng.","w":"{#0}: u răng hỗn hợp. {#1}: nang thân răng. {#3}: u hạt TB khổng lồ ngoại vi.","k":"","f":"","s":"3.8 – slide 31, 32"},{"c":"GPB38-33","t":"3.8","l":2,"p":"T","y":"Chọn đáp án đúng","q":"Điều trị u hạt tế bào khổng lồ ngoại vi theo bài giảng là:","o":["Phẫu thuật cắt bỏ khối u đến tận xương nền và làm sạch răng lân cận để loại nguồn kích thích","Xạ trị","Chỉ theo dõi vì u tự khỏi","Kháng sinh kéo dài"],"a":0,"e":"Điều trị: cắt bỏ đến tận xương nền; vệ sinh răng lân cận để loại bỏ kích thích, giảm tái phát. Khoảng 10–20% tái phát, điều trị bằng cắt bỏ lại.","w":"","k":"","f":"","s":"3.8 – slide 17"},{"c":"GPB38-16","t":"3.8","l":3,"p":"C","y":"Tình huống","q":"Bệnh nhân có vết loét niêm mạc má tồn tại 3 tuần, điều trị thông thường không lành. Theo nguyên tắc tiếp cận tổn thương khoang miệng, bước tiếp theo bắt buộc là:","o":["Tiếp tục theo dõi thêm 2 tháng","Chỉ bôi kháng nấm","Sinh thiết","Chỉ cần cạo tổn thương soi tươi"],"a":2,"e":"Nguyên tắc: mô tả tổn thương (màu, bờ, kích thước, số lượng), thời gian tồn tại, sinh thiết – tổn thương dai dẳng > 2 tuần → sinh thiết bắt buộc.","w":"","k":"","f":"","s":"3.8 – slide 6"},{"c":"GPB38-17","t":"3.8","l":3,"p":"C","y":"Tình huống – phân biệt","q":"Bệnh nhân suy giảm miễn dịch có mảng trắng ở niêm mạc miệng; dùng đè lưỡi cạo được, để lộ nền mô viêm đỏ. Vi thể nhiều khả năng thấy:","o":["Tăng sừng, tăng gai, có thể nghịch sản","Đảo biểu mô xếp hàng rào","Sợi nấm và bào tử Candida albicans","Tế bào khổng lồ đa nhân trên nền mô đệm hình thoi"],"a":2,"e":"Nhiễm nấm Candida albicans (30–40% dân số mang thường trú; gặp khi suy giảm MD, bệnh nền): mảng trắng cạo được, lộ nền đỏ; vi thể sợi nấm, bào tử.","w":"{#0} là bạch sản – mảng trắng KHÔNG cạo tróc được.","k":"Cạo được → nấm; không cạo được → bạch sản.","f":"","s":"3.8 – slide 9, 13"},{"c":"GPB38-18","t":"3.8","l":3,"p":"T","y":"Chọn đáp án đúng","q":"Vi thể của u hạt tế bào khổng lồ ngoại vi gồm:","o":["U hạt với hoại tử bã đậu trung tâm","Đảo biểu mô có tế bào ngoại vi xếp hàng rào","Nhú mô liên kết phủ biểu mô lát tầng tăng gai","Tăng sinh tế bào khổng lồ đa nhân trên nền mô đệm gồm tế bào bầu dục/hình thoi; thường có xuất huyết với ĐTB chứa hemosiderin"],"a":3,"e":"U ngăn cách bề mặt niêm mạc bởi vùng xơ hóa; TB hình thoi trong mô đệm có phân bào; có thể có TB viêm, xương phản ứng, canxi hóa thoái hóa. Điều trị cắt đến tận xương nền; tái phát 10–20%.","w":"","k":"","f":"","s":"3.8 – slide 16, 17"},{"c":"GPB38-19","t":"3.8","l":3,"p":"T","y":"Tình huống","q":"Nữ 15 tuổi có khối chắc trên nhú nướu giữa răng cửa bên và răng nanh; vi thể là tăng sinh dày đặc nguyên bào sợi kèm chất khoáng hóa, có tạo xương ở phần sâu. Chẩn đoán phù hợp nhất:","o":["U hạt tế bào khổng lồ ngoại vi","U nhú gai","Odontoma phức hợp","U sợi tạo xương ngoại vi"],"a":3,"e":"U sợi tạo xương ngoại vi: tăng trưởng phản ứng ở nướu thanh thiếu niên/người trẻ (đỉnh 10–19 tuổi), nữ ưu thế, > 50% ở nhú nướu giữa răng cửa bên và răng nanh; vi thể nguyên bào sợi + khoáng hóa; tái phát 15–20%.","w":"","k":"","f":"Slide 20 ghi “hầu hết xuất hiện nướu ở hàm dưới”, nhưng y văn quốc tế ghi khoảng 60% ở HÀM TRÊN (Buchner & Hansen 1987, 207 ca; Neville). Câu hỏi tránh kiểm tra chi tiết hàm trên/dưới – hỏi lại giảng viên nếu cần.","s":"3.8 – slide 20, 21, 24"},{"c":"GPB38-20","t":"3.8","l":3,"p":"C","y":"Tình huống","q":"Phim X-quang: răng khôn hàm dưới chưa mọc, vùng thấu quang bao quanh thân răng; vi thể vách nang lót biểu mô không sừng hóa mỏng 2–3 lớp, gắn ở ranh giới men – xê-măng, ít tế bào viêm. Chẩn đoán phù hợp nhất:","o":["Nang chân răng","Nang thân răng (dentigerous cyst)","Ameloblastoma dạng nang","U răng phức hợp"],"a":1,"e":"Nang thân răng: quanh thân răng chưa mọc (răng khôn HD, răng nanh HT); dịch tích tụ giữa biểu mô men giảm sản và thân răng; biểu mô mỏng 2–3 lớp gắn ranh giới men–xê-măng; ít viêm trừ khi nhiễm trùng thứ phát.","w":"","k":"","f":"","s":"3.8 – slide 29"},{"c":"GPB38-21","t":"3.8","l":3,"p":"C","y":"Tình huống – phân loại","q":"Phim X-quang vùng răng trước hàm trên thấy nhiều cấu trúc nhỏ giống răng bình thường (denticles), bao quanh bởi viền thấu quang. Chẩn đoán phù hợp nhất:","o":["U răng phức hợp (complex odontoma)","U nguyên bào men","Nang chân răng","U răng hỗn hợp (compound odontoma)"],"a":3,"e":"U răng HỖN HỢP (compound): nhiều cấu trúc nhỏ giống răng, thường ở răng trước hàm trên. U răng PHỨC HỢP (complex): khối mô răng lộn xộn, không có hình răng, thường ở vùng răng hàm phía sau hàm dưới.","w":"","k":"Tiếng Việt: “hỗn hợp” = compound; “phức hợp” = complex – rất dễ nhầm.","f":"","s":"3.8 – slide 31, 32"},{"c":"GPB38-22","t":"3.8","l":3,"p":"C","y":"Chọn đáp án đúng","q":"Trên vi thể OSCC, đặc trưng cho sự BIỆT HÓA GAI là:","o":["Cầu sừng","Mất cực tính","Phân bào nhiều","Nhân tăng sắc"],"a":0,"e":"Vi thể OSCC: TB gai ác tính xâm nhập mô đệm, dị dạng nhân, tăng sắc, phân bào, mất cực tính – đây là đặc điểm ác tính; đặc trưng của biệt hóa gai là cầu sừng.","w":"","k":"","f":"","s":"3.8 – slide 39; 3.6 – slide 42"},{"c":"GPB38-34","t":"3.8","l":3,"p":"C","y":"Trình tự – cơ chế bệnh sinh","q":"Trình tự đúng của cơ chế hình thành nang chân răng là:","o":["Viêm tủy răng mạn → hoại tử tủy → kích thích biểu mô Malassez quanh chóp tăng sinh → hình thành nang lót biểu mô lát tầng không sừng hóa","Tạo thân răng hoàn tất → tích tụ dịch giữa biểu mô men giảm sản và thân răng → nang quanh thân răng ngầm","Biểu mô Malassez tăng sinh → viêm tủy → hoại tử tủy → nang","Hoại tử tủy → tạo men, ngà lộn xộn → khối cản quang"],"a":0,"e":"Nang chân răng: viêm tủy mạn → vùng chóp chân răng (hoại tử tủy) → kích thích tăng sinh biểu mô sót Malassez quanh chóp → nang; vỏ xơ thâm nhiễm viêm mạn.","w":"{#1} là cơ chế nang thân răng. {#2} đảo ngược nhân – quả. {#3} giống u răng, không phải nang.","k":"","f":"","s":"3.8 – slide 28"},{"c":"GPB38-23","t":"3.8","l":4,"p":"C","y":"Tình huống – vận dụng cao","q":"Nam 62 tuổi hút thuốc, uống rượu nhiều; vết loét bờ bên lưỡi 6 tuần không lành, bờ gồ cứng, ít đau, sờ thấy thâm nhiễm. Nhận định phù hợp nhất:","o":["Nghi carcinôm tế bào gai (OSCC) – cần sinh thiết","Loét áp-tơ tái phát – theo dõi vì tự giới hạn","Nhiễm HSV – loét cụm, tự khỏi","U nhú gai do HPV – cắt bỏ không cần GPB"],"a":0,"e":"Dấu hiệu cảnh báo: loét không lành + cứng + thâm nhiễm → nghĩ carcinoma; bờ bên lưỡi là vị trí thường gặp; thuốc lá, rượu là yếu tố nguy cơ; tổn thương > 2 tuần → sinh thiết bắt buộc.","w":"Áp-tơ: < 20 tuổi, < 5 mm, đau nhiều, tự lành. HSV: mụn nước → loét cụm, đau, tái phát ở vị trí cố định. U nhú gai: khối sùi có cuống, không phải loét thâm nhiễm.","k":"","f":"","s":"3.8 – slide 6, 11, 37, 38"},{"c":"GPB38-24","t":"3.8","l":4,"p":"T","y":"Chọn đáp án đúng – phân tích","q":"Về u sợi tạo xương ngoại vi, phát biểu nào ĐÚNG?","o":["Là cùng một thực thể với u sợi tạo xương trung ương","Không bao giờ tái phát sau cắt bỏ","Là u ác cần xạ trị","Chẩn đoán phân biệt gồm u sợi kích thích, u hạt sinh mủ và u hạt tế bào khổng lồ ngoại vi; điều trị cắt đến lớp màng xương"],"a":3,"e":"Hiện xem là thực thể riêng, không liên quan u sợi tạo xương trung ương; lâm sàng – hình thái giống u hạt sinh mủ; chẩn đoán phân biệt như đáp án {#3}; cắt đến màng xương giảm tái phát (15–20%).","w":"","k":"","f":"","s":"3.8 – slide 20, 24"},{"c":"GPB38-25","t":"3.8","l":4,"p":"C","y":"So sánh – vận dụng cao","q":"So sánh nang chân răng và nang thân răng, phát biểu nào ĐÚNG?","o":["Cả hai đều liên quan răng chết tủy","Nang chân răng liên quan chóp răng chết tủy, vỏ viêm mạn nhiều; nang thân răng bao quanh thân răng chưa mọc, biểu mô mỏng, ít viêm","Nang thân răng có nguồn gốc từ biểu mô Malassez","Nang chân răng gắn vào ranh giới men – xê-măng của răng ngầm"],"a":1,"e":"Nang chân răng: chóp răng, viêm tủy mạn/hoại tử tủy, biểu mô Malassez, viêm mạn nhiều. Nang thân răng: thân răng chưa mọc, biểu mô men giảm sản, gắn CEJ, ít viêm.","w":"","k":"{#2} và {#3} tráo đặc điểm giữa hai loại nang.","f":"","s":"3.8 – slide 28, 29"},{"c":"GPB38-26","t":"3.8","l":4,"p":"C","y":"Kết hợp nhiều nội dung","q":"Nam 65 tuổi hút thuốc lâu năm, có mảng trắng không cạo được ở sàn miệng 2 năm; gần đây mảng trở nên sùi, loét, cứng. Chuỗi diễn tiến mô học phù hợp nhất là:","o":["Bạch sản (tăng sừng, tăng gai) → nghịch sản → carcinôm tế bào gai xâm nhập","Nhiễm Candida → loét áp-tơ → u nhú","Chuyển sản trụ → u tuyến → carcinôm tuyến","U hạt tế bào khổng lồ → u sợi tạo xương → sarcôm"],"a":0,"e":"Bạch sản là tổn thương tiền ung; biểu mô có thể tiến triển nghịch sản → carcinôm TB gai. Loét không lành + cứng + thâm nhiễm → nghĩ carcinoma, cần sinh thiết.","w":"","k":"","f":"","s":"3.8 – slide 13, 38; 1.3 – slide 21; 3.6 – slide 86"},{"c":"GPB38-35","t":"3.8","l":4,"p":"C","y":"Kết hợp nhiều nội dung","q":"Sinh thiết mảng trắng ở niêm mạc má: biểu mô lát tầng tăng sừng, tăng gai; tế bào kích thước không đều, nhân tăng sắc, tỉ lệ N/BT tăng, sắp xếp rối loạn đến 1/3 giữa chiều dày biểu mô; màng đáy còn nguyên. Kết luận phù hợp nhất:","o":["Carcinôm tế bào gai xâm nhập","Bạch sản kèm nghịch sản vừa – tổn thương tiền ung, còn có thể hồi phục","Bạch sản kèm nghịch sản nặng – không hồi phục","Nhiễm nấm Candida"],"a":1,"e":"Tăng sừng, tăng gai = bạch sản. Rối loạn đến 1/3 giữa = nghịch sản vừa (nhẹ: < 1/3 dưới; nặng: đến 1/3 trên). Nghịch sản nhẹ – vừa còn khả hồi khi hết kích thích; màng đáy nguyên → chưa xâm nhập.","w":"Nghịch sản nặng khi tổn thương lên đến 1/3 trên. Chưa có xâm nhập mô đệm nên không phải carcinôm xâm nhập. Candida: mảng cạo được, vi thể sợi nấm.","k":"","f":"","s":"3.8 – slide 13; 1.3 – slide 19–21"},{"c":"GPBMR-01","t":"MR","l":1,"p":"Th","y":"Mở rộng – dịch tễ Việt Nam","q":"Theo nghiên cứu 111 ca ung thư tuyến nước bọt tại Bệnh viện Ung Bướu TP.HCM, loại thường gặp thứ hai sau carcinôm nhầy bì là:","o":["Carcinôm bọc dạng tuyến (dạng tuyến nang, adenoid cystic)","Carcinôm tế bào túi tuyến","U Warthin","Carcinôm tuyến NOS"],"a":0,"e":"Kết quả: carcinôm nhầy bì 53,2%, carcinôm bọc dạng tuyến 23,4%; ung thư TNB thường ở tuyến mang tai, nữ nhiều hơn nam, trên 40 tuổi.","w":"","k":"Bảng tần suất trong slide (theo Robbins) lại xếp carcinôm tế bào túi tuyến và carcinôm tuyến NOS (6%) trên carcinôm dạng tuyến nang (4%). Nếu đề hỏi “theo bài giảng”, dùng bảng slide.","f":"","s":"Mở rộng – Nguyễn Đức Tuấn và cs., “Dịch tễ và lâm sàng ung thư tuyến nước bọt”, Tạp chí Y học Việt Nam 2024"},{"c":"GPBMR-02","t":"MR","l":1,"p":"Th","y":"Mở rộng","q":"Theo MSD Manual, phần lớn (khoảng 85%) u tuyến nước bọt xuất phát ở tuyến nào?","o":["Tuyến dưới hàm","Tuyến dưới lưỡi","Tuyến nước bọt phụ","Tuyến mang tai"],"a":3,"e":"Khoảng 85% u tuyến nước bọt ở tuyến mang tai, sau đó là tuyến dưới hàm và tuyến phụ; khoảng 1% ở tuyến dưới lưỡi; 75–80% u tuyến nước bọt lành tính.","w":"","k":"","f":"","s":"Mở rộng – MSD Manual (bản tiếng Việt) “Các khối u tuyến nước bọt”"},{"c":"GPBMR-03","t":"MR","l":2,"p":"Th","y":"Mở rộng – thuật ngữ","q":"Các giáo trình GPB khác nhau dùng thuật ngữ khác nhau. Cặp tương ứng nào ĐÚNG với thuật ngữ trong bài giảng HIU?","o":["Quá sản = phì đại; dị sản = nghịch sản; loạn sản = chuyển sản","Quá sản = chuyển sản; dị sản = tăng sản; loạn sản = teo đét","Quá sản = tăng sản; dị sản = chuyển sản; loạn sản = nghịch sản","Quá sản = nghịch sản; dị sản = phì đại; loạn sản = tăng sản"],"a":2,"e":"Một số giáo trình (phía Bắc) dùng: quá sản (hyperplasia) = tăng sản; dị sản (metaplasia) = chuyển sản; loạn sản (dysplasia) = nghịch sản; thoái sản / bất thục sản (anaplasia) = suy giảm độ biệt hóa. Gặp đề từ nguồn khác thì quy đổi về thuật ngữ trong slide.","w":"","k":"Đề lấy từ nguồn khác có thể dùng “quá sản – dị sản – loạn sản” thay cho “tăng sản – chuyển sản – nghịch sản”.","f":"","s":"Mở rộng – thuật ngữ giáo trình GPB phía Bắc; ví dụ ngân hàng “Trắc nghiệm Giải phẫu bệnh có đáp án” (YhocData, studylib.net). Đối chiếu 1.3 – slide 4"},{"c":"GPBMR-04","t":"MR","l":2,"p":"Th","y":"Mở rộng – thuật ngữ","q":"Thuật ngữ “thoái sản” (còn gọi bất thục sản, anaplasia) trong một số giáo trình tương ứng với đặc điểm nào trong bài giảng?","o":["Giảm kích thước tế bào do giảm thành phần cấu tạo","Tế bào chuyển hướng biệt hóa để thích nghi","Giảm số lượng tế bào bằng chết tế bào theo chương trình","Suy giảm độ biệt hóa của tế bào u ác, từ ít đến mất biệt hóa hoàn toàn"],"a":3,"e":"Slide 3.6 nêu đặc trưng vi thể u ác là suy giảm độ biệt hóa (anaplasia) – từ ít đến nhiều hoặc mất biệt hóa hoàn toàn. Một số tài liệu gọi là thoái sản/bất thục sản: tế bào mất sự biệt hóa về cấu trúc và chức năng.","w":"{#0} là teo đét, {#1} là chuyển sản, {#2} là thoái triển (bài 1.3).","k":"Thoái SẢN (anaplasia, bài u) khác thoái TRIỂN (involution, bài 1.3).","f":"","s":"Mở rộng – thuật ngữ; đối chiếu 3.6 – slide 37 và 1.3 – slide 12, 15"},{"c":"GPBMR-05","t":"MR","l":2,"p":"Th","y":"Mở rộng","q":"Yếu tố nguy cơ được y văn ghi nhận liên quan mạnh với u Warthin là:","o":["Nhiễm virus quai bị","Hút thuốc lá","Bức xạ tia cực tím","Sỏi tuyến nước bọt"],"a":1,"e":"U Warthin liên quan chặt với hút thuốc lá; là u lành tuyến nước bọt thường gặp thứ hai (sau u tuyến đa dạng); hầu như chỉ ở tuyến mang tai; có thể ở cả hai bên (khoảng 5–14%).","w":"","k":"","f":"","s":"Mở rộng – Ohio State University Pathology, Case 64 (pathology.osu.edu); Wikipedia “Warthin's tumor”; PathologyOutlines “Warthin tumor”"},{"c":"GPBMR-06","t":"MR","l":3,"p":"Th","y":"Mở rộng","q":"Loại ung thư tuyến nước bọt nào có xu hướng lan dọc theo dây thần kinh, khó lấy hết, hay tái phát nhiều năm sau điều trị, và là u ác thường gặp nhất ở tuyến nước bọt phụ?","o":["Carcinôm nhầy bì","U tuyến đa dạng","Carcinôm bọc dạng tuyến (adenoid cystic carcinoma)","U Warthin"],"a":2,"e":"Carcinôm bọc dạng tuyến (dạng tuyến nang) thường phát triển chậm nhưng xâm nhập quanh thần kinh nên khó cắt hết và tái phát muộn; là u ác phổ biến nhất ở các tuyến nước bọt nhỏ (phụ).","w":"{#0} là u ác thường gặp nhất nói chung (thường ở tuyến mang tai). {#1} và {#3} là u lành.","k":"","f":"","s":"Mở rộng – MSD Manual (bản tiếng Việt) “Các khối u tuyến nước bọt”; Bệnh viện Tâm Anh “U tuyến nước bọt”"},{"c":"GPBMR-07","t":"MR","l":3,"p":"Th","y":"Mở rộng","q":"Ngoài vỏ bao không hoàn toàn (theo slide), y văn còn nêu đặc điểm mô học nào làm u tuyến đa dạng dễ tái phát khi chỉ bóc nhân (enucleation)?","o":["Giả túc (pseudopodia) xuyên qua vỏ và nốt vệ tinh","Hoại tử bã đậu trung tâm","Mô lympho dày đặc có trung tâm mầm","Calci hóa di căn"],"a":0,"e":"Yếu tố bệnh học liên quan tái phát: thể dạng nhầy, vỏ bao mỏng/không hoàn toàn, giả túc, nốt vệ tinh; yếu tố phẫu thuật: diện cắt dương tính, vỡ u. Vì vậy thường cắt thùy nông tuyến mang tai (bảo tồn dây VII) thay vì chỉ bóc nhân.","w":"","k":"","f":"","s":"Mở rộng – Tổng quan hệ thống về tái phát u tuyến đa dạng (PMC5430411); StatPearls “Pleomorphic Adenoma” (NCBI NBK430829)"}];

const NOTES = {"focus":[["1.1 – 1.2","Định nghĩa, phân loại, phương pháp; “father of…”; quy trình kỹ thuật: thứ tự, mục đích, nguyên tắc; hóa chất – thuốc nhuộm"],["1.3","Định nghĩa và ví dụ đáp ứng thích nghi; đại thể – vi thể; các hình thái hoại tử và bệnh lý liên quan"],["2.4","Phù, sung huyết, xuất huyết, huyết khối, thuyên tắc, nhồi máu (2 loại), sốc (giảm thể tích, nhiễm khuẩn)"],["2.5","Viêm cấp (cơ chế sưng nóng đỏ đau), viêm mạn, viêm hạt, 2 hình thức sửa chữa"],["3.6","Danh pháp & u giả; u lành vs u ác; 4 giai đoạn; 3 nhóm nguyên nhân; 4 loại gen"],["3.7","Viêm TNB (virus, vi khuẩn, tự miễn); u tuyến đa dạng, Warthin; carcinôm nhầy bì + grad"],["3.8","Kiểu biểu mô; tổn thương viêm loét; bạch sản; u lành; nang & u nguồn gốc răng; u ác: yếu tố nguy cơ, đại thể, vi thể"]],"pairs":[["Teo đét  vs  Thoái triển","Teo đét: giảm KÍCH THƯỚC tế bào. Thoái triển: giảm SỐ LƯỢNG tế bào bằng apoptosis (tuyến ức tuổi thiếu niên)."],["Chuyển sản  vs  Nghịch sản","Chuyển sản: đổi hướng biệt hóa (trụ → gai; thực quản: lát tầng → trụ). Nghịch sản: rối loạn tăng sinh, phân bào tăng nhưng KHÔNG bất thường."],["Hoại tử  vs  Tự hủy (apoptosis)","Hoại tử: TB phình, màng mất thấm, gây viêm. Apoptosis: TB co, bào quan nguyên vẹn, thể tự hủy, không viêm."],["Hoại tử đông  vs  hóa lỏng","Đông: thiếu oxy (tim), toan hóa ức chế enzyme → giữ cấu trúc. Hóa lỏng: enzyme mạnh – não, áp xe."],["Calci hóa nghịch dưỡng  vs  di căn","Nghịch dưỡng: mô CHẾT, calci máu bình thường. Di căn: mô SỐNG, tăng calci máu (cường cận giáp)."],["Hyaline  vs  Chất dạng fibrin","Hyaline: KHÔNG có viêm đi kèm. Dạng fibrin: LUÔN có viêm (THA ác tính, bệnh tạo keo)."],["Dịch thấm  vs  Dịch tiết","Thấm (không viêm): ít protein, d < 1,012. Tiết (viêm): protein ~3 g%, d > 1,020."],["Suy tim trái  vs  Suy tim phải","Trái → sung huyết PHỔI (“tế bào tim”). Phải → sung huyết GAN, tứ chi."],["Nhồi máu đỏ  vs  trắng","Đỏ: máu kép / nhu mô lỏng (phổi, ruột non). Trắng: một nguồn máu, nhu mô đặc (tim, thận, lách)."],["Mô hạt  vs  U hạt","Mô hạt: tăng sinh mô liên kết – mạch, đỏ, dễ chảy máu (hóa sẹo). U hạt: tập hợp TB dạng biểu mô < 2 mm (viêm hạt)."],["Selectin  vs  Integrin – ICAM-1","Selectin – Sialyl-Lewis X: bạch cầu LĂN. Integrin – ICAM-1: BÁM CHẶT, ngừng lăn, xuyên mạch."],["Langhans  vs  Đại bào ăn dị vật","Langhans: nhân xếp ở NGOẠI VI. Ăn dị vật: nhân RẢI RÁC trong bào tương."],["Sẹo lồi  vs  Sẹo co kéo","Sẹo lồi: thừa collagen. Sẹo co kéo: nguyên bào sợi-cơ hoạt động quá mức."],["Hamartoma  vs  Choristoma","Hamartoma: mô bình thường tăng sinh ĐÚNG chỗ. Choristoma: mô bình thường LẠC chỗ (lách ở bìu)."],["Carcinôm  vs  Sarcôm","Carcinôm (biểu mô): di căn chủ yếu đường BẠCH HUYẾT. Sarcôm (trung mô): đường MÁU."],["Grad mô học  vs  Giai đoạn","Grad: độ biệt hóa, phân bào… (chủ quan). Giai đoạn TNM: kích thước, hạch, di căn – tiên lượng tốt hơn."],["U Warthin  vs  Sjögren","Warthin: u có vỏ, biểu mô 2 lớp ái toan + mô lympho, chỉ tuyến mang tai. Sjögren: lympho quanh ống, khô miệng – mắt."],["Candida  vs  Bạch sản","Candida: mảng trắng CẠO ĐƯỢC, lộ nền đỏ. Bạch sản: KHÔNG cạo được, tiền ung (tăng sừng, tăng gai)."],["Nang chân răng  vs  Nang thân răng","Chân răng: chóp răng chết tủy, biểu mô Malassez, viêm nhiều. Thân răng: quanh thân răng chưa mọc, gắn CEJ, 2–3 lớp, ít viêm."],["U răng hỗn hợp  vs  phức hợp","Hỗn hợp (compound): nhiều “răng nhỏ”, răng trước hàm trên. Phức hợp (complex): khối lộn xộn, răng sau hàm dưới."],["U hạt TB khổng lồ  vs  U sợi tạo xương ngoại vi","PGCG: nốt đỏ tím, đại bào đa nhân, hemosiderin, tuổi TB 31–46. POF: 10–19 tuổi, nữ, nguyên bào sợi + khoáng hóa."],["AFP  vs  CEA","AFP: ung thư gan. CEA: ung thư ruột. (Ung thư phổi TB nhỏ: ACTH, ADH, serotonin.)"],["Thoái SẢN  vs  Thoái TRIỂN","Thoái sản (anaplasia): u ác suy giảm/mất biệt hóa. Thoái triển: giảm số lượng tế bào bằng apoptosis (tuyến ức)."],["Thuật ngữ giữa các giáo trình","Quá sản = tăng sản; dị sản = chuyển sản; loạn sản = nghịch sản (đề từ nguồn khác có thể dùng tên này)."]],"flags":[["1.2 – slide 4","Ghi “BƯỚC 4 – ĐỌC KẾT QUẢ”; theo trình tự đúng phải là bước 8."],["1.2 – slide 7","Mục đích cố định ghi “ngăn không để cứng mô”; một số sách kỹ thuật lại ghi formol làm mô chắc hơn – đề nguồn khác có thể hỏi ngược."],["1.2 – slide 8","Ghi “1/20” cạnh formol 10% không giải thích (thường hiểu là tỉ lệ thể tích mẫu : dung dịch cố định)."],["1.3 – slide 2 & 23","Mục tiêu ghi “4 loại ứ đọng nội bào” nhưng nội dung liệt kê 5 loại (nước, lipid, glucid, protein, sắc tố)."],["1.3 – slide 40","“Thể Rujjel” – thuật ngữ chuẩn là thể Russell (Russell body)."],["2.4 – slide 47","Thuyên tắc ối 1/80.000, tử vong 80% (slide); tài liệu mới: ~1/40.000 ca sinh, tử vong 20–60%."],["2.4 – slide 52 & 56","Slide 52 xếp GAN vào nhồi máu trắng (một nguồn máu), slide 56 lại nói gan tuần hoàn kép; Robbins chỉ nêu tim, thận, lách. Nhồi máu trắng ghi “mềm” – nhiều tài liệu mô tả chắc."],["2.4 – slide 58","Phần phân loại sốc trình bày gộp (sốc tim, giảm thể tích, thần kinh, phản vệ) – nên đọc kỹ lại."],["3.7 – slide 115","Carcinôm nhầy bì: đại thể “giới hạn rõ” nhưng vi thể “không vỏ bao, xâm nhập”; mặt cắt đặt dưới mục vi thể."],["3.8 – slide 15","U hạt TB khổng lồ ngoại vi ghi “hàm trên > hàm dưới”; nhiều nghiên cứu ghi HÀM DƯỚI nhiều hơn (~59%)."],["3.8 – slide 20","U sợi tạo xương ngoại vi ghi “hầu hết ở hàm dưới”; y văn (Buchner & Hansen 1987; Neville) ghi ~60% ở HÀM TRÊN."]],"priority":[["1.1","Định nghĩa, phân loại GPB (đại cương / chuyên biệt); vật liệu nghiên cứu; H&E, HMMD; các “father of…”","Nhuộm đặc biệt (Masson, Gomori, PAS, Congo…); Karyotype, PCR, ISH; các chuyên ngành","Chi tiết lịch sử Cổ – Trung đại; GPB 4.0, AI"],["1.2","8 bước quy trình; mục đích cố định, formol trung tính 10%; nguyên tắc cắt lọc; xử lý mô cồn → xylen → paraffin","Thông số: 1 mm/h, 6h/24h, pH 6–8, 60–70°C, 40–50°C, sáp 6:4; 8 bước nhuộm H&E; khử canxi","Dụng cụ cắt lọc, mã hóa thông tin hành chính"],["1.3","5 đáp ứng thích nghi + ví dụ sinh lý/bệnh lý; phân độ nghịch sản; hoại tử vs tự hủy; 5 hình thái hoại tử","Ứ đọng nội bào (nước, lipid, protein, sắc tố); lắng đọng ngoại bào (hyaline, fibrin, amyloid, calci, urat)","Cơ chế phân tử apoptosis chi tiết; bệnh tích tiêu thể"],["2.4","Phù (cơ chế, dịch thấm/tiết); sung huyết gan – phổi; dạng xuất huyết; huyết khối; thuyên tắc; nhồi máu đỏ/trắng; sốc","Tăng đông di truyền (Leiden); thuyên tắc mỡ, khí, ối; yếu tố ảnh hưởng nhồi máu","Số liệu dịch tễ, tần suất"],["2.5","Định nghĩa viêm; 3 đặc điểm viêm cấp + giải thích sưng nóng đỏ đau; viêm mạn; viêm hạt – u hạt lao; tái tạo vs hóa sẹo","Phân tử kết dính; chất trung gian hóa học; các loại dịch xuất; vai trò ĐTB","Bảng nguồn gốc chi tiết từng chất TGHH"],["3.6","Danh pháp u, u giả; u lành vs u ác (đại thể, vi thể); 4 giai đoạn phát triển; 3 nhóm nguyên nhân; 4 loại gen","Độ biệt hóa – grad; 4 bước xâm nhập; đường di căn; TNM; telomerase","Dịch tễ số liệu; điều trị, tầm soát"],["3.7","Viêm TNB do quai bị, vi khuẩn, tự miễn (Sjögren); u tuyến đa dạng; u Warthin; carcinôm nhầy bì + grad","Bảng tần suất u TNB lành/ác","Các u hiếm (oncocytoma, carcinôm tuyến nang…)"],["3.8","3 kiểu niêm mạc; loét áp-tơ, Candida, HSV; bạch sản; u nhú gai, u hạt TB khổng lồ & u sợi tạo xương ngoại vi; nang & u nguồn gốc răng; OSCC","Nguyên tắc tiếp cận (> 2 tuần → sinh thiết); sâu răng, viêm lợi, nha chu","Tổn thương do virus khác"]]};

</script>
<script>
"use strict";
// ---------- tiện ích ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const LET = ["A","B","C","D"];
const QMAP = Object.fromEntries(QUESTIONS.map(q => [q.c, q]));
const ORDER = Object.keys(CH);
const chShort = t => t === "MR" ? "Mở rộng" : "Bài " + t;
const chFull = t => t === "MR" ? CH[t] : "Bài " + t + " · " + CH[t];
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
// thay token {#i} (chỉ số phương án gốc) bằng chữ cái đang hiển thị
function tx(s, perm){ return esc(s).replace(/\{#(\d)\}/g, (m, i) => LET[perm.indexOf(+i)]); }

// ---------- lưu trữ ----------
const KEY = "gpb_hiu_quiz_v1";
let S;
function blank(){ return { q:{}, exams:[], set:{ shuffle:true }, v:1 }; }
function load(){ try { S = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(e){ S = blank(); }
  if (!S.q) S.q = {}; if (!S.exams) S.exams = []; if (!S.set) S.set = { shuffle:true }; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function st(id){ return S.q[id] || (S.q[id] = { n:0, c:0, w:0, wa:false, card:null, last:null }); }
function record(id, ok){ const s = st(id); s.n++; s.last = ok ? 1 : 0; if (ok){ s.c++; s.wa = false; } else { s.w++; s.wa = true; } save(); }
function makeOpts(q){ const perm = S.set.shuffle ? shuffle([0,1,2,3]) : [0,1,2,3]; return { perm, correct: perm.indexOf(q.a) }; }
load();

// ---------- thống kê ----------
function stats(){
  let done=0, c=0, n=0, wrongActive=0, unknown=0, known=0;
  const byT = {}, byL = {1:{total:0,c:0,n:0},2:{total:0,c:0,n:0},3:{total:0,c:0,n:0},4:{total:0,c:0,n:0}};
  for (const k of ORDER) byT[k] = { total:0, done:0, c:0, n:0 };
  for (const q of QUESTIONS){
    const s = S.q[q.c]; const t = byT[q.t]; t.total++; byL[q.l].total++;
    if (!s) continue;
    if (s.n > 0 || s.card) { done++; t.done++; }
    c += s.c; n += s.n; t.c += s.c; t.n += s.n; byL[q.l].c += s.c; byL[q.l].n += s.n;
    if (s.wa) wrongActive++;
    if (s.card === "u") unknown++; if (s.card === "k") known++;
  }
  return { done, c, n, acc: pct(c,n), wrongActive, unknown, known, byT, byL };
}

// ---------- điều hướng ----------
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  prac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>',
  wrong:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>'
};
const TABS = [["home","Tổng quan"],["prac","Luyện tập"],["exam","Thi thử"],["card","Flashcard"],["wrong","Câu sai"],["note","Ghi nhớ"]];
let view = "home";
let examTimer = null;
function go(v){
  if (view === "exam" && E && E.running && v !== "exam") { if (!confirm("Bạn đang làm bài thi. Rời đi sẽ huỷ bài thi này?")) return; stopExam(); E = null; }
  view = v; renderTabs(); render(); window.scrollTo(0,0);
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => {
    let badge = "";
    if (k === "wrong"){ const n = stats().wrongActive; if (n) badge = `<em class="bd">${n > 99 ? "99+" : n}</em>`; }
    return `<button class="${view===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${ICONS[k]}<span>${l}</span>${badge}</button>`;
  }).join("");
}
function render(){
  const f = { home:renderHome, prac:renderPrac, exam:renderExam, card:renderCard, wrong:renderWrong, note:renderNote }[view];
  $("#app").innerHTML = f(); if (f.after) f.after();
}
function chapterChips(sel, fn, withMR){
  const keys = ORDER.filter(k => withMR || k !== "MR");
  return `<div class="chips scroll"><button class="chip ${sel==='all'?'on':''}" onclick="${fn}('all')">Tất cả</button>` +
    keys.map(k => `<button class="chip ${sel===k?'on':''}" onclick="${fn}('${k}')" title="${esc(CH[k])}">${esc(chShort(k))}</button>`).join("") + `</div>`;
}
function levelChips(sel, fn){
  return `<div class="chips"><button class="chip ${sel==='all'?'on':''}" onclick="${fn}('all')">Mọi mức độ</button>` +
    [1,2,3,4].map(l => `<button class="chip ${sel===l?'on':''}" onclick="${fn}(${l})">${LV[l]}</button>`).join("") + `</div>`;
}
function qTags(q){
  return `<div class="tags"><span class="tag">${esc(chShort(q.t))}</span><span class="tag l${q.l}">${LV[q.l]}</span>` +
    (q.p === "C" ? `<span class="tag hi">Ưu tiên cao</span>` : "") + (q.t === "MR" ? `<span class="tag mr">Ngoài slide</span>` : "") +
    (q.f ? `<span class="tag warn">⚠ Cần xác minh</span>` : "") + `</div>`;
}
function explain(q, perm, ok){
  let h = ok === null ? `<div class="fb neutral">` : `<div class="fb ${ok?'ok':'bad'}"><b class="t">${ok?"✓ Chính xác!":"✗ Chưa đúng"}</b>`;
  if (ok !== true) h += `Đáp án đúng: <b>${LET[perm.indexOf(q.a)]}. ${esc(q.o[q.a])}</b><br>`;
  h += `<span>${tx(q.e, perm)}</span></div>`;
  if (q.w) h += `<div class="ex"><b>Vì sao phương án khác sai:</b> ${tx(q.w, perm)}</div>`;
  if (q.k) h += `<div class="trap"><b>Bẫy thường gặp:</b> ${tx(q.k, perm)}</div>`;
  if (q.f) h += `<div class="flag">⚠ <b>Cần xác minh:</b> ${esc(q.f)}</div>`;
  h += `<div class="src">Nguồn: ${esc(q.s)} · Mã câu ${esc(q.c)}</div>`;
  return h;
}

// ================= TỔNG QUAN =================
function renderHome(){
  const s = stats(); const total = QUESTIONS.length;
  const weak = Object.entries(s.byT).filter(([,t]) => t.n >= 3).map(([k,t]) => ({ k, acc: pct(t.c,t.n) })).sort((a,b) => a.acc - b.acc).slice(0,3);
  const best = S.exams.length ? Math.max(...S.exams.map(e => e.score)).toFixed(1) : "–";
  return `
  <h2>Tổng quan</h2>
  <div class="card">
    <div class="sec-title"><b>Tiến độ học tập</b><span class="muted">${s.done}/${total} câu</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${pct(s.done,total)}%"></i></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="P.list=null;go('prac')">Luyện tập tiếp</button>
      <button class="btn ghost" onclick="go('exam')">Thi thử</button>
    </div>
  </div>
  <div class="grid g4" style="margin-top:12px">
    <div class="stat"><b>${total}</b><span>Tổng số câu</span></div>
    <div class="stat"><b>${s.done}</b><span>Đã học</span></div>
    <div class="stat"><b>${s.acc}%</b><span>Tỷ lệ đúng (${s.c}/${s.n} lượt)</span></div>
    <div class="stat"><b style="color:var(--bad)">${s.wrongActive}</b><span>Câu sai cần ôn</span></div>
    <div class="stat"><b style="color:var(--ok)">${s.known}</b><span>Thẻ đã nhớ</span></div>
    <div class="stat"><b style="color:var(--warn)">${s.unknown}</b><span>Thẻ chưa nhớ</span></div>
    <div class="stat"><b>${S.exams.length}</b><span>Lần thi thử</span></div>
    <div class="stat"><b>${best}</b><span>Điểm thi cao nhất</span></div>
  </div>

  <h3>Theo bài</h3>
  <div class="card">
  ${ORDER.map(k => { const t = s.byT[k]; return `
    <div class="topicrow">

function questionCard(ctx, pickFn, navFn, wrongMode){

  </div>`;
}

function setExCh(t){ EX.ch = t; render(); }
function examPool(){ return QUESTIONS.filter(q => (EX.ch==="all" || q.t===EX.ch) && (EX.mr || q.t!=="MR")); }
function startRandom(){
  const pool = examPool(); const n = Math.min(EX.n, pool.length); let ids;
  if (EX.bal){
    ids = [];
    const by = {1:shuffle(pool.filter(q=>q.l===1)),2:shuffle(pool.filter(q=>q.l===2)),3:shuffle(pool.filter(q=>q.l===3)),4:shuffle(pool.filter(q=>q.l===4))};
    const want = {}; let sum = 0;
    for (const l of [1,2,3,4]){ want[l] = Math.round(n*QUOTA[l]); sum += want[l]; }
    want[2] += n - sum;
    for (const l of [1,2,3,4]) ids.push(...by[l].splice(0, want[l]).map(q=>q.c));
    if (ids.length < n){ const rest = shuffle([].concat(by[1],by[2],by[3],by[4])); ids.push(...rest.slice(0, n-ids.length).map(q=>q.c)); }
  } else ids = shuffle(pool).slice(0, n).map(q=>q.c);
  startExam(ids, `Ngẫu nhiên ${n} câu`, n*EX.perQ);
}
function startExam(ids, name, dur){

}
