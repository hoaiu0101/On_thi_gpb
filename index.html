  <h3>Theo bài</h3>
  <div class="card"><table class="h"><tr><th>Bài</th><th>Đúng</th><th>Tỷ lệ</th></tr>${ORDER.filter(k=>by[k]).map(k=>`<tr><td>${esc(chFull(k))}</td><td>${by[k].c}/${by[k].n}</td><td><span class="pill ${pct(by[k].c,by[k].n)<60?'bad':'ok'}">${pct(by[k].c,by[k].n)}%</span></td></tr>`).join("")}</table></div>
  <h3>Xem lại bài làm</h3>
  <div class="chips" style="margin-bottom:10px">${[["all","Tất cả"],["w","Sai"],["b","Bỏ trống"],["r","Đúng"]].map(([k,l])=>`<button class="chip ${E.rf===k?'on':''}" onclick="E.rf='${k}';render()">${l}</button>`).join("")}</div>
  ${list.length ? list.map(({x,k}) => reviewItem(x,k)).join("") : `<div class="card empty">Không có câu nào.</div>`}`;
}
function reviewItem(x, k){
  const q = QMAP[x.id]; const s_ = x.pick===null ? "b" : x.pick===x.o.correct ? "r" : "w";
  return `<div class="card">
    <div class="qhead"><span>Câu ${k+1} · ${esc(q.c)} · ${esc(chShort(q.t))}</span><span class="pill ${s_==='r'?'ok':'bad'}">${s_==='r'?'Đúng':s_==='w'?'Sai':'Bỏ trống'}</span></div>
    <div class="qtext" style="font-size:16px;margin-top:4px">${esc(q.q)}</div>
    <div class="opts">${x.o.perm.map((oi,j)=>`<div class="opt ${j===x.o.correct?'right':(j===x.pick?'wrong':'')}"><span class="k">${LET[j]}</span><span>${esc(q.o[oi])}</span></div>`).join("")}</div>
    ${explain(q, x.o.perm, s_==='r')}
  </div>`;
}

// ================= FLASHCARD =================
const F = { ch:"all", queue:null, i:0, flip:false, mode:"smart" };
function buildCards(){
  let qs = QUESTIONS.filter(q => F.ch==="all" || q.t===F.ch);
  const rank = q => { const c = (S.q[q.c]||{}).card; return c==="u" ? 0 : c==null ? 1 : 2; };
  if (F.mode === "smart") qs = shuffle(qs).sort((a,b) => rank(a)-rank(b));
  else if (F.mode === "unknown") qs = shuffle(qs.filter(q => (S.q[q.c]||{}).card==="u"));
  F.queue = qs.map(q => q.c); F.i = 0; F.flip = false;
}
function setFCh(t){ F.ch = t; F.queue = null; render(); }
function setFMode(m){ F.mode = m; F.queue = null; render(); }
function renderCard(){
  if (!F.queue) buildCards();
  const s = stats();
  const head = `<h2>Flashcard</h2>${chapterChips(F.ch,"setFCh",true)}
  <div class="chips" style="margin:10px 0 14px">
    <button class="chip ${F.mode==='smart'?'on':''}" onclick="setFMode('smart')">Ưu tiên chưa nhớ</button>
    <button class="chip ${F.mode==='unknown'?'on':''}" onclick="setFMode('unknown')">Chỉ thẻ chưa nhớ (${s.unknown})</button>
    <button class="chip ${F.mode==='seq'?'on':''}" onclick="setFMode('seq')">Theo thứ tự</button>
  </div>`;
  if (!F.queue.length) return head + `<div class="card empty">Không có thẻ nào trong mục này.</div>`;
  if (F.i >= F.queue.length) return head + `<div class="card empty"><div style="font-size:36px">🎉</div><b>Hoàn thành lượt ôn!</b><div style="margin:6px 0 14px">Đã nhớ ${s.known} · Chưa nhớ ${s.unknown}</div><button class="btn" onclick="F.queue=null;render()">Ôn lượt mới</button></div>`;
  const q = QMAP[F.queue[F.i]]; const c = (S.q[q.c]||{}).card; const perm = [0,1,2,3];
  return head + `
  <div class="qhead"><span>Thẻ ${F.i+1}/${F.queue.length} · ${esc(q.c)}</span><span>${c==="k"?'<span class="pill ok">Đã nhớ</span>':c==="u"?'<span class="pill bad">Chưa nhớ</span>':''}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${pct(F.i,F.queue.length)}%"></i></div>
  <div class="fc-wrap"><div class="fc ${F.flip?'flip':''}" id="fc" onclick="flipCard()">
    <div class="face front"><div class="lb">Câu hỏi · ${esc(chShort(q.t))} · ${LV[q.l]}</div><div class="q">${esc(q.q)}</div>
      <ol type="A">${q.o.map(o=>`<li>${esc(o)}</li>`).join("")}</ol><div class="hint">Chạm để lật thẻ</div></div>
    <div class="face back"><div class="lb">Đáp án</div><div class="ans">${LET[q.a]}. ${esc(q.o[q.a])}</div><div style="font-size:15px">${tx(q.e, perm)}</div>
      ${q.k?`<div class="trap"><b>Bẫy:</b> ${tx(q.k, perm)}</div>`:""}${q.f?`<div class="flag">⚠ ${esc(q.f)}</div>`:""}<div class="src">Nguồn: ${esc(q.s)}</div></div>
  </div></div>
  <div class="row" style="margin-top:14px">
    <button class="btn bad" onclick="rateCard('u')">✗ Chưa nhớ</button>
    <button class="btn ok" onclick="rateCard('k')">✓ Đã nhớ</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn ghost" ${F.i===0?"disabled":""} onclick="F.i--;F.flip=false;render()">‹ Thẻ trước</button>
    <button class="btn ghost" onclick="flipCard()">Lật thẻ</button>
  </div>`;
}
renderCard.after = () => {
  const fc = $("#fc"); if (!fc) return; let h = 360;
  fc.querySelectorAll(".face").forEach(f => { f.style.position = "relative"; h = Math.max(h, f.scrollHeight); f.style.position = ""; });
  fc.style.minHeight = h + "px";
};
function flipCard(){ F.flip = !F.flip; const fc = $("#fc"); if (fc) fc.classList.toggle("flip", F.flip); }
function rateCard(v){
  const id = F.queue[F.i]; st(id).card = v; save();
  if (v === "u" && F.mode !== "seq"){ const pos = Math.min(F.queue.length, F.i + 5); F.queue.splice(pos, 0, id); }
  F.i++; F.flip = false; render(); renderTabs();
}

// ================= ÔN CÂU SAI =================
const W = { list:null, i:0, running:false };
function wrongIds(){ return QUESTIONS.filter(q => (S.q[q.c]||{}).wa).map(q => q.c); }
function renderWrong(){
  if (W.running) return renderWrongRun();
  const ids = wrongIds();
  const hist = QUESTIONS.filter(q => (S.q[q.c]||{}).w > 0).sort((a,b) => S.q[b.c].w - S.q[a.c].w);
  return `<h2>Ôn tập câu sai</h2>
  <div class="card">
    <div class="grid g2">
      <div class="stat"><b style="color:var(--bad)">${ids.length}</b><span>Câu đang sai</span></div>
      <div class="stat"><b>${hist.length}</b><span>Câu từng sai</span></div>
    </div>
    <div class="muted" style="font-size:14px;margin:12px 0">Câu trả lời sai (và câu bỏ trống khi thi) được tự động lưu. Làm lại đến khi đúng thì câu rời khỏi danh sách; số lần sai vẫn được ghi nhận.</div>
    <div class="row">
      <button class="btn" ${ids.length?"":"disabled"} onclick="startWrong()">Làm lại câu sai</button>
      <button class="btn ghost" ${ids.length?"":"disabled"} onclick="startExam(wrongIds(),'Đề từ câu sai',wrongIds().length*75)">Tạo đề từ câu sai</button>
    </div>
  </div>
  <h3>Theo dõi số lần sai</h3>
  <div class="card">${hist.length ? `<div class="list">${hist.map(q => { const s = S.q[q.c]; return `<div class="it"><span class="q"><b>${esc(q.c)}</b> ${esc(q.q.length>110?q.q.slice(0,110)+"…":q.q)}</span><span class="pill ${s.wa?'bad':'ok'}">${s.wa?'Sai':'Đã sửa'} · ${s.w}×</span></div>`; }).join("")}</div>` : `<div class="empty">Chưa có câu sai nào. Hãy luyện tập hoặc thi thử!</div>`}</div>`;
}
function startWrong(){ const ids = shuffle(wrongIds()); W.list = ids.map(id => ({ id, o: makeOpts(QMAP[id]), pick:null })); W.i = 0; W.running = true; render(); }
function renderWrongRun(){
  if (!W.list || !W.list.length){ W.running = false; return renderWrong(); }
  const left = W.list.filter(x => x.pick===null).length;
  const head = `<div class="sec-title" style="margin-bottom:10px"><h2 style="margin:0">Làm lại câu sai</h2><button class="btn ghost sm" onclick="W.running=false;render()">Thoát</button></div>`;
  if (W.i >= W.list.length){
    const still = wrongIds().length;
    return head + `<div class="card empty"><div style="font-size:36px">${still?'💪':'🎉'}</div><b>${still?`Còn ${still} câu chưa đúng`:'Đã sửa hết câu sai!'}</b><div class="row" style="margin-top:14px">${still?`<button class="btn" onclick="startWrong()">Làm lại các câu còn sai</button>`:''}<button class="btn ghost" onclick="W.running=false;render()">Về danh sách</button></div></div>`;
  }
  return head + questionCard(W, "wrongPick", "wrongNav", true) + `<div class="muted" style="text-align:center;font-size:13px;margin-top:8px">Còn ${left} câu chưa trả lời trong lượt này</div>`;
}
function wrongPick(k){ const it = W.list[W.i]; if (it.pick !== null) return; it.pick = k; record(it.id, k===it.o.correct); render(); renderTabs(); }
function wrongNav(d){ if (d > 0 && W.i === W.list.length-1) W.i++; else W.i = Math.max(0, Math.min(W.list.length-1, W.i+d)); render(); window.scrollTo(0,0); }

// ================= GHI NHỚ =================
const N = { tab:"focus", q:"" };
function renderNote(){
  const tabs = [["focus","Trọng tâm"],["pairs","Dễ nhầm"],["flags","Cần xác minh"],["search","Tra cứu"]];
  const head = `<h2>Ghi nhớ</h2><div class="chips" style="margin-bottom:14px">${tabs.map(([k,l])=>`<button class="chip ${N.tab===k?'on':''}" onclick="N.tab='${k}';render()">${l}</button>`).join("")}</div>`;
  if (N.tab === "pairs") return head + NOTES.pairs.map(p => `<div class="card pair"><b>${esc(p[0])}</b><div style="margin-top:6px">${esc(p[1])}</div></div>`).join("");
  if (N.tab === "flags"){
    const fq = QUESTIONS.filter(q => q.f);
    return head + `<div class="card"><div class="muted small" style="margin-bottom:8px">Chỗ slide gốc chưa rõ hoặc khác tài liệu khác – nên hỏi lại giảng viên. Khi thi theo bài giảng, ưu tiên nội dung slide.</div>
      <table class="h"><tr><th>Vị trí</th><th>Vấn đề</th></tr>${NOTES.flags.map(f=>`<tr><td style="white-space:nowrap"><b>${esc(f[0])}</b></td><td>${esc(f[1])}</td></tr>`).join("")}</table></div>
      <h3>Câu hỏi có ghi chú cần xác minh (${fq.length})</h3>
      <div class="card"><div class="list">${fq.map(q=>`<div class="it"><span class="q"><b>${esc(q.c)}</b> ${esc(q.f)}</span><button class="btn sm ghost" onclick="N.tab='search';N.q='${q.c}';render()">Xem</button></div>`).join("")}</div></div>`;
  }
  if (N.tab === "search") return head + `<input type="search" id="sq" placeholder="Nhập từ khoá hoặc mã câu (VD: Warthin, nhồi máu, GPB38-20)" value="${esc(N.q)}" oninput="N.q=this.value;searchResults()" autocomplete="off">
    <div class="muted small" style="margin:8px 0">Tìm không dấu cũng được. Thứ tự A–D ở đây trùng với file PowerPoint/Excel.</div><div id="sr"></div>`;
  // focus
  return head + NOTES.priority.map(p => {
    const f = NOTES.focus.find(x => x[0].split(/\s*[–-]\s*/).includes(p[0])) || ["",""];
    const n = QUESTIONS.filter(q => q.t === p[0]).length;
    return `<div class="card"><div class="sec-title"><b>${esc(chFull(p[0]))}</b><span class="muted small">${n} câu</span></div>
      <dl class="kv" style="margin-top:10px"><dt>GV khoanh vùng</dt><dd>${esc(f[1])}</dd><dt>Cốt lõi</dt><dd>${esc(p[1])}</dd><dt>Bổ trợ</dt><dd>${esc(p[2])}</dd><dt>Ít quan trọng</dt><dd class="muted">${esc(p[3])}</dd></dl>
      <button class="btn sm soft" style="margin-top:12px" onclick="P.ch='${p[0]}';P.lv='all';P.pri=false;P.list=null;go('prac')">Luyện bài này</button></div>`;
  }).join("");
}
renderNote.after = () => { if (N.tab === "search") searchResults(); };
function searchResults(){
  const box = $("#sr"); if (!box) return;
  const k = norm(N.q.trim());
  if (k.length < 2){ box.innerHTML = `<div class="card empty">Gõ ít nhất 2 ký tự để tìm trong ${QUESTIONS.length} câu.</div>`; return; }
  const res = QUESTIONS.filter(q => norm([q.c, q.q, q.o.join(" "), q.e, q.w, q.k, q.s].join(" ")).includes(k)).slice(0, 40);
  if (!res.length){ box.innerHTML = `<div class="card empty">Không tìm thấy câu phù hợp.</div>`; return; }
  const perm = [0,1,2,3];
  box.innerHTML = `<div class="muted small" style="margin-bottom:8px">${res.length >= 40 ? "Hiện 40 kết quả đầu" : res.length + " kết quả"}</div>` + res.map(q => `<details class="res"><summary><span class="muted small">${esc(q.c)} · ${esc(chShort(q.t))} · ${LV[q.l]}</span><br>${esc(q.q)}</summary>
    <div class="opts" style="margin-top:10px">${q.o.map((o,j)=>`<div class="opt ${j===q.a?'right':''}"><span class="k">${LET[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>${explain(q, perm, null)}</details>`).join("");
}

// ---------- khởi động ----------
$("#subtitle").textContent = `${QUESTIONS.length} câu · 8 bài + mở rộng · 3 đề mô phỏng`;
renderTabs(); render();
window.addEventListener("beforeunload", e => { if (E && E.running) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  const k = e.key.toUpperCase(); const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(e.key);
  if (view === "card" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flipCard(); return; }
  if (idx >= 0 && e.key.length === 1){
    if (view === "prac" && P.list && P.list.length) pracPick(idx);
    else if (view === "exam" && E && E.running) examPick(idx);
    else if (view === "wrong" && W.running && W.i < W.list.length) wrongPick(idx);
  }
  if (e.key === "ArrowRight"){ if (view === "prac") pracNav(1); else if (view === "exam" && E && E.running) examNav(1); }
  if (e.key === "ArrowLeft"){ if (view === "prac") pracNav(-1); else if (view === "exam" && E && E.running) examNav(-1); }
});
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
